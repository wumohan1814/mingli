# Gradle 守护进程内存与编码（Windows 上中文资源/日志不乱码的关键）。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 并行与构建缓存。
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX：本项目 POC-0 不用 AndroidX 依赖，但保持开关为 true 以防后续引入。
android.useAndroidX=true

# 非传递 R 类：每个模块只生成自己的 R，加快构建、减小方法数。
android.nonTransitiveRClass=true

# AGP 8.7 官方最高只认 compileSdk 35，这里用 36，加这个开关压掉警告（不是错误）。
android.suppressUnsupportedCompileSdk=36

# Kotlin 官方代码风格。
kotlin.code.style=official

# 如果 gradle 报 “Unsupported class file major version” / 找不到 JDK 21，
# 可以解开下面这行指定 JDK 21 的绝对路径（Windows 用正斜杠）：
# org.gradle.java.home=C:/path/to/jdk21
# 更推荐的做法：在 PowerShell 里先执行  . C:\AndroidDev\env.ps1
# 由 env.ps1 统一设置 JAVA_HOME / ANDROID_HOME，这样 gradle 会自动用对 JDK。

# 刻意不设置 kotlin.jvm.target.validation.mode：让 Kotlin/Java 的 17 目标校验保持默认（会报错提醒），
# 而不是悄悄跳过校验。
