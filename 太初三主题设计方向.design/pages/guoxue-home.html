<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国学预测 · 首页</title>
    <style id="theme-vars">
/* 太初 · 三主题统一设计系统 v1.1
 * 共同骨架：午夜蓝 + 香槟金 + 象牙白 + Cormorant 衬线
 * 皮肤签名：国学（玉青/朱砂/山海经线描）、西式占卜（紫晶/深空蓝/卡牌框纹）、心理测试（暖杏/雾蓝/Notion 简笔头像）
 * v1.1 质感升级：加大圆角、柔和多层阴影、磨砂玻璃卡片
 */

:root {
  /* ===== 原始 token（跨文化共用） ===== */
  /* 午夜绒蓝 */
  --taichu-ink-50: #EEF1F8;
  --taichu-ink-100: #D6DCEF;
  --taichu-ink-200: #AEB9DE;
  --taichu-ink-300: #8493CB;
  --taichu-ink-400: #5E6FB3;
  --taichu-ink-500: #44558F;
  --taichu-ink-600: #364573;
  --taichu-ink-700: #2C385C;
  --taichu-ink-800: #232C49;
  --taichu-ink-900: #1A2138;

  /* 香槟金 */
  --taichu-gold-300: #E6CF9A;
  --taichu-gold-400: #D4B06A;
  --taichu-gold-500: #B8893E;
  --taichu-gold-600: #9C6E2E;
  --taichu-gold-700: #7E5824;

  /* 中性色 */
  --taichu-paper: #F7F4EC;
  --taichu-surface: #FFFFFF;
  --taichu-surface-warm: #FEFCF8;
  --taichu-text-1: #1F1F26;
  --taichu-text-2: #5C5C68;
  --taichu-text-3: #8A8A94;
  --taichu-border-warm: #E5E0D4;

  /* 字体 */
  --taichu-font-serif: "Noto Serif SC", "Cormorant Garamond", "Songti SC", serif;
  --taichu-font-sans: "Noto Sans SC", "Inter", system-ui, sans-serif;
  --taichu-font-latin-serif: "Cormorant Garamond", "Noto Serif SC", serif;

  /* 字号 */
  --taichu-fs-display: 32px;
  --taichu-fs-h1: 28px;
  --taichu-fs-h2: 22px;
  --taichu-fs-h3: 18px;
  --taichu-fs-body-l: 16px;
  --taichu-fs-body: 14px;
  --taichu-fs-caption: 12px;
  --taichu-fs-disclaimer: 11px;

  /* 间距 */
  --taichu-sp-1: 8px;
  --taichu-sp-2: 16px;
  --taichu-sp-3: 24px;
  --taichu-sp-4: 32px;
  --taichu-sp-6: 48px;

  /* 圆角：v1.1 整体加大，强化圆弧式高级感 */
  --taichu-radius-sm: 10px;
  --taichu-radius-md: 14px;
  --taichu-radius-lg: 20px;
  --taichu-radius-xl: 28px;
  --taichu-radius-pill: 999px;

  /* 阴影：v1.1 更柔和、更有层次 */
  --taichu-shadow-card: 0 4px 24px rgba(26, 33, 56, 0.06), 0 1px 2px rgba(26, 33, 56, 0.04);
  --taichu-shadow-elevated: 0 8px 32px rgba(26, 33, 56, 0.08), 0 2px 4px rgba(26, 33, 56, 0.04);
  --taichu-shadow-float: 0 16px 48px rgba(26, 33, 56, 0.10), 0 4px 8px rgba(26, 33, 56, 0.04);

  /* 磨砂玻璃 */
  --taichu-glass-blur: 20px;
  --taichu-glass-saturate: 160%;
  --taichu-glass-opacity: 0.90;

  /* 动效 */
  --taichu-ease: cubic-bezier(0.4, 0, 0.2, 1);
  --taichu-dur: 220ms;

  /* ===== 默认语义别名（中性基底） ===== */
  --taichu-background: var(--taichu-paper);
  --taichu-foreground: var(--taichu-text-1);
  --taichu-card: rgba(255, 255, 255, 0.90);
  --taichu-card-foreground: var(--taichu-text-1);
  --taichu-popover: rgba(255, 255, 255, 0.94);
  --taichu-popover-foreground: var(--taichu-text-1);
  --taichu-primary: var(--taichu-ink-700);
  --taichu-primary-foreground: var(--taichu-paper);
  --taichu-muted: var(--taichu-ink-50);
  --taichu-muted-foreground: var(--taichu-text-3);
  --taichu-border: var(--taichu-border-warm);
  --taichu-input: var(--taichu-border-warm);
  --taichu-ring: var(--taichu-gold-500);

  /* 主题签名变量（默认国学） */
  --taichu-skin-accent: #3E7C6B;
  --taichu-skin-accent-soft: rgba(62, 124, 107, 0.14);
  --taichu-skin-accent-ink: #F7F4EC;
  --taichu-skin-banner: #B23A3A;
  --taichu-skin-banner-ink: #F7F4EC;
  --taichu-skin-glow: rgba(62, 124, 107, 0.18);
}

/* ===== 国学：上美留白 + 山海经线描 ===== */
[data-theme="guoxue"] {
  --taichu-primary: #3E7C6B;
  --taichu-primary-foreground: #F7F4EC;
  --taichu-skin-accent: #3E7C6B;
  --taichu-skin-accent-soft: rgba(62, 124, 107, 0.14);
  --taichu-skin-accent-ink: #F7F4EC;
  --taichu-skin-banner: #B23A3A;
  --taichu-skin-banner-ink: #F7F4EC;
  --taichu-skin-glow: rgba(178, 58, 58, 0.10);
  --taichu-background: #F7F4EC;
  --taichu-card: rgba(255, 255, 255, 0.90);
  --taichu-popover: rgba(255, 255, 255, 0.94);
}

/* ===== 西式占卜：紫黑沉浸 + 卡牌框纹 ===== */
[data-theme="xishi"] {
  --taichu-primary: #5B4B8A;
  --taichu-primary-foreground: #F7F4EC;
  --taichu-skin-accent: #C9A24B;
  --taichu-skin-accent-soft: rgba(201, 162, 75, 0.18);
  --taichu-skin-accent-ink: #1F1F26;
  --taichu-skin-banner: #5B4B8A;
  --taichu-skin-banner-ink: #F7F4EC;
  --taichu-skin-glow: rgba(91, 75, 138, 0.22);
  --taichu-background: #1A2138;
  --taichu-foreground: #F7F4EC;
  --taichu-card: rgba(35, 44, 73, 0.88);
  --taichu-card-foreground: #F7F4EC;
  --taichu-popover: rgba(35, 44, 73, 0.92);
  --taichu-border: rgba(230, 207, 154, 0.22);
}

/* ===== 心理测试：晨光象牙 + Notion 简笔头像 ===== */
[data-theme="psych"] {
  --taichu-primary: #5B7A8C;
  --taichu-primary-foreground: #FFFFFF;
  --taichu-skin-accent: #5B7A8C;
  --taichu-skin-accent-soft: rgba(91, 122, 140, 0.12);
  --taichu-skin-accent-ink: #FFFFFF;
  --taichu-skin-banner: #E6A57A;
  --taichu-skin-banner-ink: #1F1F26;
  --taichu-skin-glow: rgba(230, 165, 122, 0.16);
  --taichu-background: #FDFBF8;
  --taichu-foreground: #2D2D35;
  --taichu-card: rgba(255, 255, 255, 0.92);
  --taichu-card-foreground: #2D2D35;
  --taichu-popover: rgba(255, 255, 255, 0.96);
  --taichu-border: #EDE8DF;
}

/* ===== 全局磨砂玻璃增强 ===== */
.bg-card,
.bg-popover {
  backdrop-filter: blur(var(--taichu-glass-blur)) saturate(var(--taichu-glass-saturate));
  -webkit-backdrop-filter: blur(var(--taichu-glass-blur)) saturate(var(--taichu-glass-saturate));
}

/* 显式玻璃工具类，供后续需要强调磨砂质感的元素使用 */
.glass {
  background-color: var(--taichu-card);
  backdrop-filter: blur(var(--taichu-glass-blur)) saturate(var(--taichu-glass-saturate));
  -webkit-backdrop-filter: blur(var(--taichu-glass-blur)) saturate(var(--taichu-glass-saturate));
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--taichu-background);
    --color-foreground: var(--taichu-foreground);
    --color-card: var(--taichu-card);
    --color-card-foreground: var(--taichu-card-foreground);
    --color-popover: var(--taichu-popover);
    --color-popover-foreground: var(--taichu-popover-foreground);
    --color-primary: var(--taichu-primary);
    --color-primary-foreground: var(--taichu-primary-foreground);
    --color-muted: var(--taichu-muted);
    --color-muted-foreground: var(--taichu-muted-foreground);
    --color-border: var(--taichu-border);
    --color-input: var(--taichu-input);
    --color-ring: var(--taichu-ring);
    --radius-sm: var(--taichu-radius-sm);
    --radius-md: var(--taichu-radius-md);
    --radius-lg: var(--taichu-radius-lg);
    --radius-xl: var(--taichu-radius-xl);

  @layer base {
    body { background: var(--taichu-background); color: var(--taichu-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

<body class="min-h-screen font-sans antialiased bg-background text-foreground" data-theme="guoxue">
    <main class="max-w-md mx-auto px-5 py-6 space-y-5">
        <!-- 顶部品牌栏 -->
        <header class="flex items-center justify-between">
            <img src="../assets/taichu-logo.svg" alt="太初" class="w-9 h-9">
            <span class="text-[length:var(--taichu-fs-h3)] font-serif tracking-[0.18em] text-foreground">太初 · 国学</span>
        </header>

        <!-- Hero 区 -->
        <section class="relative overflow-hidden rounded-lg bg-card border border-[var(--taichu-gold-400)] p-6 text-center shadow-[var(--taichu-shadow-card)]">
            <div class="pointer-events-none absolute inset-0 opacity-[0.08]" style="background-image: url('../assets/taichu-pattern.svg'); background-size: 140%; background-position: center; background-repeat: no-repeat;"></div>
            <div class="relative z-10">
                <h1 class="text-[length:var(--taichu-fs-display)] leading-tight font-serif text-card-foreground mb-2">知命而不惧</h1>
                <p class="text-[length:var(--taichu-fs-body)] text-muted-foreground leading-relaxed">以东方智慧，为当下选择提供一盏灯</p>
            </div>
        </section>

        <!-- 快速入口卡片网格 -->
        <section class="grid grid-cols-2 gap-3">
            <a href="#" class="group flex flex-col items-center gap-3 rounded-lg bg-card border border-[var(--taichu-gold-400)] p-4 shadow-[var(--taichu-shadow-card)] transition-transform duration-[var(--taichu-dur)] ease-[var(--taichu-ease)] hover:-translate-y-0.5 active:scale-[0.98]">
                <div class="w-10 h-10 rounded-full bg-[var(--taichu-skin-accent-soft)] text-[var(--taichu-skin-accent)] flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </div>
                <span class="text-[length:var(--taichu-fs-body-l)] font-serif text-card-foreground">八字精批</span>
            </a>
            <a href="#" class="group flex flex-col items-center gap-3 rounded-lg bg-card border border-[var(--taichu-gold-400)] p-4 shadow-[var(--taichu-shadow-card)] transition-transform duration-[var(--taichu-dur)] ease-[var(--taichu-ease)] hover:-translate-y-0.5 active:scale-[0.98]">
                <div class="w-10 h-10 rounded-full bg-[var(--taichu-skin-accent-soft)] text-[var(--taichu-skin-accent)] flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                </div>
                <span class="text-[length:var(--taichu-fs-body-l)] font-serif text-card-foreground">紫微斗数</span>
            </a>
            <a href="#" class="group flex flex-col items-center gap-3 rounded-lg bg-card border border-[var(--taichu-gold-400)] p-4 shadow-[var(--taichu-shadow-card)] transition-transform duration-[var(--taichu-dur)] ease-[var(--taichu-ease)] hover:-translate-y-0.5 active:scale-[0.98]">
                <div class="w-10 h-10 rounded-full bg-[var(--taichu-skin-banner)]/10 text-[var(--taichu-skin-banner)] flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
                </div>
                <span class="text-[length:var(--taichu-fs-body-l)] font-serif text-card-foreground">奇门遁甲</span>
            </a>
            <a href="#" class="group flex flex-col items-center gap-3 rounded-lg bg-card border border-[var(--taichu-gold-400)] p-4 shadow-[var(--taichu-shadow-card)] transition-transform duration-[var(--taichu-dur)] ease-[var(--taichu-ease)] hover:-translate-y-0.5 active:scale-[0.98]">
                <div class="w-10 h-10 rounded-full bg-[var(--taichu-skin-banner)]/10 text-[var(--taichu-skin-banner)] flex items-center justify-center">

                <span class="text-[length:var(--taichu-fs-body-l)] font-serif text-card-foreground">姓名测算</span>
            </a>
        </section>

        <!-- 今日宜忌长卡 -->
        <section class="overflow-hidden rounded-lg bg-card border border-[var(--taichu-gold-400)] shadow-[var(--taichu-shadow-card)]">
            <div class="bg-[var(--taichu-skin-accent)] text-[var(--taichu-skin-accent-ink)] p-5 space-y-3">
                <div class="flex items-center gap-3">
                    <span class="inline-flex items-center justify-center w-7 h-7 rounded bg-[var(--taichu-skin-accent-ink)]/15 text-[length:var(--taichu-fs-h3)] font-serif">宜</span>
                    <span class="text-[length:var(--taichu-fs-body-l)]">签约、启程</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="inline-flex items-center justify-center w-7 h-7 rounded bg-[var(--taichu-skin-banner)]/30 text-[length:var(--taichu-fs-h3)] font-serif">忌</span>
                    <span class="text-[length:var(--taichu-fs-body-l)]">借贷、动土</span>
                </div>
            </div>
            <div class="p-3 text-center bg-card">
                <span class="inline-block px-3 py-1 rounded-full border border-[var(--taichu-gold-400)] text-[var(--taichu-gold-600)] text-[length:var(--taichu-fs-caption)] font-serif">乙巳年 · 春分</span>
            </div>
        </section>

        <!-- CTA 大按钮 -->
        <button type="button" class="w-full py-4 rounded-full bg-[var(--taichu-primary)] text-[var(--taichu-primary-foreground)] text-[length:var(--taichu-fs-body-l)] font-serif shadow-[var(--taichu-shadow-card)] transition-transform duration-[var(--taichu-dur)] ease-[var(--taichu-ease)] hover:scale-[1.02] active:scale-[0.98]">
            开始测算
        </button>

        <!-- 底部品牌免责声明 -->
        <footer class="text-center text-[var(--taichu-text-3)] text-[length:var(--taichu-fs-disclaimer)] pt-2">
            内容由 AI 生成，仅供娱乐参考 · 太初
        </footer>
    </main>
    <style>
      .font-serif { font-family: var(--taichu-font-serif); }
      .font-sans { font-family: var(--taichu-font-sans); }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
