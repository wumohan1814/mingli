<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三主题页面样例</title>
    <style id="theme-vars">
/* 太初 · 三主题统一设计系统 v1.1
 * 共同骨架：午夜蓝 + 香槟金 + 象牙白 + Cormorant 衬线
 * 皮肤签名：国学（玉青/朱砂/山海经线描）、西式占卜（紫晶/深空蓝/卡牌框纹）、心理测试（暖杏/雾蓝/Notion 简笔头像）
 * v1.1 质感升级：加大圆角、柔和多层阴影、磨砂玻璃卡片
 */

:root {
  /* ===== 原始 token（跨文化共用） ===== */
  /* 午夜绒蓝 */
  --taichu-ink-50: #EEF1F8;
  --taichu-ink-100: #D6DCEF;
  --taichu-ink-200: #AEB9DE;
  --taichu-ink-300: #8493CB;
  --taichu-ink-400: #5E6FB3;
  --taichu-ink-500: #44558F;
  --taichu-ink-600: #364573;
  --taichu-ink-700: #2C385C;
  --taichu-ink-800: #232C49;
  --taichu-ink-900: #1A2138;

  /* 香槟金 */
  --taichu-gold-300: #E6CF9A;
  --taichu-gold-400: #D4B06A;
  --taichu-gold-500: #B8893E;
  --taichu-gold-600: #9C6E2E;
  --taichu-gold-700: #7E5824;

  /* 中性色 */
  --taichu-paper: #F7F4EC;
  --taichu-surface: #FFFFFF;
  --taichu-surface-warm: #FEFCF8;
  --taichu-text-1: #1F1F26;
  --taichu-text-2: #5C5C68;
  --taichu-text-3: #8A8A94;
  --taichu-border-warm: #E5E0D4;

  /* 字体 */
  --taichu-font-serif: "Noto Serif SC", "Cormorant Garamond", "Songti SC", serif;
  --taichu-font-sans: "Noto Sans SC", "Inter", system-ui, sans-serif;
  --taichu-font-latin-serif: "Cormorant Garamond", "Noto Serif SC", serif;

  /* 字号 */
  --taichu-fs-display: 32px;
  --taichu-fs-h1: 28px;
  --taichu-fs-h2: 22px;
  --taichu-fs-h3: 18px;
  --taichu-fs-body-l: 16px;
  --taichu-fs-body: 14px;
  --taichu-fs-caption: 12px;
  --taichu-fs-disclaimer: 11px;

  /* 间距 */
  --taichu-sp-1: 8px;
  --taichu-sp-2: 16px;
  --taichu-sp-3: 24px;
  --taichu-sp-4: 32px;
  --taichu-sp-6: 48px;

  /* 圆角：v1.1 整体加大，强化圆弧式高级感 */
  --taichu-radius-sm: 10px;
  --taichu-radius-md: 14px;
  --taichu-radius-lg: 20px;
  --taichu-radius-xl: 28px;
  --taichu-radius-pill: 999px;

  /* 阴影：v1.1 更柔和、更有层次 */
  --taichu-shadow-card: 0 4px 24px rgba(26, 33, 56, 0.06), 0 1px 2px rgba(26, 33, 56, 0.04);
  --taichu-shadow-elevated: 0 8px 32px rgba(26, 33, 56, 0.08), 0 2px 4px rgba(26, 33, 56, 0.04);
  --taichu-shadow-float: 0 16px 48px rgba(26, 33, 56, 0.10), 0 4px 8px rgba(26, 33, 56, 0.04);

  /* 磨砂玻璃 */
  --taichu-glass-blur: 20px;
  --taichu-glass-saturate: 160%;
  --taichu-glass-opacity: 0.90;

  /* 动效 */
  --taichu-ease: cubic-bezier(0.4, 0, 0.2, 1);
  --taichu-dur: 220ms;

  /* ===== 默认语义别名（中性基底） ===== */
  --taichu-background: var(--taichu-paper);
  --taichu-foreground: var(--taichu-text-1);
  --taichu-card: rgba(255, 255, 255, 0.90);
  --taichu-card-foreground: var(--taichu-text-1);
  --taichu-popover: rgba(255, 255, 255, 0.94);
  --taichu-popover-foreground: var(--taichu-text-1);
  --taichu-primary: var(--taichu-ink-700);
  --taichu-primary-foreground: var(--taichu-paper);
  --taichu-muted: var(--taichu-ink-50);
  --taichu-muted-foreground: var(--taichu-text-3);
  --taichu-border: var(--taichu-border-warm);
  --taichu-input: var(--taichu-border-warm);
  --taichu-ring: var(--taichu-gold-500);

  /* 主题签名变量（默认国学） */
  --taichu-skin-accent: #3E7C6B;
  --taichu-skin-accent-soft: rgba(62, 124, 107, 0.14);
  --taichu-skin-accent-ink: #F7F4EC;
  --taichu-skin-banner: #B23A3A;
  --taichu-skin-banner-ink: #F7F4EC;
  --taichu-skin-glow: rgba(62, 124, 107, 0.18);
}

/* ===== 国学：上美留白 + 山海经线描 ===== */
[data-theme="guoxue"] {
  --taichu-primary: #3E7C6B;
  --taichu-primary-foreground: #F7F4EC;
  --taichu-skin-accent: #3E7C6B;
  --taichu-skin-accent-soft: rgba(62, 124, 107, 0.14);
  --taichu-skin-accent-ink: #F7F4EC;
  --taichu-skin-banner: #B23A3A;
  --taichu-skin-banner-ink: #F7F4EC;
  --taichu-skin-glow: rgba(178, 58, 58, 0.10);
  --taichu-background: #F7F4EC;
  --taichu-card: rgba(255, 255, 255, 0.90);
  --taichu-popover: rgba(255, 255, 255, 0.94);
}

/* ===== 西式占卜：紫黑沉浸 + 卡牌框纹 ===== */
[data-theme="xishi"] {
  --taichu-primary: #5B4B8A;
  --taichu-primary-foreground: #F7F4EC;
  --taichu-skin-accent: #C9A24B;
  --taichu-skin-accent-soft: rgba(201, 162, 75, 0.18);
  --taichu-skin-accent-ink: #1F1F26;
  --taichu-skin-banner: #5B4B8A;
  --taichu-skin-banner-ink: #F7F4EC;
  --taichu-skin-glow: rgba(91, 75, 138, 0.22);
  --taichu-background: #1A2138;
  --taichu-foreground: #F7F4EC;
  --taichu-card: rgba(35, 44, 73, 0.88);
  --taichu-card-foreground: #F7F4EC;
  --taichu-popover: rgba(35, 44, 73, 0.92);
  --taichu-border: rgba(230, 207, 154, 0.22);
}

/* ===== 心理测试：晨光象牙 + Notion 简笔头像 ===== */
[data-theme="psych"] {
  --taichu-primary: #5B7A8C;
  --taichu-primary-foreground: #FFFFFF;
  --taichu-skin-accent: #5B7A8C;
  --taichu-skin-accent-soft: rgba(91, 122, 140, 0.12);
  --taichu-skin-accent-ink: #FFFFFF;
  --taichu-skin-banner: #E6A57A;
  --taichu-skin-banner-ink: #1F1F26;
  --taichu-skin-glow: rgba(230, 165, 122, 0.16);
  --taichu-background: #FDFBF8;
  --taichu-foreground: #2D2D35;
  --taichu-card: rgba(255, 255, 255, 0.92);
  --taichu-card-foreground: #2D2D35;
  --taichu-popover: rgba(255, 255, 255, 0.96);
  --taichu-border: #EDE8DF;
}

/* ===== 全局磨砂玻璃增强 ===== */
.bg-card,
.bg-popover {
  backdrop-filter: blur(var(--taichu-glass-blur)) saturate(var(--taichu-glass-saturate));
  -webkit-backdrop-filter: blur(var(--taichu-glass-blur)) saturate(var(--taichu-glass-saturate));
}

/* 显式玻璃工具类，供后续需要强调磨砂质感的元素使用 */
.glass {
  background-color: var(--taichu-card);
  backdrop-filter: blur(var(--taichu-glass-blur)) saturate(var(--taichu-glass-saturate));
  -webkit-backdrop-filter: blur(var(--taichu-glass-blur)) saturate(var(--taichu-glass-saturate));
}

    </style>

    th { @apply whitespace-nowrap; }
  }
