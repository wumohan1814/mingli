<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* 太初 · 三主题统一设计系统 v1.0
 * 共同骨架：午夜蓝 + 香槟金 + 象牙白 + Cormorant 衬线
 * 皮肤签名：国学（玉青/朱砂/山海经线描）、西式占卜（紫晶/深空蓝/卡牌框纹）、心理测试（暖杏/雾蓝/Notion 简笔头像）
 */

:root {
  /* ===== 原始 token（跨文化共用） ===== */
  /* 午夜绒蓝 */
  --taichu-ink-50: #EEF1F8;
  --taichu-ink-100: #D6DCEF;
  --taichu-ink-200: #AEB9DE;
  --taichu-ink-300: #8493CB;
  --taichu-ink-400: #5E6FB3;
  --taichu-ink-500: #44558F;
  --taichu-ink-600: #364573;
  --taichu-ink-700: #2C385C;
  --taichu-ink-800: #232C49;
  --taichu-ink-900: #1A2138;

  /* 香槟金 */
  --taichu-gold-300: #E6CF9A;
  --taichu-gold-400: #D4B06A;
  --taichu-gold-500: #B8893E;
  --taichu-gold-600: #9C6E2E;
  --taichu-gold-700: #7E5824;

  /* 中性色 */
  --taichu-paper: #F7F4EC;
  --taichu-surface: #FFFFFF;
  --taichu-surface-warm: #FEFCF8;
  --taichu-text-1: #1F1F26;
  --taichu-text-2: #5C5C68;
  --taichu-text-3: #8A8A94;
  --taichu-border-warm: #E5E0D4;

  /* 字体 */
  --taichu-font-serif: "Noto Serif SC", "Cormorant Garamond", "Songti SC", serif;
  --taichu-font-sans: "Noto Sans SC", "Inter", system-ui, sans-serif;
  --taichu-font-latin-serif: "Cormorant Garamond", "Noto Serif SC", serif;

  /* 字号 */
  --taichu-fs-display: 32px;
  --taichu-fs-h1: 28px;
  --taichu-fs-h2: 22px;
  --taichu-fs-h3: 18px;
  --taichu-fs-body-l: 16px;
  --taichu-fs-body: 14px;
  --taichu-fs-caption: 12px;
  --taichu-fs-disclaimer: 11px;

  /* 间距 */
  --taichu-sp-1: 8px;
  --taichu-sp-2: 16px;
  --taichu-sp-3: 24px;
  --taichu-sp-4: 32px;
  --taichu-sp-6: 48px;

  /* 圆角 */
  --taichu-radius-sm: 8px;
  --taichu-radius-md: 12px;
  --taichu-radius-lg: 16px;
  --taichu-radius-pill: 999px;

  /* 阴影 */
  --taichu-shadow-card: 0 2px 12px rgba(26, 33, 56, 0.10);

  /* 动效 */
  --taichu-ease: cubic-bezier(0.4, 0, 0.2, 1);
  --taichu-dur: 220ms;

  /* ===== 默认语义别名（中性基底） ===== */
  --taichu-background: var(--taichu-paper);
  --taichu-foreground: var(--taichu-text-1);
  --taichu-card: var(--taichu-surface);
  --taichu-card-foreground: var(--taichu-text-1);
  --taichu-popover: var(--taichu-surface);
  --taichu-popover-foreground: var(--taichu-text-1);
  --taichu-primary: var(--taichu-ink-700);
  --taichu-primary-foreground: var(--taichu-paper);
  --taichu-muted: var(--taichu-ink-50);
  --taichu-muted-foreground: var(--taichu-text-3);
  --taichu-border: var(--taichu-border-warm);
  --taichu-input: var(--taichu-border-warm);
  --taichu-ring: var(--taichu-gold-500);
  --taichu-radius-sm: var(--taichu-radius-sm);
  --taichu-radius-md: var(--taichu-radius-md);
  --taichu-radius-lg: var(--taichu-radius-lg);

  /* 主题签名变量（默认国学） */
  --taichu-skin-accent: #3E7C6B;
  --taichu-skin-accent-soft: rgba(62, 124, 107, 0.14);
  --taichu-skin-accent-ink: #F7F4EC;
  --taichu-skin-banner: #B23A3A;
  --taichu-skin-banner-ink: #F7F4EC;
  --taichu-skin-glow: rgba(62, 124, 107, 0.18);
}

/* ===== 国学：上美留白 + 山海经线描 ===== */
[data-theme="guoxue"] {
  --taichu-primary: #3E7C6B;
  --taichu-primary-foreground: #F7F4EC;
  --taichu-skin-accent: #3E7C6B;
  --taichu-skin-accent-soft: rgba(62, 124, 107, 0.14);
  --taichu-skin-accent-ink: #F7F4EC;
  --taichu-skin-banner: #B23A3A;
  --taichu-skin-banner-ink: #F7F4EC;
  --taichu-skin-glow: rgba(178, 58, 58, 0.10);
  --taichu-background: #F7F4EC;
}

/* ===== 西式占卜：紫黑沉浸 + 卡牌框纹 ===== */
[data-theme="xishi"] {
  --taichu-primary: #5B4B8A;
  --taichu-primary-foreground: #F7F4EC;
  --taichu-skin-accent: #C9A24B;
  --taichu-skin-accent-soft: rgba(201, 162, 75, 0.18);
  --taichu-skin-accent-ink: #1F1F26;
  --taichu-skin-banner: #5B4B8A;
  --taichu-skin-banner-ink: #F7F4EC;
  --taichu-skin-glow: rgba(91, 75, 138, 0.22);
  --taichu-background: #1A2138;
  --taichu-foreground: #F7F4EC;
  --taichu-card: #232C49;
  --taichu-card-foreground: #F7F4EC;
  --taichu-border: rgba(230, 207, 154, 0.22);
}

/* ===== 心理测试：晨光象牙 + Notion 简笔头像 ===== */
[data-theme="psych"] {
  --taichu-primary: #5B7A8C;
  --taichu-primary-foreground: #FFFFFF;
  --taichu-skin-accent: #5B7A8C;
  --taichu-skin-accent-soft: rgba(91, 122, 140, 0.12);
  --taichu-skin-accent-ink: #FFFFFF;
  --taichu-skin-banner: #E6A57A;
  --taichu-skin-banner-ink: #1F1F26;
  --taichu-skin-glow: rgba(230, 165, 122, 0.16);
  --taichu-background: #FDFBF8;
  --taichu-foreground: #2D2D35;
  --taichu-card: #FFFFFF;
  --taichu-card-foreground: #2D2D35;
  --taichu-border: #EDE8DF;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--taichu-background);
    --color-foreground: var(--taichu-foreground);
    --color-card: var(--taichu-card);
    --color-card-foreground: var(--taichu-card-foreground);
    --color-popover: var(--taichu-popover);
    --color-popover-foreground: var(--taichu-popover-foreground);
    --color-primary: var(--taichu-primary);
    --color-primary-foreground: var(--taichu-primary-foreground);
    --color-muted: var(--taichu-muted);
    --color-muted-foreground: var(--taichu-muted-foreground);
    --color-border: var(--taichu-border);
    --color-input: var(--taichu-input);
    --color-ring: var(--taichu-ring);
    --radius-sm: var(--taichu-radius-sm);
    --radius-md: var(--taichu-radius-md);
    --radius-lg: var(--taichu-radius-lg);
  }
  @layer base {
    body { background: var(--taichu-background); color: var(--taichu-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--taichu-background); }
      .text-background { color: var(--taichu-background); }
      .border-background { border-color: var(--taichu-background); }
      .ring-background { --tw-ring-color: var(--taichu-background); }
      .bg-foreground { background-color: var(--taichu-foreground); }
      .text-foreground { color: var(--taichu-foreground); }
      .border-foreground { border-color: var(--taichu-foreground); }
      .ring-foreground { --tw-ring-color: var(--taichu-foreground); }
      .bg-card { background-color: var(--taichu-card); }
      .text-card { color: var(--taichu-card); }
      .border-card { border-color: var(--taichu-card); }
      .ring-card { --tw-ring-color: var(--taichu-card); }
      .bg-card-foreground { background-color: var(--taichu-card-foreground); }
      .text-card-foreground { color: var(--taichu-card-foreground); }
      .border-card-foreground { border-color: var(--taichu-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--taichu-card-foreground); }
      .bg-popover { background-color: var(--taichu-popover); }
      .text-popover { color: var(--taichu-popover); }
      .border-popover { border-color: var(--taichu-popover); }
      .ring-popover { --tw-ring-color: var(--taichu-popover); }
      .bg-popover-foreground { background-color: var(--taichu-popover-foreground); }
      .text-popover-foreground { color: var(--taichu-popover-foreground); }
      .border-popover-foreground { border-color: var(--taichu-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--taichu-popover-foreground); }
      .bg-primary { background-color: var(--taichu-primary); }
      .text-primary { color: var(--taichu-primary); }
      .border-primary { border-color: var(--taichu-primary); }
      .ring-primary { --tw-ring-color: var(--taichu-primary); }
      .bg-primary-foreground { background-color: var(--taichu-primary-foreground); }
      .text-primary-foreground { color: var(--taichu-primary-foreground); }
      .border-primary-foreground { border-color: var(--taichu-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--taichu-primary-foreground); }
      .bg-muted { background-color: var(--taichu-muted); }
      .text-muted { color: var(--taichu-muted); }
      .border-muted { border-color: var(--taichu-muted); }
      .ring-muted { --tw-ring-color: var(--taichu-muted); }
      .bg-muted-foreground { background-color: var(--taichu-muted-foreground); }
      .text-muted-foreground { color: var(--taichu-muted-foreground); }
      .border-muted-foreground { border-color: var(--taichu-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--taichu-muted-foreground); }
      .bg-border { background-color: var(--taichu-border); }
      .text-border { color: var(--taichu-border); }
      .border-border { border-color: var(--taichu-border); }
      .ring-border { --tw-ring-color: var(--taichu-border); }
      .bg-input { background-color: var(--taichu-input); }
      .text-input { color: var(--taichu-input); }
      .border-input { border-color: var(--taichu-input); }
      .ring-input { --tw-ring-color: var(--taichu-input); }
      .bg-ring { background-color: var(--taichu-ring); }
      .text-ring { color: var(--taichu-ring); }
      .border-ring { border-color: var(--taichu-ring); }
      .ring-ring { --tw-ring-color: var(--taichu-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <main>preflight</main>
</body>
</html>
