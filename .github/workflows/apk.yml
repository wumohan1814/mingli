name: apk-poc0

# 只在 APK 相关文件变动时跑，避免无谓消耗。
on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: 构建 debug APK（POC-0）
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 与 app 内 Chaquopy 的 Python 版本保持一致（3.13）。
      # Chaquopy 的 pyc 预编译要用同版本 Python：装上了就打预编译包（启动更快），
      # 构建脚本里做了探测，万一这步被去掉也只是跳过优化，不会让构建失败。
      - name: 安装 Python 3.13（供 Chaquopy 字节码预编译用）
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # setup-gradle 会自动处理 Gradle 下载与构建缓存，因此不需要额外的缓存步骤，
      # 也不需要执行 gradle --version 之类的探测命令。
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # CI 用 bash 版同步脚本；Windows 开发机上用同目录的 sync-assets.ps1。
      - name: 同步内置资源（python / 前端 / 排盘产物）
        run: bash apk/tools/sync-assets.sh

      - name: 构建 debug APK
        working-directory: apk
        # GitHub 的 runner 在境外，官方源（Google Maven / Maven Central）本来就近，
        # 所以显式关掉 settings.gradle.kts 里默认打开的国内镜像（见该文件顶部说明）。
        run: gradle assembleDebug -PmingliApkUseChinaMirrors=false

      - name: 构建摘要
        working-directory: apk
        run: |
          set -euo pipefail
          echo "## POC-0 debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "产物路径：\`apk/app/build/outputs/apk/debug/app-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l app/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY"
          du -h app/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "--- 本地产物列表 ---"
          ls -l app/build/outputs/apk/debug/*.apk
          du -h app/build/outputs/apk/debug/*.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: mingli-apk-poc0-debug
          path: apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
