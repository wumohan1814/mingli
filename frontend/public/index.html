<!DOCTYPE html>
<html lang="zh-CN" data-skin="guoxue">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>太初 · 识己于星，安己于时</title>
  <!-- BUG-009：脚本必须用根绝对路径 /vendor/...（不能用相对 ./vendor/...）。
       分享链接直达页路径为 /mbti/share/{token}，相对路径会被浏览器解析为
       /mbti/share/vendor/... → SPA fallback 回退 index.html（text/html 被当 JS 执行）
       → React 加载失败 → 整页白屏。站点部署在域名根，根绝对路径在首页与深层路由都正确。 -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/regions.js"></script>
  <style>
    :root{
      /* 主色 墨蓝 / 靛青 */
      --ink-300:#3A4570; --ink-400:#5E6FB3; --ink-500:#44558F; --ink-600:#364573; --ink-700:#2C385C; --ink-900:#1A2138;
      /* 金 / 玉 / 朱砂 */
      --gold-300:#E6CF9A; --gold-500:#B8893E; --gold-600:#9C6E2E;
      --jade-500:#3E7C6B; --cinnabar:#B23A3A; --error:#C0392B;
      /* 中性 宣纸暖灰 */
      --paper:#F7F4EC; --surface:#FFFFFF; --text-1:#1F1F26; --text-2:#5C5C68; --text-3:#8A8A94; --border:#E5E0D4;
      /* 字体 */
      --font-serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
      --font-sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Hiragino Sans GB",sans-serif;
      --font-latin-serif:Georgia,"Times New Roman",serif;
      /* 圆角 / 阴影 */
      --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
      --shadow-card:0 2px 12px rgba(26,33,56,.10);
      --dur:.22s; --ease:cubic-bezier(.4,0,.2,1);

      /* ===== 多文化皮肤（v1.2.7 最终）：内部标识色=玉青（按钮/吉），顶部 Banner + 底部胶囊=朱砂红 ===== */
      --skin-accent:#3E7C6B;
      --skin-accent-soft:rgba(62,124,107,.14);
      --skin-accent-ink:#F7F4EC;
      --skin-banner:#B23A3A;
      --skin-banner-ink:#F7F4EC;
      --skin-tag-bg:rgba(0,0,0,.16);

      /* REQ-061⑤：美术必备 6 张（frontend/public/art/…，运行期仅用 WebP α；PNG 为母版随仓库保留）。
         url 用根绝对路径（BUG-009：页面经 pushState 无 URL 切换，深层分享路由下相对路径会 404）。
         变量未定义/删除时，各消费者 var(--art-XXX, fallback渐变) 自动回退占位渐变；URL 加载失败则露背景色。 */
      --art-ssgw-tube:url('/art/ssgw/ssgw-tube.webp');
      --art-ssgw-stick:url('/art/ssgw/ssgw-stick.webp');
      --art-card-back-tarot:url('/art/card-back/card-back-tarot.webp');
      --art-card-back-lenormand:url('/art/card-back/card-back-lenormand.webp');
      --art-coin-face:url('/art/liuyao/coin-face.webp');
      --art-coin-back:url('/art/liuyao/coin-back.webp');
    }
    /* 西式占星：内部=深空蓝；顶部 Banner=月银 */
    [data-skin="astrology"]{
      --skin-accent:#2A3A5C; --skin-accent-soft:rgba(42,58,92,.14); --skin-accent-ink:#F7F4EC;
      --skin-banner:#C9CBD3; --skin-banner-ink:#1F1F26; --skin-tag-bg:rgba(255,255,255,.55);
    }
    /* 塔罗：内部=琥珀；顶部 Banner=紫晶 */
    [data-skin="tarot"]{
      --skin-accent:#C9A24B; --skin-accent-soft:rgba(201,162,75,.18); --skin-accent-ink:#1F1F26;
      --skin-banner:#5B4B8A; --skin-banner-ink:#F7F4EC; --skin-tag-bg:rgba(0,0,0,.16);
    }
    /* 西式占卜 HUB：内部=紫晶；顶部 Banner=琥珀（与塔罗互置） */
    [data-skin="xishi"]{
      --skin-accent:#5B4B8A; --skin-accent-soft:rgba(91,75,138,.18); --skin-accent-ink:#F7F4EC;
      --skin-banner:#C9A24B; --skin-banner-ink:#1F1F26; --skin-tag-bg:rgba(0,0,0,.14);
    }
    /* 星座（=原占星）：内部=深空蓝；顶部 Banner=月银 */
    [data-skin="xingzuo"]{
      --skin-accent:#2A3A5C; --skin-accent-soft:rgba(42,58,92,.14); --skin-accent-ink:#F7F4EC;
      --skin-banner:#C9CBD3; --skin-banner-ink:#1F1F26; --skin-tag-bg:rgba(255,255,255,.55);
    }
    /* MBTI：内部=靛蓝；顶部 Banner=薄荷 */
    [data-skin="mbti"]{
      --skin-accent:#4A5BB5; --skin-accent-soft:rgba(74,91,181,.16); --skin-accent-ink:#F7F4EC;
      --skin-banner:#7ED3C6; --skin-banner-ink:#16302C; --skin-tag-bg:rgba(0,0,0,.12);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{font-family:var(--font-sans);color:var(--text-1);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
    .serif{font-family:var(--font-serif)}
    button{font-family:inherit;cursor:pointer;border:none;background:none}
    input,select,textarea{font-family:inherit}

    /* 星点背景（星象式沉浸感，低透明度不影响阅读） */
    .starfield{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.55;
      background:
        radial-gradient(1px 1px at 18% 28%, rgba(230,207,154,.8), transparent),
        radial-gradient(1px 1px at 76% 18%, rgba(230,207,154,.55), transparent),
        radial-gradient(1.6px 1.6px at 52% 62%, rgba(255,255,255,.55), transparent),
        radial-gradient(1px 1px at 86% 74%, rgba(230,207,154,.65), transparent),
        radial-gradient(1.2px 1.2px at 12% 82%, rgba(255,255,255,.45), transparent),
        radial-gradient(1.4px 1.4px at 33% 12%, rgba(230,207,154,.5), transparent);
      background-repeat:no-repeat;animation:twinkle 6s ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.7}}

    /* REQ-060：全局页脚贴底 —— .app-shell 改为 flex 纵列：页面内容 .view-enter flex:1 吸收余高，
       内容不足一屏时把页脚（免责声明等）推贴视口底；内容超一屏时随文档流自然落页尾（不悬浮、不遮挡）。
       100dvh 兜底移动端动态视口；env(safe-area-inset-bottom) 避开 iOS 底部指示条。无 JS 监听。 */
    .app-shell{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding-top:58px;padding-bottom:env(safe-area-inset-bottom)}
    .app-shell>.view-enter{flex:1 0 auto}
    .container{max-width:480px;margin:0 auto;padding:24px 20px}

    /* 顶部固定 Banner（随主题换色） */
    .topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
      padding:12px 20px;background:var(--skin-banner);color:var(--skin-banner-ink);
      box-shadow:0 1px 0 var(--gold-500),0 6px 18px rgba(26,33,56,.18);transition:background var(--dur) var(--ease)}
    .brand{font-family:var(--font-serif);font-weight:700;font-size:18px;letter-spacing:.04em}
    .brand .dot{color:var(--gold-300);margin:0 2px}
    .topbar .tagline{font-size:12px;opacity:.85}
    .topbar-side{display:flex;align-items:baseline;gap:12px;min-width:0}

    /* 右上角菜单区：登录按钮 + 汉堡下拉 */
    .topbar-menu{position:relative;display:flex;align-items:center;flex:none}
    .topbar-menu .menu-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;
      background:rgba(128,128,150,.18);color:var(--skin-banner-ink);transition:background .18s ease}
    .topbar-menu .menu-btn:hover{background:rgba(128,128,150,.32)}
    .topbar-menu .menu-btn .bars{display:flex;flex-direction:column;gap:4px;width:16px;pointer-events:none}
    .topbar-menu .menu-btn .bars .bar{height:2px;border-radius:2px;background:currentColor}
    .menu-login-btn{display:flex;align-items:center;gap:6px;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:600;
      color:var(--skin-banner-ink);background:transparent;border:1px solid var(--skin-banner-ink);line-height:1.4;white-space:nowrap;
      transition:background .18s ease,color .18s ease}
    .menu-login-btn:hover{background:var(--skin-banner-ink);color:var(--skin-banner)}

    /* REQ-051/REQ-087：右上角菜单面板顶部余额（仅登录、点开菜单即见；余额 ÷ 汇率 → ¥，汇率动态读 system_configs.recharge_rate，读不到按 10） */
    .topbar-balance{display:inline-flex;align-items:center;gap:6px;margin-right:10px;padding:6px 12px;border-radius:999px;background:rgba(128,128,150,.2);color:var(--skin-banner-ink);font-size:12.5px;font-weight:600;line-height:1.5;white-space:nowrap;font-variant-numeric:tabular-nums;cursor:pointer;transition:background .18s ease}
    .topbar-balance:hover{background:rgba(128,128,150,.34)}
    .topbar-balance.static{cursor:default}
    .topbar-balance.static:hover{background:rgba(128,128,150,.2)}
    .topbar-balance .tb-k{font-weight:400;opacity:.8}
    .topbar-balance .tb-sym{opacity:.92}
    .menu-drop{position:absolute;right:0;top:calc(100% + 10px);z-index:60;min-width:184px;padding:6px;
      background:var(--surface);color:var(--text-1);border:1px solid var(--border);border-radius:14px;
      box-shadow:0 14px 34px rgba(26,33,56,.24);display:flex;flex-direction:column;gap:2px}
    .menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:9px;text-align:left;
      font-size:14px;color:var(--text-1);background:none;transition:background .14s ease,color .14s ease;white-space:nowrap}
    .menu-item:hover{background:var(--skin-accent-soft);color:var(--skin-accent)}
    .menu-item .mi-dot{width:8px;height:8px;border-radius:50%;flex:none}
    .menu-sep{height:1px;background:var(--border);margin:4px 8px}
    .menu-item.logout{color:var(--cinnabar)}
    .menu-item.logout:hover{background:rgba(178,58,58,.1);color:var(--cinnabar)}

    /* REQ-071：Banner 正中「模块」下拉导航（三大模块分组直达功能页；未登录也显示，
       受限页由 BUG-002 拦截引导去登录）。居中：作为 .topbar（flex space-between）中列，
       两侧留白相等 → 不遮挡左侧「太初」与右上角菜单/汉堡。 */
    .topbar-modnav{position:relative;display:flex;align-items:center;flex:none}
    .topbar-modnav .modnav-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
      font-size:13px;font-weight:600;line-height:1.4;white-space:nowrap;color:var(--skin-banner-ink);
      background:rgba(128,128,150,.18);transition:background .18s ease}
    .topbar-modnav .modnav-btn:hover{background:rgba(128,128,150,.32)}
    .topbar-modnav .modnav-btn .caret{width:0;height:0;margin-top:2px;
      border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor}
    .topbar-modnav .modnav-drop{position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%);z-index:60;
      width:200px;max-width:calc(100vw - 24px);padding:8px;background:var(--surface);color:var(--text-1);
      border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 34px rgba(26,33,56,.24);
      display:flex;flex-direction:column}
    .topbar-modnav .modnav-group{display:flex;flex-direction:column}
    .topbar-modnav .modnav-group + .modnav-group{border-top:1px solid var(--border);margin-top:6px;padding-top:6px}
    .topbar-modnav .modnav-group-title{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.08em;
      padding:2px 12px 3px;display:flex;align-items:center;gap:6px}
    .topbar-modnav .modnav-group-title .mg-dot{width:7px;height:7px;border-radius:50%;flex:none}
    .topbar-modnav .modnav-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;border-radius:9px;
      text-align:left;font-size:13.5px;color:var(--text-1);background:none;white-space:nowrap;
      transition:background .14s ease,color .14s ease}
    .topbar-modnav .modnav-item:hover{background:var(--skin-accent-soft);color:var(--skin-accent)}
    /* REQ-071③：小屏适配 —— ≤520px 隐藏 Banner 标题语并微缩按钮/面板，
       为正中「模块」下拉让出水平空间，避免与两侧挤压重叠 */
    @media (max-width:520px){
      .topbar .tagline{display:none}
      .topbar-modnav .modnav-btn{padding:7px 10px}
      .topbar-modnav .modnav-drop{width:188px}
    }

    /* 底部皮肤切换胶囊（随主题换色） */
    .skin-switch{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:20;display:flex;gap:4px;
      padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);
      box-shadow:0 6px 18px rgba(26,33,56,.14)}
    .skin-switch button{padding:4px 12px;border-radius:var(--radius-pill);font-size:12px;color:var(--text-2);font-weight:500;white-space:nowrap;transition:background var(--dur) var(--ease)}
    .skin-switch button.active{background:var(--skin-banner);color:var(--skin-banner-ink)}
    .skin-switch button:disabled{opacity:.5;cursor:not-allowed}
    /* 线上隐藏胶囊：组件与样式保留，日后恢复只需删除下面这条覆盖 */
    .skin-switch{display:none}

    /* 卡片 / 按钮 / 表单 */
    .card{background:var(--surface);border-radius:var(--radius-lg);padding:24px;margin:12px 0;box-shadow:var(--shadow-card);border:1px solid rgba(26,33,56,.04)}
    /* REQ-062：落地页宣传色块（国学/西式/MBTI 三模块共用 .landing-hero .card）白底 70% 半透明；
       只改背景不设整体 opacity，色块内文字/图标保持 100% 不透明 */
    .landing-hero .card{background:rgba(255,255,255,.7)}
    /* REQ-064：落地页主按钮下方「档案管理」透明小按钮（字号 13px < 主按钮 16px；仅登录渲染） */
    .landing-cases-btn{display:inline-flex;align-items:center;justify-content:center;width:auto;flex:none;margin:14px auto 0;padding:6px 14px;font-size:13px;font-weight:500;line-height:1.5;background:transparent;border:1px solid transparent;border-radius:var(--radius-pill);color:var(--text-2);cursor:pointer;transition:color .15s,border-color .15s,opacity .15s}
    .landing-cases-btn:hover{color:var(--skin-accent);border-color:var(--border)}
    .feature{border-left:3px solid var(--skin-accent)}
    .btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;border:none;border-radius:var(--radius-md);font-size:16px;cursor:pointer;font-weight:600;transition:transform .12s,box-shadow .2s}
    .btn:active{transform:translateY(1px)}
    .btn-primary{background:var(--skin-accent);color:var(--skin-accent-ink);box-shadow:0 4px 16px rgba(26,33,56,.18)}
    .btn-gold{background:var(--gold-500);color:#fff}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-1)}
    .btn-mini{width:auto;flex:none;padding:4px 12px;font-size:12px;line-height:1.5;border-radius:var(--radius-pill)}
    .input{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;margin:8px 0;background:var(--surface);color:var(--text-1)}
    .input:focus{outline:none;border-color:var(--skin-accent)}
    .label{font-size:13px;color:var(--text-2);margin-top:12px;display:block}

    /* 注册协议勾选（仅注册页显示） */
    .agree-row{display:flex;align-items:flex-start;gap:8px;margin:14px 0 2px;text-align:left}
    .agree-row input{flex-shrink:0;margin-top:3px;width:auto;accent-color:var(--skin-accent);cursor:pointer}
    .agree-label{font-size:13px;color:var(--text-2);line-height:1.6;cursor:pointer}
    .agree-label a{color:var(--ink-500);text-decoration:none;border-bottom:1px solid rgba(68,85,143,.35);margin:0 1px}
    .agree-label a:hover{color:var(--skin-accent);border-bottom-color:currentColor}
    .title{font-family:var(--font-serif);font-size:24px;color:var(--ink-700);text-align:center;margin:8px 0 16px;font-weight:600}
    .subtitle{font-size:14px;color:var(--text-2);text-align:center;margin-bottom:24px}
    .error{background:#FFF0F0;color:var(--cinnabar);padding:12px;border-radius:var(--radius-sm);font-size:13px}
    .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--radius-pill);background:var(--skin-tag-bg);color:var(--skin-banner-ink);margin-right:4px}

    /* 免责星印（跨皮肤合规标记，硬编码朱砂） */
    .disclaimer{font-size:11px;color:var(--cinnabar);text-align:center;margin:0 auto;padding:18px 20px;max-width:480px;line-height:1.6}
    .disclaimer .star{margin-right:4px}
    /* 协议链接行（低调小字，随免责色） */
    .disclaimer .legal-links{margin-top:8px;font-size:10px;letter-spacing:.02em}
    .disclaimer .legal-links a{color:inherit;text-decoration:none;border-bottom:1px dashed rgba(178,58,58,.4);padding-bottom:1px;margin:0 3px;opacity:.85}
    .disclaimer .legal-links a:hover{opacity:1;border-bottom-color:rgba(178,58,58,.9)}
    .disclaimer .legal-sep{opacity:.5}

    .progress{height:6px;background:var(--border);border-radius:3px;margin:16px 0;overflow:hidden}
    .progress-bar{height:100%;background:linear-gradient(90deg,var(--skin-accent),var(--gold-500));border-radius:3px;transition:width .5s var(--ease)}
    .trend-ji{border-left:3px solid var(--skin-accent)}
    .trend-xiong{border-left:3px solid var(--cinnabar)}
    .trend-ping{border-left:3px solid var(--ink-400)}

    .flex-row{display:flex;gap:8px}
    .flex-row > *{flex:1}

    /* 开关 / 提示 / 修正输入 / 失败态 / 登出 / 双列 */
    .switch-row{display:flex;align-items:center;gap:10px;margin:10px 0}
    .switch{position:relative;width:44px;height:24px;flex:none}
    .switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:999px;transition:.2s}
    .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
    .switch input:checked + .slider{background:var(--skin-accent)}
    .switch input:checked + .slider:before{transform:translateX(20px)}
    .coord-hint{font-size:11px;color:var(--skin-accent);margin:2px 0 0}
    .note-input{width:100%;min-height:64px;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-top:8px;resize:vertical;font-family:inherit}
    .failed-box{text-align:center}
    .failed-box .error{margin-bottom:12px;text-align:left}
    .logout-bar{display:flex;justify-content:flex-end;gap:16px;margin-top:8px}
    .logout-link{font-size:12px;color:var(--text-3);cursor:pointer;background:none;border:none;padding:4px}
    .field-row{display:flex;gap:8px}
    .field-row > div{flex:1}
    .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
    .kv:last-child{border-bottom:none}
    .kv .k{color:var(--text-2)}
    .kv .v{color:var(--text-1);font-weight:600}
    .section-title{font-size:15px;color:var(--ink-700);margin:4px 0 8px;font-weight:600}

    /* 断前尘星象轨道动画（C1） */
    .dqc-stage{margin:8px auto 0;max-width:520px;padding:32px 20px 28px;border-radius:var(--radius-lg);
      background:radial-gradient(120% 90% at 50% 25%, #232C49 0%, var(--ink-900) 80%);box-shadow:var(--shadow-card)}
    .dqc-plate{width:240px;height:240px;margin:0 auto;display:block}
    .dqc-rings{transform-box:fill-box;transform-origin:center;animation:spin 70s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .gold{fill:var(--gold-500)}
    .gold-stroke{stroke:var(--gold-500)}
    .ring-stroke{stroke:#3A4470}
    .s-pending{fill:var(--ink-700);opacity:.55}
    .s-active{fill:var(--gold-500);animation:pulse 1.2s ease-in-out infinite}
    .s-done{fill:var(--gold-300)}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    .dqc-progress{text-align:center;margin-top:16px;font-family:var(--font-serif);font-size:20px;color:var(--gold-300);letter-spacing:.05em}
    .dqc-method{text-align:center;margin-top:6px;font-size:14px;color:#C9C6DA}
    .dqc-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.12);margin:14px auto 0;max-width:360px;overflow:hidden}
    .dqc-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-600),var(--gold-300));transition:width .5s var(--ease)}
    .dqc-status{text-align:center;margin-top:10px;font-size:12px;color:#8E8AA6;font-family:var(--font-latin-serif);letter-spacing:.04em}
    .dqc-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px auto 0;max-width:420px}
    .dqc-list span{font-size:12px;padding:4px 10px;border-radius:var(--radius-pill);background:rgba(255,255,255,.06);color:#9FA3BC}
    .dqc-list span.done{background:var(--skin-accent-soft);color:#fff}
    .dqc-list span.active{background:var(--gold-600);color:#fff}

    /* 轻提示 */
    .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);background:var(--ink-900);color:#fff;
      padding:10px 18px;border-radius:var(--radius-pill);font-size:13px;opacity:0;pointer-events:none;transition:.25s var(--ease);z-index:40}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* 骨架屏（shimmer 加载占位） */
    .skeleton{position:relative;overflow:hidden;background:var(--border);border-radius:6px}
    .skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shimmer 1.3s infinite}
    @keyframes shimmer{100%{transform:translateX(100%)}}
    .sk-line{height:12px;margin:10px 0}
    .sk-title{height:22px;width:55%;margin:6px 0 16px}
    .sk-card{background:var(--surface);border-radius:var(--radius-lg);padding:22px;margin:12px 0;box-shadow:var(--shadow-card);border:1px solid rgba(26,33,56,.04);overflow:hidden}

    /* 页面切换过渡（key=page 重挂载触发） */
    .view-enter{animation:viewEnter .34s var(--ease) both}
    @keyframes viewEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    /* 图标 / 卡片 hover 微交互 */
    .icon{display:inline-flex;vertical-align:middle}
    .card{transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
    .card:hover{box-shadow:0 6px 22px rgba(26,33,56,.14)}
    .btn-primary:hover{box-shadow:0 6px 20px rgba(26,33,56,.26)}

    /* 解读页「历史追问 / 矫正」列表 */
    .hist-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .hist-item{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
      background:var(--paper);font-size:13px;color:var(--text-1);line-height:1.55;cursor:pointer;word-break:break-word;
      transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
    .hist-item:hover{border-color:var(--skin-accent);background:#f0ece0}

    /* ===== 完整盘面（八字/紫微/占星/七政/奇门/五运六气） ===== */
    .chart-view{margin-top:14px}
    .chart-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
    .chart-tab{padding:7px 13px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-pill);font-size:13px;cursor:pointer;color:var(--text-2);transition:.18s}
    .chart-tab:hover{border-color:var(--skin-accent)}
    .chart-tab.active{background:var(--skin-accent);color:var(--skin-accent-ink);border-color:var(--skin-accent);font-weight:600}
    .sub-title{font-size:13px;font-weight:600;color:var(--skin-accent);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
    .sub-title::before{content:"";width:3px;height:13px;background:var(--skin-accent);border-radius:2px;display:inline-block}
    .daymaster{display:flex;align-items:baseline;gap:8px;margin:2px 0 4px}
    .daymaster .dm{font-size:21px;font-weight:700;color:var(--skin-accent)}
    .daymaster .dm-wx{font-size:13px;color:var(--text-2)}
    .aux-line{font-size:12px;color:var(--text-3);margin:6px 0;line-height:1.75}
    .aux-line b{color:var(--text-2);font-weight:600}

    /* 四柱表 */
    .four-pillars{display:grid;grid-template-columns:74px repeat(4,1fr);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)}
    .fp-cell{padding:9px 6px;text-align:center;font-size:13px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);min-width:0;word-break:break-word}
    .fp-cell:last-child{border-right:none}
    .fp-cell.fp-rowhead{background:#f4f0e7;font-weight:600;color:var(--text-2);text-align:left;padding-left:10px}
    .fp-cell.fp-head{background:var(--skin-accent);color:var(--skin-accent-ink);font-weight:600}
    .fp-cell.fp-day{background:var(--skin-accent-soft);font-weight:600;color:var(--skin-accent)}
    .fp-cell.fp-head.fp-day{background:var(--skin-accent);color:var(--skin-accent-ink)}

    /* 神煞标签 */
    .shensha-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
    .shensha-tag{font-size:12px;padding:3px 9px;border-radius:var(--radius-pill);border:1px solid transparent;line-height:1.4}
    .shensha-tag.green{background:rgba(62,124,107,.14);color:#2f6b5b;border-color:rgba(62,124,107,.3)}
    .shensha-tag.red{background:rgba(178,58,58,.12);color:var(--cinnabar);border-color:rgba(178,58,58,.3)}
    .shensha-tag.gold{background:rgba(191,161,90,.16);color:#9a7d34;border-color:rgba(191,161,90,.35)}

    /* 通用小表格 */
    .mini-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
    .mini-table th,.mini-table td{border:1px solid var(--border);padding:6px 8px;text-align:center}
    .mini-table th{background:#f4f0e7;color:var(--text-2);font-weight:600}
    .mini-table td{color:var(--text-1)}

    /* 流年时间轴 */
    .timeline{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-top:4px}
    .tl-item{flex:0 0 auto;width:128px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px}
    .tl-year{font-weight:700;font-size:14px;color:var(--skin-accent)}
    .tl-age{font-size:11px;color:var(--text-3);font-weight:400;margin-left:4px}
    .tl-ganzhi{font-size:13px;margin:3px 0}
    .tl-dy{display:block;font-size:11px;color:var(--text-3)}
    .tl-events{display:flex;flex-direction:column;gap:3px}
    .tl-ev{font-size:11px;color:var(--cinnabar);background:rgba(178,58,58,.07);border-radius:6px;padding:2px 5px;line-height:1.35}

    /* 紫微十二宫 */
    .ziwei-wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
    .ziwei-wheel{flex:0 0 auto;width:240px;height:240px;max-width:100%}
    .zw-ring{fill:none;stroke:var(--skin-accent);stroke-width:1.5;opacity:.5}
    .zw-ring-inner{fill:none;stroke:var(--skin-accent);stroke-width:1;opacity:.3}
    .zw-label{font-size:12px;fill:var(--text-2)}
    .zw-center{font-size:13px;font-weight:700;fill:var(--skin-accent)}
    .zw-center2{font-size:11px;fill:var(--text-3)}
    .palace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;flex:1;min-width:260px}
    .palace-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 10px;background:var(--surface)}
    .palace-card.body{border-color:var(--skin-accent);background:var(--skin-accent-soft)}
    .pc-name{font-weight:700;font-size:13px;color:var(--text-1);display:flex;align-items:center;gap:5px}
    .pc-badge{font-size:10px;background:var(--skin-accent);color:var(--skin-accent-ink);border-radius:6px;padding:1px 5px}
    .pc-stem{font-size:12px;color:var(--text-3);margin:2px 0}
    .pc-stars{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
    .pc-major{font-size:12px;background:var(--skin-accent);color:var(--skin-accent-ink);border-radius:6px;padding:1px 6px}
    .pc-stars.sm{font-size:11px;color:var(--text-2)}
    .pc-stars.adj{font-size:11px;color:var(--text-3)}
    .pc-sihua{font-size:11px;color:var(--cinnabar);margin-top:3px}

    /* 占星 / 七政 表格 */
    .planet-table,.star-table,.aspect-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
    .planet-table th,.star-table th,.aspect-table th,.planet-table td,.star-table td,.aspect-table td{border:1px solid var(--border);padding:6px 8px}
    .planet-table th,.star-table th,.aspect-table th{background:#f4f0e7;color:var(--text-2);font-weight:600;text-align:left}
    .planet-table td,.star-table td,.aspect-table td{color:var(--text-1)}
    .retro{color:var(--cinnabar);font-size:11px}

    /* 奇门九宫 */
    .qimen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:420px;margin-top:4px}
    .qimen-cell{border:1px solid var(--border);border-radius:var(--radius-md);padding:7px 8px;background:var(--surface);min-height:78px}
    .qc-name{font-weight:700;font-size:13px;color:var(--skin-accent)}
    .qc-meta{font-size:11px;color:var(--text-3)}
    .qc-lines{font-size:11.5px;color:var(--text-1);margin-top:3px;line-height:1.5}

    /* 五运六气对比 */
    .wuyun-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
    .wuyun-col{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;background:var(--surface)}
    .wuyun-col h4{margin:0 0 8px;font-size:13px;color:var(--skin-accent)}
    .wuyun-col .kv{font-size:12.5px}

    .empty-note{font-size:13px;color:var(--text-3);background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius-md);padding:14px;text-align:center}
    .deg-banner{font-size:12px;color:var(--cinnabar);background:rgba(178,58,58,.08);border-radius:var(--radius-md);padding:8px 10px;margin-bottom:6px;line-height:1.6}

    /* —— 余额系统（沿用国学皮肤令牌，不新增配色）—— */
    .credit-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:var(--skin-banner);color:#fff;font-size:13px;font-weight:600;cursor:pointer;line-height:1.5;transition:transform .12s,box-shadow .2s}
    .credit-pill:hover{box-shadow:0 4px 14px rgba(178,58,58,.28)}
    .credit-pill.warn{background:var(--cinnabar)}
    .credit-pill .pill-bal{font-variant-numeric:tabular-nums}
    .credit-pill.skeleton{width:96px;height:26px;padding:0;border:none;background:linear-gradient(90deg,#e9e2d6 25%,#f4efe6 37%,#e9e2d6 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite}
    .credit-balance-wrap{display:inline-flex;align-items:center;gap:8px}

    /* REQ-086：付费操作统一「¥ 消耗」角标（余额 0 / 不足 → 警示红 warn + title「余额不足」） */
    .pay-badge{display:inline-flex;align-items:center;justify-content:center;margin-left:7px;padding:1px 7px;border-radius:999px;
      font-size:11px;font-weight:600;line-height:1.5;color:#fff;background:var(--skin-accent);vertical-align:middle;white-space:nowrap;flex:none}
    .pay-badge.warn{background:var(--cinnabar)}
    /* REQ-087：右上角菜单面板最顶部「余额 ¥X」（仅登录、点开菜单即见；点击进余额消耗明细） */
    .menu-item.menu-balance{border-bottom:1px solid var(--border);margin-bottom:3px;padding-bottom:10px}
    .menu-item.menu-balance .mb-val{font-weight:700;font-variant-numeric:tabular-nums;margin-left:1px}
    .menu-item.menu-balance.warn{color:var(--cinnabar)}
    .txn-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
    .txn-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)}
    .txn-icon{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .txn-icon.up{background:var(--skin-accent-soft);color:var(--skin-accent)}
    .txn-icon.down{background:rgba(178,58,58,.12);color:var(--cinnabar)}
    .txn-main{flex:1;min-width:0}
    .txn-title{font-size:14px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .txn-time{font-size:12px;color:var(--text-3);margin-top:2px}
    .txn-right{flex:none;text-align:right}
    .txn-delta{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
    .txn-delta.plus{color:var(--skin-accent)}
    .txn-delta.minus{color:var(--cinnabar)}
    .txn-rest{font-size:11px;color:var(--text-3);margin-top:2px}
    .txn-case{font-size:12px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

    /* REQ-065：档案管理 CRM 行式列表 */
    .case-row{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:0 0 8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;flex-wrap:wrap;transition:border-color var(--dur) var(--ease),box-shadow .2s var(--ease)}
    .case-row:last-child{margin-bottom:0}
    .case-row:hover{border-color:var(--skin-accent);box-shadow:0 4px 14px rgba(26,33,56,.08)}
    .case-info{flex:1;min-width:200px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
    .case-name{font-size:15px;font-weight:600;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .case-meta{font-size:12.5px;color:var(--text-2);white-space:nowrap}
    .case-meta b{color:var(--text-1);font-weight:600}
    .case-actions{flex:none;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .case-actions .btn{width:auto;flex:none;padding:5px 11px;font-size:12.5px;font-weight:500;line-height:1.4;border-radius:var(--radius-pill)}
    .case-actions .btn-del{color:var(--cinnabar);border-color:var(--cinnabar)}
    .modal-mask{position:fixed;inset:0;background:rgba(20,24,38,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
    .modal{background:var(--surface);border-radius:16px;padding:24px;max-width:340px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.3);text-align:center}
    .modal-title{font-size:18px;font-weight:700;margin-bottom:10px;color:var(--text-1)}
    .modal-body{font-size:14px;color:var(--text-2);margin-bottom:18px;line-height:1.6}
    /* REQ-044 v2：起卦方案弹窗（左对齐 + 加宽，标题居中） */
    .modal.ask-modal{max-width:420px;text-align:left}
    .modal.ask-modal .modal-title{text-align:center}
    .ask-cap{font-size:13px;font-weight:700;color:var(--text-1);margin:2px 0 4px}

    /* ===== REQ-072：三大模块「配对解析」入口条 + PairModal（选两档案+关系类型+关注点） ===== */
    .pair-entry{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--skin-accent-soft);border:1px solid var(--skin-accent);border-radius:var(--radius-md);padding:12px 14px;margin:0 0 14px}
    .pair-entry .pe-main{flex:1;min-width:220px}
    .pair-entry .pe-title{font-size:14.5px;font-weight:700;color:var(--text-1)}
    .pair-entry .pe-sub{font-size:11.5px;color:var(--text-2);line-height:1.7;margin-top:2px}
    .pair-entry .btn{flex:none;width:auto;padding:9px 18px;font-size:13.5px;border-radius:var(--radius-pill)}
    .modal.pair-modal{max-width:560px;width:100%;text-align:left;max-height:88vh;overflow-y:auto}
    .pair-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
    .pair-hd-title{font-size:18px;font-weight:700;color:var(--text-1);display:flex;align-items:center;gap:8px}
    .pair-x{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--paper);color:var(--text-2);font-size:13px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
    .pair-x:hover{color:var(--skin-accent);border-color:var(--skin-accent)}
    .pair-sub{font-size:12px;color:var(--text-3);line-height:1.7;margin-bottom:10px}
    .pair-pay{font-size:12px;color:var(--text-2);background:var(--skin-accent-soft);border-radius:var(--radius-sm);padding:8px 11px;margin:0 0 14px;line-height:1.7}
    .pair-sec{margin:0 0 12px}
    .pair-sec-label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--text-1);margin-bottom:6px}
    .ps-n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--skin-accent);color:var(--skin-accent-ink);font-size:11px;font-weight:700}
    .pair-field{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-1);font-size:14px;font-family:inherit;line-height:1.5;margin:0}
    .pair-field:focus{outline:none;border-color:var(--skin-accent)}
    textarea.pair-field{resize:vertical;min-height:66px}
    .pair-rel{display:flex;flex-wrap:wrap;gap:8px}
    .pair-rel .btn{width:auto;flex:none;margin:0;padding:7px 15px;font-size:13px;font-weight:600;border-radius:var(--radius-pill)}
    .pair-rel .btn.sel{background:var(--skin-accent);border-color:var(--skin-accent);color:var(--skin-accent-ink)}
    .pair-err{font-size:13px;color:var(--cinnabar);background:rgba(178,58,58,.08);border:1px solid rgba(178,58,58,.28);border-radius:var(--radius-sm);padding:10px 12px;line-height:1.7;margin:0 0 12px;white-space:pre-wrap}
    .pair-busy{font-size:13px;color:var(--text-2);background:var(--skin-accent-soft);border-radius:var(--radius-sm);padding:10px 12px;margin:0 0 12px;line-height:1.7}
    .pair-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
    .pair-foot .btn{width:auto;flex:none;padding:10px 18px;font-size:14px}

    /* ===== 左侧导航栏 nav-rail（取代底部皮肤胶囊，§1） ===== */
    /* BUG-001：不再垂直居中，改为贴近顶部 Banner 下缘（app-shell padding-top 58px → 留 6px 间隙） */
    .nav-rail{position:fixed;left:0;top:64px;transform:none;display:flex;flex-direction:column;align-items:flex-start;gap:10px;z-index:42;padding:6px 0}
    .nav-rail button{position:relative;border:none;border-radius:0 14px 14px 0;width:58px;padding:14px 6px;min-height:96px;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
      color:#fff;font-size:13px;font-weight:600;line-height:1.25;letter-spacing:1px;
      transition:transform .18s ease,box-shadow .18s ease,background .18s ease,filter .18s ease,width .2s ease;
      box-shadow:2px 2px 10px rgba(0,0,0,.18);filter:brightness(.82)}
    .nav-rail button .rail-ico{width:22px;height:22px}
    .nav-rail button:hover{filter:brightness(.95);width:66px}
    .nav-rail button.active{width:74px;box-shadow:5px 4px 18px rgba(0,0,0,.32);filter:brightness(1.05)}
    .nav-rail button .rail-label{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap}
    /* 选中模块时按钮展开：竖排窄条 → 横排长条（图标 + 横排文字） */
    .nav-rail button.expanded{width:132px;min-height:56px;padding:10px 16px;flex-direction:row;justify-content:flex-start;gap:10px;
      box-shadow:5px 4px 18px rgba(0,0,0,.32);filter:brightness(1.06)}
    .nav-rail button.expanded:hover{width:132px}
    .nav-rail button.expanded .rail-label{writing-mode:horizontal-tb;text-orientation:mixed;letter-spacing:1px}
    /* BUG-001：手机小屏下落地宣传卡片右移错开，避开左侧 nav-rail（展开按钮宽 132px，留间隙） */
    @media (max-width:480px){
      .landing-hero{margin-left:150px;margin-right:auto}
    }

    /* ===== HUB 入口卡（REQ-038：竖向单列 + 横向卡片） ===== */
    .hub-title{font-size:22px;font-weight:700;color:var(--text-1);margin:4px 0 14px;display:flex;align-items:center;gap:8px}
    .hub-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
    .hub-card{position:relative;display:flex;flex-direction:row;align-items:center;gap:14px;width:100%;box-sizing:border-box;padding:16px 18px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--border);cursor:pointer;overflow:hidden;transition:transform .14s,box-shadow .2s}
    .hub-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(26,33,56,.18)}
    .hub-card .hc-bar{position:absolute;left:0;top:0;bottom:0;width:5px;height:100%}
    .hub-card .hc-ico{flex:none;width:34px;height:34px;color:var(--skin-accent)}
    .hub-card .hc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
    .hub-card .hc-name{font-size:17px;font-weight:700;color:var(--text-1)}
    .hub-card .hc-sub{font-size:12px;color:var(--text-3);line-height:1.5}
    .hub-card.disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.4)}
    .hub-card.disabled:hover{transform:none;box-shadow:none}

    /* ===== BUG-006：档案可选卡片（星座 / MBTI 选档案用，含明显选中态） ===== */
    .step-hint{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;margin:2px 0 10px;color:var(--text-3)}
    .step-hint .sh{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--radius-pill);background:var(--paper);border:1px solid var(--border);line-height:1.5}
    .step-hint .sh.cur{background:var(--skin-accent-soft);border-color:var(--skin-accent);color:var(--skin-accent);font-weight:600}
    .step-hint .sh-arr{color:var(--text-3);opacity:.75}
    .case-opts{display:flex;flex-direction:column;gap:8px;margin:4px 0 10px}
    .case-opt{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;text-align:left;padding:11px 13px;border-radius:var(--radius-md);background:var(--surface);border:1.5px solid var(--border);cursor:pointer;font-family:inherit;transition:border-color .14s,background .14s,box-shadow .14s;line-height:1.4}
    .case-opt:hover{border-color:var(--skin-accent);background:var(--skin-accent-soft)}
    .case-opt.sel{border-color:var(--skin-accent);background:var(--skin-accent-soft);box-shadow:inset 0 0 0 1px var(--skin-accent)}
    .case-opt .co-main{flex:1;min-width:0}
    .case-opt .co-name{display:block;font-size:15px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .case-opt .co-meta{display:block;font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* REQ-056①：档案卡片「已测 MBTI 类型」标签（未测=灰字「未测试」） */
    .case-opt .co-type{display:inline-block;margin-top:3px;font-size:11px;line-height:1.5;color:var(--skin-accent);background:var(--skin-accent-soft);border:1px solid var(--skin-accent);padding:1px 7px;border-radius:var(--radius-pill);font-weight:700}
    .case-opt .co-type.none{color:var(--text-3);background:transparent;border-color:transparent;padding:1px 2px;font-weight:400}
    .case-opt .co-check{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .14s}
    .case-opt.sel .co-check{border-color:var(--skin-accent);background:var(--skin-accent);color:var(--skin-accent-ink)}

    /* ===== 通用卡片 / 标签 ===== */
    .tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--skin-accent-soft);color:var(--skin-accent)}
    .pay-hint{font-size:12px;color:var(--text-2);background:var(--skin-accent-soft);border-radius:var(--radius-sm);padding:6px 10px;margin-top:8px}
.tag.sel{background:var(--skin-accent);color:var(--skin-accent-ink)}
.interp-title{font-size:14px;font-weight:700;color:var(--skin-accent);margin-top:14px}
.interp-body{font-size:13px;color:var(--text-2);line-height:1.8;white-space:pre-wrap;background:var(--skin-accent-soft);border-radius:var(--radius-sm);padding:10px 12px;margin-top:6px}
    .row-gap{display:flex;gap:10px;flex-wrap:wrap}
    .back-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

    /* ===== 生肖流年 ===== */
    .zodiac-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .zodiac-cell{padding:12px 4px;text-align:center;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:600;color:var(--text-1);transition:.14s}
    .zodiac-cell .zodiac-medallion{display:block;margin:0 auto 2px}
    .zodiac-cell.sel{background:var(--skin-accent);color:var(--skin-accent-ink);border-color:var(--skin-accent)}
    .taisui-card{text-align:center;border:1.5px solid var(--cinnabar);border-radius:var(--radius-lg);padding:16px;background:rgba(178,58,58,.05)}
    .noble-card{text-align:center;border-radius:var(--radius-lg);padding:14px;background:var(--skin-accent-soft);color:var(--skin-accent);font-weight:600}
    .rel-card{border-radius:var(--radius-lg);padding:14px;font-weight:600}
    .rel-good{background:rgba(62,124,107,.14);color:var(--skin-accent)}
    .rel-risk{background:rgba(178,58,58,.12);color:var(--cinnabar)}
    .rel-neutral{background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
    .signal-list{display:flex;flex-direction:column;gap:8px}
    .signal-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text-2)}
    .conflict-tag{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
    .c-zhi{background:#B23A3A}.c-chong{background:#E08A2B}.c-xing{background:#5B4B8A}.c-hai{background:#3B7BB0}.c-po{background:#8A93A6}

    /* REQ-052：生肖流年档案下拉 */
    .zodiac-pick-hint{font-size:12.5px;color:var(--text-2);margin-top:10px;line-height:1.8}
    .zodiac-pick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    /* BUG-003：五行关系明细行 */
    .zrel{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:baseline}
    .zrel:last-child{border-bottom:none}
    .zrel .zl{flex:none;width:92px;color:var(--text-3)}
    .zrel .zv{flex:1;min-width:0;color:var(--text-1);font-weight:600;line-height:1.75;word-break:break-all}
    /* C6：五行关系 / 风险关系 通用解读小字（确定性，零 LLM） */
    .zrel-guide{font-size:12px;color:var(--text-3);line-height:1.85;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);text-align:left}
    /* 生肖流年：结果卡标题两侧年份切换箭头（← / →；仅出结果即 data 非空时随标题渲染） */
    .zodiac-year-arrow{width:36px;height:36px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border);background:var(--paper);color:var(--text-2);font-size:19px;font-weight:700;line-height:1;cursor:pointer;transition:.14s;font-family:inherit;padding:0}
    .zodiac-year-arrow:hover:not(:disabled){border-color:var(--skin-accent);color:var(--skin-accent);background:var(--skin-accent-soft)}
    .zodiac-year-arrow:disabled{opacity:.4;cursor:not-allowed}
    /* 五行关系合并卡：色块标题区（五行关系 + classification + C1 一句话解读） */
    .wx-hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px;letter-spacing:.12em;opacity:.85;font-weight:700}
    .wx-hd .wx-cls{font-size:16px;font-weight:800;letter-spacing:.02em;opacity:1}
    .wx-s{font-size:12.5px;font-weight:500;line-height:1.85;margin-top:7px;opacity:.95;word-break:break-word}
    .zrel-box{margin-top:12px}
    /* 贵人色块内 C2 贵人静态解读（nobleDetail 有内容才渲染） */
    .noble-sub{margin-top:10px;padding:8px 10px;text-align:left;font-size:12px;font-weight:500;line-height:1.85;color:var(--skin-accent);background:rgba(255,255,255,.5);border-radius:8px}

    /* ===== 临时起卦 ===== */
    .method-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
    .method-cell{padding:16px 10px;text-align:center;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:.14s}
    .method-cell .mn{font-weight:700;color:var(--text-1);font-size:15px}
    .method-cell .md{font-size:11px;color:var(--text-3);margin-top:3px}
    .method-cell.sel{background:var(--skin-accent);color:var(--skin-accent-ink);border-color:var(--skin-accent)}
    .method-cell.todo{opacity:.5;cursor:not-allowed}
    .yao-line{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-1);padding:4px 0}
    /* BUG-004: 爻线图形不依赖 ::before/::after 伪元素，改用 background linear-gradient 绘制：
       阳爻(.yao-bar 默认/.old-yang)= 全长实线；阴爻(.yin/.old-yin)= 左22px + 中10px空隙 + 右22px 双短线；老阳金色、老阴朱砂 */
    .yao-bar{height:6px;width:54px;border-radius:3px;background:var(--ink-300);flex:0 0 auto}
    .yao-bar.old-yang{background:var(--gold-500)}
    .yao-bar.yin{background:linear-gradient(to right,var(--ink-300) 0 22px,transparent 22px 32px,var(--ink-300) 32px 54px)}
    .yao-bar.old-yin{background:linear-gradient(to right,var(--cinnabar) 0 22px,transparent 22px 32px,var(--cinnabar) 32px 54px)}
    .palm-disk{width:200px;height:200px;border-radius:50%;margin:14px auto;position:relative;background:radial-gradient(circle,var(--skin-accent-soft),transparent 70%);border:2px solid var(--skin-accent)}
    .palm-disk .pd-point{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--skin-accent);color:var(--skin-accent-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transform:translate(-50%,-50%);left:50%;top:50%}
    .palm-disk .pd-point.hit{box-shadow:0 0 0 4px var(--gold-500)}

    /* ===== REQ-055：六爻分列布局（爻位|爻象|六亲|纳甲|世应|阴阳|六神） ===== */
    .ly-wrap{overflow-x:auto;margin-top:4px}
    .ly-grid{display:flex;flex-direction:column;min-width:600px}
    .ly-head,.ly-row{display:grid;grid-template-columns:46px 64px 56px 52px 46px 1fr 56px;gap:2px 8px;align-items:center;padding:5px 8px}
    .ly-head{font-size:11px;color:var(--text-3);letter-spacing:.08em;padding-top:2px;padding-bottom:3px}
    .ly-head > span,.mh-head > span{text-align:center}
    .ly-row{border-top:1px solid var(--border);font-size:13px;color:var(--text-1)}
    .ly-row .c{text-align:center;white-space:nowrap;overflow:hidden}
    .ly-row .c-pos{color:var(--text-3)}
    .ly-row .c-rel,.ly-row .c-nj{font-size:12px;color:var(--text-2)}
    .ly-row .c-god{font-size:11px;color:var(--text-3)}
    .ly-row .c-bar{justify-self:center}
    .ly-row .c-name{display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
    .ly-row .c-wr{display:flex;justify-content:center}
    .ly-row.moving{background:rgba(184,137,62,.16)}
    .ly-row .mv-badge,.mv-badge{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;background:var(--gold-500);border-radius:999px;padding:1px 6px;line-height:1.5;flex:none}
    .wr-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;border-radius:999px;font-size:11px;font-weight:800;color:#fff;background:var(--cinnabar);padding:0 6px;line-height:1.5;flex:none;box-shadow:0 1px 3px rgba(178,58,58,.35)}
    /* 梅花易数爻列（类六爻：爻位|爻象|阴阳|体用） */
    .mh-gua{border-top:1px dashed var(--border);margin-top:8px;padding-top:6px}
    .mh-gua-t{font-size:12px;font-weight:700;color:var(--text-2);margin:2px 0 4px}
    .mh-wrap{overflow-x:auto}
    .mh-grid{display:flex;flex-direction:column;min-width:320px}
    .mh-head,.mh-row{display:grid;grid-template-columns:46px 64px 70px 64px;gap:2px 8px;align-items:center;padding:3px 8px}
    .mh-head{font-size:11px;color:var(--text-3);letter-spacing:.08em;padding-top:2px;padding-bottom:2px}
    .mh-row{border-top:1px solid var(--border);font-size:13px;color:var(--text-1)}
    .mh-row .c{text-align:center;white-space:nowrap}
    .mh-row .c-pos{color:var(--text-3)}
    .mh-row .c-bar{justify-self:center}
    .mh-row .c-name{display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
    .ty-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;border-radius:999px;font-size:11px;font-weight:800;padding:0 6px;line-height:1.5;flex:none}
    .ty-badge.ti{background:var(--skin-accent-soft);color:var(--skin-accent)}
    .ty-badge.yong{background:rgba(178,58,58,.12);color:var(--cinnabar)}
    /* ===== REQ-055：免费静态解读区 / 时间选项 ===== */
    .free-card{margin-top:10px;border:1px dashed var(--border);border-radius:var(--radius-md);padding:10px 12px;background:var(--paper)}
    .free-card .fc-title{font-size:13px;font-weight:700;color:var(--skin-accent);margin-bottom:8px}
    .free-block{margin-bottom:8px}
    .free-block:last-child{margin-bottom:0}
    .free-block .fb-label{font-size:12px;font-weight:700;color:var(--ink-600);margin-bottom:2px}
    .free-block .fb-txt{font-size:13px;color:var(--text-2);line-height:1.75;white-space:pre-wrap;word-break:break-word}
    .free-block .fb-tip{font-size:11px;color:var(--text-3);margin-top:3px;line-height:1.6}
    /* ===== REQ-075：六爻焦点详解（逐项点击 → LLM 结合本盘+爻辞针对性解读，小额余额付费） ===== */
    .focus-card{margin-top:10px;border:1px dashed var(--border);border-radius:var(--radius-md);padding:10px 12px;background:var(--paper)}
    .focus-card .fc-title{font-size:13px;font-weight:700;color:var(--skin-accent);margin-bottom:8px}
    .focus-intro{font-size:12px;color:var(--text-3);line-height:1.7;margin-bottom:4px}
    .focus-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0}
    .focus-item + .focus-item{border-top:1px dashed var(--border)}
    .focus-name{flex:none;font-size:13px;font-weight:600;color:var(--text-1);min-width:124px}
    .focus-name.off{color:var(--text-3)}
    .focus-btn{flex:none;font-size:12px;font-weight:600;color:var(--skin-accent);background:var(--skin-accent-soft);border:1px solid var(--skin-accent);border-radius:var(--radius-pill);padding:3px 11px;cursor:pointer;font-family:inherit;line-height:1.5;transition:filter .14s}
    .focus-btn:hover{filter:brightness(1.05)}
    .focus-btn.on{color:var(--text-2);border-color:var(--border);background:var(--surface)}
    .focus-note{font-size:11px;color:var(--text-3);line-height:1.6}
    .focus-note.err{color:var(--cinnabar)}
    .focus-panel{width:100%;margin-top:2px}
    .focus-disclaim{font-size:11px;color:var(--text-3);line-height:1.7;margin-top:8px;padding-top:6px;border-top:1px dashed var(--border)}
    .dt-row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
    .dt-field{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:4px}
    .dt-cap{font-size:12px;color:var(--text-2)}
    .dt-cap em{font-style:normal;color:var(--cinnabar);margin-left:2px}
    .dt-input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--paper);color:var(--text-1);font-size:14px;font-family:inherit;outline:none}
    .dt-input:focus{border-color:var(--skin-accent);box-shadow:0 0 0 2px var(--skin-accent-soft)}
    .time-note{font-size:11px;color:var(--text-3);margin:2px 0 0;line-height:1.6}

    /* ===== 塔罗 / 雷诺曼 占位卡 ===== */
    .card-fan{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
    .tarot-card{width:104px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tarot-card .tc-imgwrap{width:104px;height:168px;border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.22);background:#5B4B8A;position:relative;box-sizing:border-box}
.tarot-card.suit-major .tc-imgwrap{border:2px solid #5B4B8A}
.tarot-card.suit-wands .tc-imgwrap{border:2px solid #b8893e}
.tarot-card.suit-cups .tc-imgwrap{border:2px solid #c0392b}
.tarot-card.suit-swords .tc-imgwrap{border:2px solid #2c3e6e}
.tarot-card.suit-pentacles .tc-imgwrap{border:2px solid #4a7c59}
.tarot-card.suit-hearts .tc-imgwrap{border:2px solid #b94a4a}
.tarot-card.suit-diamonds .tc-imgwrap{border:2px solid #3a6ea5}
.tarot-card.suit-spades .tc-imgwrap{border:2px solid #2c2c2c}
.tarot-card.suit-clubs .tc-imgwrap{border:2px solid #4a8a5e}
.tarot-card .tc-img{width:100%;height:100%;object-fit:cover;display:block}
.tarot-card.reversed .tc-imgwrap{transform:rotate(180deg)}
.tarot-card .tc-name{font-size:13px;font-weight:700;text-align:center;line-height:1.25;color:var(--text-1)}
.tarot-card .tc-kw{font-size:11px;color:var(--text-2);text-align:center;line-height:1.45}
/* A2/A3：塔罗固定牌义正文 / 雷诺曼主题·细节文案（非 LLM 文案落地展示） */
.tarot-card.has-mean{width:132px}
.tarot-card .tc-mean{width:100%;margin-top:2px}
.tarot-card .tc-mean-tag{font-size:11px;font-weight:600;color:var(--skin-accent);text-align:center;margin-bottom:3px}
.tarot-card .tc-mean-txt{font-size:12px;color:var(--text-2);line-height:1.8;text-align:left}
.tarot-card .tc-theme{font-size:12px;font-weight:700;color:var(--text-1);text-align:center;line-height:1.5;margin-top:2px}
.tarot-card .tc-detail{font-size:12px;color:var(--text-2);line-height:1.8;text-align:left;width:100%;margin-top:2px}
.tarot-card .tc-element{font-size:10px;color:var(--text-3);text-align:center}
.tarot-card .tc-ph{display:flex;width:100%;height:100%;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;padding:6px;text-align:center;box-sizing:border-box}
/* REQ-042/043 v2：塔罗/雷诺曼改版样式（步骤编号 / 问题输入 / 占问摘要 / 牌阵单列 / 集中牌义段落 / 全宽底栏 / 公版署名） */
.section-title.step-title{display:flex;align-items:center;gap:7px}
.step-title .st-no{flex:none;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--skin-accent);color:var(--skin-accent-ink);font-size:11px;font-weight:700}
.q-input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;line-height:1.6;background:var(--paper);color:var(--text-1);resize:none;outline:none;margin:2px 0 4px}
.q-input:focus{border-color:var(--skin-accent);box-shadow:0 0 0 2px var(--skin-accent-soft)}
.q-input::placeholder{color:var(--text-3)}
.ask-echo{font-size:13px;color:var(--text-2);background:var(--skin-accent-soft);border-radius:var(--radius-sm);padding:7px 10px;margin:-6px 0 2px;line-height:1.6;word-break:break-word}
.back-row.fill > *{flex:1 1 0;width:auto;min-width:0}
.back-row.fill .btn{padding:13px 6px;font-size:14px;white-space:nowrap}
.deck-credit{font-size:10px;color:var(--text-3);text-align:center;margin:6px 0 2px;letter-spacing:.03em;opacity:.85}
/* REQ-042/043 v2：牌阵选择改为单列按钮列表（每项全宽：标题 + 一行适用说明） */
.method-list{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.method-list .method-cell{width:100%;box-sizing:border-box;text-align:left;padding:11px 14px}
.method-list .method-cell .mn{font-size:15px}
.method-list .method-cell .md{font-size:12px;color:var(--text-3);margin-top:2px;text-align:left}
/* REQ-042/043 v2：抽卡结果 图/文拆分 —— 下方集中牌义段落（自第一张起逐张） */
.mean-panel{border-top:1px dashed var(--border);padding-top:12px;margin-top:2px}
.mean-panel .mp-title{font-size:14px;font-weight:700;color:var(--skin-accent);margin-bottom:8px}
.mean-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px}
.mean-item:last-child{margin-bottom:0}
.mean-item .mi-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;line-height:1.5}
.mean-item .mi-pos{font-size:12px;color:var(--skin-accent);background:var(--skin-accent-soft);border-radius:var(--radius-pill);padding:1px 9px;font-weight:700;flex:none}
.mean-item .mi-name{font-weight:700;color:var(--text-1)}
.mean-item .mi-orient{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;flex:none}
.mean-item .mi-orient.up{background:rgba(62,124,107,.14);color:#3E7C6B}
.mean-item .mi-orient.rev{background:rgba(178,58,58,.12);color:var(--cinnabar)}
.mean-item .mi-theme{font-size:12px;font-weight:700;color:var(--skin-accent);margin-top:7px;text-align:left}
.mean-item .mi-txt{font-size:13px;color:var(--text-2);line-height:1.8;margin-top:4px;text-align:left}
.mean-item .mi-kw{font-size:12px;color:var(--text-3);margin-top:4px;text-align:left}
    .suit-wands{background:#C96A3B}.suit-cups{background:#3B7BB0}.suit-swords{background:#8A93A6}.suit-pentacles{background:#C9A24B}.suit-major{background:#5B4B8A}
    .tc-pos{font-size:12px;color:var(--skin-accent);font-weight:600;text-align:center;margin-bottom:4px}

    /* ===== 星座星盘 ===== */
    .astro-wheel{width:100%;max-width:320px;margin:10px auto;display:block}
    .astro-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0}
    .astro-tab{flex:none;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);cursor:pointer;white-space:nowrap}
    .astro-tab.sel{background:var(--skin-accent);color:var(--skin-accent-ink);border-color:var(--skin-accent)}
    .planet-row{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)}
    .planet-row .pr-sym{width:22px;text-align:center;font-weight:700;color:var(--skin-accent)}

    /* ===== MBTI ===== */
    .mbti-progress{height:6px;border-radius:3px;background:var(--skin-accent-soft);overflow:hidden;margin:10px 0}
    .mbti-progress > i{display:block;height:100%;background:var(--skin-accent);border-radius:3px;transition:width .25s}
    .mbti-type-big{font-size:42px;font-weight:800;letter-spacing:3px;color:var(--skin-accent);text-align:center}
    .mbti-alias{text-align:center;color:var(--text-2);font-size:14px;margin-bottom:10px}
    .mbti-bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
    .mbti-bar .bb-track{flex:1;height:10px;border-radius:5px;background:var(--surface);border:1px solid var(--border);position:relative;overflow:hidden}
    .mbti-bar .bb-fill{position:absolute;top:0;bottom:0;background:var(--skin-accent);border-radius:5px}
    .mbti-bar .bb-label{width:24px;text-align:center;font-weight:700;color:var(--text-1)}
    .mbti-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
    .mbti-cell{padding:10px 4px;text-align:center;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:700;color:var(--text-1);font-size:14px}
    .mbti-cell.cur{background:var(--skin-accent);color:var(--skin-accent-ink);border-color:var(--skin-accent)}
    .mbti-cell:hover{transform:translateY(-2px)}
    .grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .grid16 .g{font-size:12px;padding:8px 2px;text-align:center;border-radius:8px;background:var(--surface);border:1px solid var(--border);cursor:pointer;color:var(--text-1)}
    .grid16 .g.cur{background:var(--skin-accent);color:#fff}

    /* ===== 模块主题高奢背景（由 module 驱动，点击三按钮切换，L11-L13） ===== */
    .bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background .6s ease}
    /* 国学预测 · 玉青丝绢 + 金箔光晕 */
    .bg-guoxue{
      background:
        radial-gradient(130% 110% at 12% 8%, rgba(62,124,107,.18), transparent 52%),
        radial-gradient(120% 120% at 92% 96%, rgba(184,137,62,.22), transparent 55%),
        linear-gradient(158deg, #FCF9F1 0%, #F4EFE1 46%, #EAF1EC 100%);
    }
    /* 西式占卜 · 珍珠紫晕 + 琥珀金光 */
    .bg-xishi{
      background:
        radial-gradient(120% 110% at 14% 10%, rgba(91,75,138,.16), transparent 52%),
        radial-gradient(130% 120% at 90% 94%, rgba(201,162,75,.20), transparent 55%),
        linear-gradient(162deg, #FBF8F4 0%, #F2ECF4 46%, #EEEAF5 100%);
    }
    /* MBTI · 瓷白蓝调 + 薄荷极光 */
    .bg-mbti{
      background:
        radial-gradient(120% 110% at 12% 12%, rgba(74,91,181,.15), transparent 52%),
        radial-gradient(130% 120% at 92% 92%, rgba(126,211,198,.24), transparent 55%),
        linear-gradient(150deg, #F8FAFD 0%, #EEF2FA 46%, #EAF3F1 100%);
    }
    /* 三套共用：极细金箔丝缕（luxury 质感，multiply 叠加于浅底） */
    .bg-layer::after{content:"";position:absolute;inset:0;pointer-events:none;
      background:repeating-linear-gradient(135deg, rgba(184,137,62,.05) 0 2px, transparent 2px 26px);
      mix-blend-mode:multiply;opacity:.55}

    /* ===== REQ-069：快速手动输入实际结果（六法并行入口） ===== */
    .mode-switch{display:flex;gap:6px;background:var(--paper);border:1px solid var(--border);border-radius:999px;padding:3px;margin:2px 0 10px}
    .mode-switch button{flex:1;padding:8px 4px;font-size:13px;font-weight:600;color:var(--text-2);border-radius:999px;transition:.14s;white-space:nowrap;min-width:0}
    .mode-switch button.sel{background:var(--skin-accent);color:var(--skin-accent-ink)}
    .modal.ask-modal.long{max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .manual-cap{font-size:12px;color:var(--text-3);margin:2px 0 8px;line-height:1.7}
    .yao-pick{display:flex;flex-direction:column;gap:6px;margin:4px 0 2px}
    .yao-row{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 8px}
    .yao-row .yr-pos{font-size:12px;color:var(--text-3);width:36px;flex:none;text-align:center;font-weight:600}
    .yao-row .yr-btns{display:flex;gap:6px;flex:1;min-width:0}
    .yr-b{flex:1;padding:7px 0;border-radius:var(--radius-sm);font-size:14px;font-weight:700;border:1px solid var(--border);color:var(--text-2);background:var(--surface);transition:.14s;white-space:nowrap}
    .yr-b.sel.yang{background:#20202a;color:#F7F4EC;border-color:#20202a}
    .yr-b.sel.yin{background:#E9E4D8;color:#1F1F26;border-color:#B9B09A}
    .yr-mv{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);padding:4px 8px;border-radius:999px;border:1px solid transparent;background:transparent;white-space:nowrap}
    .yr-mv .mv-ring{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold-500);flex:none}
    .yr-mv.sel{color:var(--gold-600);font-weight:700;background:rgba(184,137,62,.12)}
    .yr-mv.sel .mv-ring{background:var(--gold-500);box-shadow:0 0 0 3px rgba(184,137,62,.22)}
    .sign-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:4px 0 2px}
    .sign-grid .sg{font-size:12px;padding:7px 0;text-align:center;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);color:var(--text-2);cursor:pointer;font-weight:600}
    .sign-grid .sg.sel{background:var(--gold-500);border-color:var(--gold-500);color:#fff}
    .xlr-tabs{display:flex;gap:6px;margin:2px 0 8px}
    .xlr-tab{flex:1;padding:8px 0;text-align:center;font-size:13px;font-weight:600;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer}
    .xlr-tab.sel{background:var(--skin-accent);color:var(--skin-accent-ink);border-color:var(--skin-accent)}
    .num-inline{display:flex;gap:10px;margin:6px 0 2px}
    .num-field{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
    .num-field .nf-cap{font-size:12px;color:var(--text-2);font-weight:600}
    .num-in{width:100%;box-sizing:border-box;padding:8px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-1);font-size:14px;text-align:center;outline:none}
    .num-in:focus{border-color:var(--skin-accent);box-shadow:0 0 0 2px var(--skin-accent-soft)}
    .palace-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .palace-chip{padding:9px 4px;text-align:center;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text-1)}
    .palace-chip .pc-name{font-size:14px;font-weight:700;display:block}
    .palace-chip .pc-kw{font-size:10px;color:var(--text-3);margin-top:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .palace-chip.sel{background:var(--skin-accent);color:var(--skin-accent-ink);border-color:var(--skin-accent)}
    .palace-chip.sel .pc-kw{color:rgba(255,255,255,.8)}
    .man-preview{margin-top:8px;font-size:13px;color:var(--text-2);background:var(--paper);border:1px dashed var(--border);border-radius:var(--radius-sm);padding:8px 10px;line-height:1.8}
    .man-preview b{color:var(--skin-accent);font-weight:700}
    .man-flag{font-size:12px;color:var(--gold-600);background:rgba(184,137,62,.13);border-radius:var(--radius-sm);padding:6px 10px;margin:0 0 8px;line-height:1.6}
    .warn-note{font-size:12px;color:var(--cinnabar);background:rgba(178,58,58,.08);border-radius:var(--radius-sm);padding:7px 10px;margin:8px 0 0;line-height:1.7;white-space:pre-wrap}
    .dk-filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:2px 0 8px}
    .dk-f{flex:none;padding:5px 12px;font-size:12px;font-weight:600;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;white-space:nowrap}
    .dk-f.sel{background:var(--skin-accent);color:var(--skin-accent-ink);border-color:var(--skin-accent)}
    .dk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin:4px 0}
    .dk-cell{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;padding:6px 4px 5px;text-align:center;transition:.14s;position:relative}
    .dk-cell:hover{border-color:var(--skin-accent)}
    .dk-cell.used{opacity:.32;pointer-events:none}
    .dk-cell .dk-thumb{width:50px;height:78px;border-radius:8px;overflow:hidden;margin:0 auto 4px;background:#2c2c36}
    .dk-cell .dk-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .dk-cell .dk-n{font-size:11px;color:var(--text-1);font-weight:600;line-height:1.3}
    .dk-cell.sel{border-color:var(--skin-accent);box-shadow:0 0 0 2px var(--skin-accent-soft)}
    .pick-box{margin-top:4px}
    .pick-progress{font-size:13px;color:var(--text-2);line-height:1.7}
    .pick-progress b{color:var(--skin-accent)}
    .or-row{display:flex;gap:8px;margin:2px 0 8px}
    .or-btn{flex:1;padding:9px 0;text-align:center;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-weight:700;font-size:14px;cursor:pointer}
    .or-btn.sel.up{background:rgba(62,124,107,.16);border-color:var(--jade-500);color:var(--jade-500)}
    .or-btn.sel.rev{background:rgba(178,58,58,.12);border-color:var(--cinnabar);color:var(--cinnabar)}
    .pick-slots{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
    .pk-slot{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--border);color:var(--text-3);background:var(--surface);flex:none;line-height:1.4}
    .pk-slot.filled{color:var(--skin-accent);border-color:var(--skin-accent);font-weight:600}
    .pk-slot.cur{border-color:var(--gold-500);color:var(--gold-600);font-weight:700;box-shadow:0 0 0 2px rgba(184,137,62,.18)}
    .dk-hint{font-size:12px;color:var(--text-3);line-height:1.6;margin:2px 0 4px}

    /* ===== REQ-066：功能设置（右上角菜单入口 → 设置页：7 开关 / 默认模式三选 / 保存状态） ===== */
    .tc-set-sub{font-size:12px;color:var(--text-3);line-height:1.7;margin:0 2px 6px}
    .tc-set-card{display:flex;flex-direction:column;padding:6px 20px}
    .tc-set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 2px;border-bottom:1px dashed var(--border)}
    .tc-set-row:last-child{border-bottom:none}
    .tc-set-row.col{flex-direction:column;align-items:stretch;gap:2px}
    .tc-set-text{flex:1;min-width:0}
    .tc-set-name{font-size:14px;font-weight:600;color:var(--text-1);line-height:1.5;display:block}
    .tc-set-desc{font-size:12px;color:var(--text-3);line-height:1.7;margin-top:3px;display:block}
    .tc-set-row .switch{flex:none}
    .tc-set-row .switch input:disabled + .slider{opacity:.45;cursor:not-allowed}
    .tc-set-opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .tc-set-opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-md);background:var(--surface);cursor:pointer;transition:border-color .14s,background .14s;line-height:1.4}
    .tc-set-opt:hover:not(:disabled){border-color:var(--skin-accent)}
    .tc-set-opt.sel{border-color:var(--skin-accent);background:var(--skin-accent-soft)}
    .tc-set-opt:disabled{opacity:.55;cursor:not-allowed}
    .tc-set-opt .so-dot{flex:none;width:17px;height:17px;margin-top:1px;border-radius:50%;border:1.5px solid var(--border);background:var(--paper);position:relative}
    .tc-set-opt.sel .so-dot{border-color:var(--skin-accent);background:var(--skin-accent)}
    .tc-set-opt.sel .so-dot::after{content:"";position:absolute;inset:0;margin:auto;width:6px;height:6px;border-radius:50%;background:#fff}
    .tc-set-opt .so-main{flex:1;min-width:0}
    .tc-set-opt .so-t{font-size:13.5px;font-weight:600;color:var(--text-1);line-height:1.5;display:block}
    .tc-set-opt .so-d{font-size:11.5px;color:var(--text-3);line-height:1.65;margin-top:2px;display:block}
    .tc-set-status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);line-height:1.7;margin:10px 2px 0;flex-wrap:wrap}
    .tc-set-status .ss-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--skin-accent)}
    .tc-set-status.saving{color:var(--text-2)}
    .tc-set-status.saving .ss-dot{background:var(--gold-500);animation:pulse 1.2s ease-in-out infinite}
    .tc-set-status.failed{color:var(--cinnabar)}
    .tc-set-status.failed .ss-dot{background:var(--cinnabar)}
    .tc-set-guest{font-size:12px;color:var(--text-3);background:var(--paper);border:1px dashed var(--border);border-radius:var(--radius-sm);padding:9px 12px;line-height:1.7;margin-top:10px}
    /* ===== REQ-076：太初先生 Agent —— 右上角图标入口 + 会话页 ===== */
    /* 右上角图标按钮（位于品牌区与右上角汉堡菜单之间；agent_enabled 开才显示） */
    .agent-top-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;
      background:rgba(128,128,150,.18);color:var(--skin-banner-ink);transition:background .18s ease}
    .agent-top-btn:hover{background:rgba(128,128,150,.32)}
    /* 会话页：固定视口内聊天（顶部标题+档案下拉 / 计费提示 / 消息区 / 输入区） */
    .agent-page{display:flex;flex-direction:column;height:calc(100vh - 58px);height:calc(100dvh - 58px);
      max-width:520px;margin:0 auto;padding:16px 16px 8px;box-sizing:border-box}
    .agent-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
    .agent-title{font-family:var(--font-serif);font-size:20px;font-weight:700;color:var(--text-1);
      display:flex;align-items:center;gap:6px;line-height:1.4}
    .agent-pick{position:relative;flex:1;min-width:150px}
    .agent-pick select{width:100%;padding:8px 30px 8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);
      background:var(--surface);color:var(--text-1);font-size:13px;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;
      background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
      background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
    .agent-pick select:focus{border-color:var(--skin-accent)}
    .agent-pick select:disabled{opacity:.6;cursor:not-allowed}
    .agent-pick-hint{position:absolute;right:30px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-3);pointer-events:none}
    .agent-bill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);line-height:1.6;margin-bottom:8px;flex-wrap:wrap}
    .agent-bill .bill-link{color:var(--skin-accent);cursor:pointer;font-weight:600;border-bottom:1px dashed rgba(62,124,107,.45)}
    .agent-bill .agent-sel-tag{color:var(--skin-accent);font-weight:600}
    .agent-chat{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;
      gap:10px;padding:14px;background:var(--surface);border:1px solid rgba(26,33,56,.04);border-radius:var(--radius-lg);
      box-shadow:var(--shadow-card);overscroll-behavior:contain}
    .agent-msg{display:flex;max-width:86%}
    .agent-msg.user{align-self:flex-end;justify-content:flex-end}
    .agent-msg.assistant{align-self:flex-start}
    .agent-bubble{padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
    .agent-msg.user .agent-bubble{background:var(--skin-accent);color:var(--skin-accent-ink);border-bottom-right-radius:4px}
    .agent-msg.assistant .agent-bubble{background:var(--paper);color:var(--text-1);border-bottom-left-radius:4px}
    .agent-msg.hint .agent-bubble{background:var(--skin-accent-soft);color:var(--skin-accent);font-size:12.5px;line-height:1.7}
    .agent-msg.pending .agent-bubble{background:var(--paper);color:var(--text-3)}
    .agent-loading{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-3);font-size:13px;padding:36px 10px}
    .agent-loading-dot{width:8px;height:8px;border-radius:50%;background:var(--gold-500);animation:pulse 1.2s ease-in-out infinite}
    .agent-empty{text-align:center;color:var(--text-3);font-size:13px;line-height:1.9;padding:36px 12px}
    .agent-empty-icon{font-size:26px;margin-bottom:8px;opacity:.8}
    .agent-err{background:#FFF0F0;color:var(--cinnabar);padding:10px 12px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:8px;line-height:1.6}
    .agent-input-row{display:flex;gap:8px;margin-top:10px;flex:none}
    .agent-input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-md);
      font-size:14px;background:var(--surface);color:var(--text-1);outline:none}
    .agent-input:focus{border-color:var(--skin-accent)}
    .agent-input:disabled{opacity:.7}
    .agent-send{flex:none;width:76px;padding:11px 0;border:none;border-radius:var(--radius-md);background:var(--skin-accent);
      color:var(--skin-accent-ink);font-size:14px;font-weight:600;cursor:pointer;transition:box-shadow .2s}
    .agent-send:hover:not(:disabled){box-shadow:0 4px 14px rgba(26,33,56,.2)}
    .agent-send:disabled{opacity:.55;cursor:not-allowed}
    /* REQ-066④：分享表单「太初 UI」品牌条（share_taichu_ui 开时显示在答题卡顶部） */
    .tc-share-brand{border-bottom:1px dashed var(--border);padding:2px 0 12px;margin:0 0 12px}
    .tc-share-brand-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .tc-share-brand-name{font-family:var(--font-serif);font-weight:700;font-size:17px;color:var(--text-1);letter-spacing:.04em}
    .tc-share-brand-tag{font-size:11.5px;color:var(--text-3)}
    .tc-share-brand-note{font-size:11.5px;color:var(--text-3);line-height:1.7;margin-top:7px}
    .tc-share-brand-links{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
    .tc-share-brand-links .btn{width:auto;padding:6px 14px;font-size:12px;font-weight:600;border-radius:var(--radius-pill)}

    /* ===== REQ-061：占卜动效与翻牌交互（占位/程序化 CSS 动画；不依赖外部美术） =====
       素材替换点（美术到位后在对应元素上把 CSS 变量设为 url(...) 即可，缺省=占位渐变/程序化）：
       --art-ssgw-tube 观音签筒  → .tube-body / --art-ssgw-stick 签条 → .ssgw-stick
       --art-card-back-tarot 塔罗牌背 → .fc-back.taro / --art-card-back-lenormand 雷诺曼牌背 → .fc-back.leno
       --art-coin-face 铜钱字面 → .coin .s-a / --art-coin-back 铜钱背面 → .coin .s-b
       --art-xlr-palm 掌诀底图 → .xlr-ring / --art-cast-bg 演出氛围底 → .stage-bg
       --art-mh-orbit 梅花能量环 → .mh-orb / --art-deal-pile 牌堆 → .deal-pile
       --art-ssgw-paper 笺纸纹理 → .ssgw-paper（结果区容器可选，本期仅预留槽位） */
    .art-stage{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;
      overflow:hidden;padding:30px 18px calc(20px + env(safe-area-inset-bottom));
      background:radial-gradient(140% 120% at 50% 4%, #37323C 0%, #1E1C22 55%, #100F14 100%);color:#EEE6D4;
      font-family:var(--font-serif);touch-action:manipulation;overscroll-behavior:contain;user-select:none;-webkit-user-select:none}
    .art-stage .stage-bg{position:absolute;inset:0;pointer-events:none;opacity:.55;
      background:
        radial-gradient(62% 46% at 50% 0%, rgba(201,162,75,.17), transparent 68%),
        radial-gradient(48% 42% at 10% 92%, rgba(91,75,138,.16), transparent 70%),
        radial-gradient(42% 36% at 93% 86%, rgba(184,137,62,.13), transparent 72%);
      background-image:var(--art-cast-bg,none);background-size:auto,auto,auto,cover}
    .art-fx-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .art-fx{position:absolute;border-radius:50%;background:radial-gradient(circle,#F2E2BD 0%,rgba(226,196,130,.25) 55%,transparent 75%);
      opacity:0;bottom:-8px;animation:artFloatUp linear infinite}
    @keyframes artFloatUp{0%{transform:translateY(0);opacity:0}12%{opacity:.8}88%{opacity:.5}100%{transform:translateY(-86vh);opacity:0}}
    .stage-cap{position:relative;text-align:center;margin:0 0 6px}
    .stage-title{font-size:21px;font-weight:700;letter-spacing:.12em;color:#F4E7C8}
    .stage-sub{display:block;font-size:12px;color:#A99F8C;margin-top:3px;font-family:var(--font-sans);letter-spacing:.06em}
    .stage-hint{position:relative;text-align:center;font-size:13px;color:#CFC2A6;line-height:1.7;margin:14px 0 2px;font-family:var(--font-sans)}
    .stage-hint .h-key{color:#E8C98A;font-weight:700}
    .stage-wait{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#B7AC96;
      margin-top:12px;font-family:var(--font-sans)}
    .stage-wait i{width:9px;height:9px;border-radius:50%;background:#E8C98A;animation:pulse 1s ease-in-out infinite}
    .stage-banner{position:relative;min-height:26px;text-align:center;font-size:16px;color:#F4E7C8;letter-spacing:.08em;margin-top:10px;font-weight:700}
    .stage-banner small{display:block;font-size:11.5px;color:#A99F8C;font-weight:400;margin-top:2px;font-family:var(--font-sans);letter-spacing:.04em}
    .art-skip{position:absolute;top:12px;right:14px;z-index:2;font-size:12px;color:#8E8570;background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 13px;font-family:var(--font-sans);line-height:1.4}
    .art-skip:active{transform:translateY(1px)}
    .art-cancel{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:#8E8570;
      background:none;font-family:var(--font-sans);padding:6px 14px}
    .art-stage .stage-tip{font-size:12px;color:#7E7663;font-family:var(--font-sans);margin-top:12px;line-height:1.6;text-align:center}

    /* ---- 观音灵签：签筒（占位体，点击/摇晃对象） ---- */
    .ssgw-zone{position:relative;width:220px;height:300px;margin:6px auto 0;flex:none}
    .ssgw-tube-wrap{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);cursor:pointer;-webkit-tap-highlight-color:transparent}
    .ssgw-tube-wrap.shake{animation:tubeShake .55s cubic-bezier(.45,0,.55,1)}
    @keyframes tubeShake{0%,100%{transform:translateX(-50%) rotate(0)}15%{transform:translateX(calc(-50% - 9px)) rotate(-6deg)}
      35%{transform:translateX(calc(-50% + 9px)) rotate(6deg)}55%{transform:translateX(calc(-50% - 7px)) rotate(-4deg)}
      75%{transform:translateX(calc(-50% + 7px)) rotate(4deg)}92%{transform:translateX(calc(-50% - 3px)) rotate(-2deg)}}
    .ssgw-tube{position:relative;width:150px;height:196px;animation:ssgwFloat 3.4s ease-in-out infinite}
    @keyframes ssgwFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
