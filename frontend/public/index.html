    .ssgw-tube .tube-body{position:absolute;left:7px;right:7px;top:26px;bottom:0;
      border-radius:8px 8px 26px 26px;background-color:#241A10;
      background-image:var(--art-ssgw-tube,linear-gradient(92deg,#7A4D22 0%,#A97A3C 26%,#8A5A2B 52%,#6A421D 78%,#4C2E12 100%));
      background-size:cover;background-position:center;
      box-shadow:inset -12px 0 18px rgba(0,0,0,.34),inset 9px 0 14px rgba(255,236,190,.1),0 12px 26px rgba(0,0,0,.5);
      clip-path:polygon(0% 4%,100% 4%,88% 100%,12% 100%)}
    .ssgw-tube .tube-body::after{content:"";position:absolute;inset:0;
      background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 2px,transparent 2px 30px);
      border-radius:inherit}
    .ssgw-tube .tube-rim{position:absolute;left:-8px;right:-8px;top:4px;height:30px;border-radius:50%;
      background:linear-gradient(180deg,#C89B52 0%,#8A5A2B 62%,#5E3B1B 100%);
      box-shadow:inset 0 4px 8px rgba(255,235,190,.35),0 6px 12px rgba(0,0,0,.45)}
    .ssgw-tube .tube-mouth{position:absolute;left:-4px;right:-4px;top:20px;height:22px;border-radius:50%;
      background:radial-gradient(58% 52% at 50% 38%,#3A2813 0%,#191005 74%);box-shadow:inset 0 3px 8px rgba(0,0,0,.8)}
    .ssgw-tube .tube-tips{position:absolute;left:24%;right:24%;top:12px;height:34px;overflow:hidden}
    .ssgw-tube .tube-tips i{position:absolute;top:2px;width:5px;height:30px;border-radius:2px;
      background:linear-gradient(90deg,#DDB679,#F2DFB4 45%,#C89B52);box-shadow:0 0 3px rgba(0,0,0,.35);opacity:0}
    .ssgw-tube .tube-tips i:nth-child(1){left:6%;transform:rotate(10deg);transform-origin:bottom center}
    .ssgw-tube .tube-tips i:nth-child(2){left:44%;transform:rotate(2deg);transform-origin:bottom center}
    .ssgw-tube .tube-tips i:nth-child(3){left:78%;transform:rotate(-9deg);transform-origin:bottom center}
    .ssgw-tube-wrap.shake .tube-tips i{opacity:.95;animation:tipJig .22s ease-in-out infinite alternate}
    .ssgw-tube-wrap.shake .tube-tips i:nth-child(2){animation-delay:.06s}
    .ssgw-tube-wrap.shake .tube-tips i:nth-child(3){animation-delay:.12s}
    @keyframes tipJig{from{top:3px}to{top:15px}}
    /* 签条（前端印签号；弹出→旋转→落地弹跳全 CSS） */
    .ssgw-stick{position:absolute;left:50%;top:8px;width:20px;height:104px;display:none;z-index:3;pointer-events:none;
      background-color:#E9CF97;
      background-image:var(--art-ssgw-stick,linear-gradient(93deg,#DFC184 0%,#F6E8C6 42%,#D4B06B 100%));
      background-size:cover;background-position:center;
      border:1px solid #A97A3C;border-radius:3px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
    .ssgw-stick .stick-red{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:7px;height:7px;
      border-radius:50%;background:var(--cinnabar);box-shadow:0 0 4px rgba(178,58,58,.8)}
    .ssgw-stick .stick-no{position:absolute;left:0;right:0;top:42px;text-align:center;font-size:10px;font-weight:800;
      color:#7C4E22;font-family:var(--font-sans);letter-spacing:0;line-height:1.2}
    .ssgw-stick.fly{display:block;animation:ssgwFly .62s cubic-bezier(.45,0,.9,.4) both}
    @keyframes ssgwFly{0%{opacity:0;transform:translate(-50%,6px) rotate(4deg)}18%{opacity:1}
      52%{transform:translate(26%,-118px) rotate(-108deg)}82%{opacity:1}
      100%{transform:translate(-118%,-46px) rotate(-168deg);opacity:1}}
    .ssgw-stick.land{display:block;animation:ssgwFall .58s cubic-bezier(.5,0,.75,.4) both}
    @keyframes ssgwFall{0%{transform:translate(-118%,-46px) rotate(-168deg);opacity:1}
      100%{transform:translate(-150%,150px) rotate(-206deg);opacity:1}}
    .ssgw-stick.stay{display:block;transform:translate(-150%,150px) rotate(-206deg);animation:ssgwRest .45s cubic-bezier(.3,.1,.3,1.35)}
    @keyframes ssgwRest{0%{transform:translate(-150%,150px) rotate(-206deg)}45%{transform:translate(-150%,132px) rotate(-206deg)}
      100%{transform:translate(-150%,150px) rotate(-206deg)}}
    .ssgw-stick .stick-no{opacity:0;transition:opacity .2s ease .15s}
    .ssgw-stick.reveal .stick-no{opacity:1}
    .ssgw-dust{position:absolute;left:50%;bottom:8px;width:30px;height:14px;transform:translateX(-50%)}
    .ssgw-dust i{position:absolute;left:50%;top:0;width:5px;height:5px;border-radius:50%;background:#E4C98F;opacity:0;pointer-events:none}
    .ssgw-dust i:nth-child(1){animation:dustBurst .6s ease-out .1s both}
    .ssgw-dust i:nth-child(2){animation:dustBurst .6s ease-out .18s both}
    .ssgw-dust i:nth-child(3){animation:dustBurst .6s ease-out .26s both}
    .ssgw-dust i:nth-child(4){animation:dustBurst .6s ease-out .32s both}
    .ssgw-dust i:nth-child(5){animation:dustBurst .6s ease-out .4s both}
    .ssgw-dust i:nth-child(6){animation:dustBurst .6s ease-out .46s both}
    @keyframes dustBurst{0%{transform:translate(-50%,0) scale(1);opacity:.9}
      100%{transform:translate(-50%,calc(var(--dx,-20px))) scale(.2);opacity:0}}
    .ssgw-land-glow{position:absolute;left:50%;bottom:-4px;width:120px;height:20px;transform:translateX(-50%);
      background:radial-gradient(50% 100% at 50% 50%,rgba(232,201,138,.5),transparent 75%);border-radius:50%;opacity:0}
    .ssgw-land-glow.on{opacity:1;transition:opacity .3s ease}
    /* 签文笺纸纹理替换点（可选素材 --art-ssgw-paper；未配置时保持现有白卡） */
    .card.ssgw-paper{background-image:var(--art-ssgw-paper,none);background-size:cover;background-position:center}

    /* ---- 六爻起卦：铜钱 + 爻列 ---- */
    .ly-cast-area{position:relative;display:flex;flex-direction:column;align-items:center;width:min(92vw,340px);margin-top:6px}
    .ly-coins{display:flex;gap:26px;align-items:center;justify-content:center;height:86px;margin-bottom:8px}
    .ly-coins .coin-empty{font-size:12px;color:#6E6757;letter-spacing:.14em;font-family:var(--font-sans)}
    .coin{width:62px;height:62px;position:relative;perspective:360px;flex:none}
    .coin .c3d{position:absolute;inset:0;transform-style:preserve-3d;border-radius:50%;
      transition:transform .32s cubic-bezier(.4,0,.2,1)}
    .coin .side{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;
      display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;font-family:var(--font-sans)}
    .coin .side.s-a{background-color:#E3C08A;color:#3E2A0E;border:2px solid #E8CF9A;
      background-image:var(--art-coin-face,radial-gradient(circle at 32% 28%,#E3C08A,#A97A3C 66%,#7A4D22));
      background-size:cover;background-position:center;
      box-shadow:inset 0 0 0 4px rgba(62,42,14,.25)}
    .coin .side.s-b{background-color:#2A1F12;color:#E8C98A;border:2px solid #B8893E;
      background-image:var(--art-coin-back,radial-gradient(circle at 32% 28%,#4A3623,#2A1F12 70%));
      background-size:cover;background-position:center;
      transform:rotateY(180deg);box-shadow:inset 0 0 0 4px rgba(232,201,138,.16)}
    .coin.toss .c3d{animation:coinToss .6s cubic-bezier(.34,.66,.5,1) both}
    @keyframes coinToss{0%{transform:translateY(34px) rotateY(0) rotateZ(-18deg)}
      32%{transform:translateY(-44px) rotateY(252deg) rotateZ(24deg)}
      100%{transform:translateY(0) rotateY(720deg) rotateZ(0)}}
    .coin.back .c3d{transform:rotateY(180deg)}
    .ly-rows{position:relative;display:flex;flex-direction:column-reverse;gap:9px;width:100%;margin-top:2px;padding:4px 2px}
    .ly-cast-row{display:flex;align-items:center;gap:10px;min-height:20px;opacity:.16;transition:opacity .18s ease}
    .ly-cast-row.casting{opacity:.5}
    .ly-cast-row.reveal{opacity:1}
    .ly-cast-row .lc-pos{font-size:12px;color:#9A8F76;width:44px;text-align:center;font-family:var(--font-sans);flex:none}
    .ly-cast-row .lc-bar{height:8px;flex:1;max-width:210px;border-radius:4px}
    .ly-cast-row .lc-bar.yang{background:#E6D9B4;box-shadow:0 0 6px rgba(230,217,180,.5)}
    .ly-cast-row .lc-bar.yin{background:linear-gradient(to right,#E6D9B4 0 42%,transparent 42% 58%,#E6D9B4 58% 100%)}
    .ly-cast-row .lc-bar.moving-yang{background:#E8C98A;box-shadow:0 0 8px rgba(232,201,138,.85)}
    .ly-cast-row .lc-bar.moving-yin{background:linear-gradient(to right,#E8C98A 0 42%,transparent 42% 58%,#E8C98A 58% 100%)}
    .ly-cast-row .lc-name{font-size:11px;color:#9A8F76;font-family:var(--font-sans);min-width:26px;text-align:left}
    .ly-cast-row .lc-mv{font-size:10px;font-weight:800;color:#fff;background:var(--gold-500);border-radius:999px;
      padding:1px 7px;opacity:0;transition:opacity .2s ease;font-family:var(--font-sans);line-height:1.5}
    .ly-cast-row.reveal.moving .lc-mv{opacity:1;animation:pulse 1.4s ease-in-out infinite}

    /* ---- 梅花：双环能量场 + 三节点汇聚 ---- */
    .mh-arena{position:relative;width:290px;height:250px;flex:none;margin-top:4px}
    .mh-orb,.mh-orb2{position:absolute;border-radius:50%;pointer-events:none}
    .mh-orb{left:50%;top:50%;width:216px;height:216px;transform:translate(-50%,-50%);
      border:1.5px solid rgba(232,201,138,.4);box-shadow:0 0 34px rgba(201,162,75,.22) inset}
    .mh-orb2{left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%);
      border:1px dashed rgba(232,201,138,.3);animation:spin 26s linear infinite}
    .mh-orb.on{animation:mhOrbPulse 1s ease-in-out infinite alternate}
    .mh-orb2.on{animation:spin 26s linear infinite,mhOrbPulse 1s ease-in-out infinite alternate}
    @keyframes mhOrbPulse{from{box-shadow:0 0 18px rgba(201,162,75,.16) inset}to{box-shadow:0 0 46px rgba(232,201,138,.5) inset}}
    .mh-node{position:absolute;display:flex;align-items:center;justify-content:center;gap:6px;
      background:rgba(232,201,138,.12);border:1px solid rgba(232,201,138,.4);color:#E8C98A;border-radius:999px;
      padding:4px 11px;font-size:12px;letter-spacing:.08em;opacity:.35;transition:opacity .2s ease,box-shadow .2s ease;
      font-family:var(--font-sans);white-space:nowrap}
    .mh-node.on{opacity:1;box-shadow:0 0 14px rgba(232,201,138,.55)}
    .mh-node .mh-dot{width:7px;height:7px;border-radius:50%;background:#E8C98A}
    .mh-node.on .mh-dot{animation:pulse .9s ease-in-out infinite}
    .mh-slot{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:7px 10px;
      border:1px solid rgba(232,201,138,.34);border-radius:10px;background:rgba(255,255,255,.04);text-align:center;
      font-family:var(--font-sans);font-size:12px;color:#A99F8C}
    .mh-slot b{font-size:15px;color:#F4E7C8;font-weight:700;font-family:var(--font-serif)}
    .mh-slot b.blank{color:#6E6757}
    .mh-slots-row{display:flex;gap:14px;justify-content:center;margin-top:8px}

    /* ---- 小六壬：掌诀盘走宫 ---- */
    .xlr-cast-wrap{position:relative;width:300px;height:310px;margin:4px auto 0;flex:none}
    .xlr-ring{position:absolute;left:50%;top:50%;width:236px;height:236px;transform:translate(-50%,-50%);border-radius:50%;
      background:radial-gradient(circle,rgba(232,201,138,.09) 0%,rgba(232,201,138,.03) 44%,transparent 68%);
      border:1.5px solid rgba(232,201,138,.35);box-shadow:0 0 30px rgba(201,162,75,.16) inset;
      background-image:var(--art-xlr-palm,none);background-size:cover;background-position:center}
    .xlr-ring::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(232,201,138,.22)}
    .xlr-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;color:#E8C98A;font-size:11px;letter-spacing:.1em;
      background:radial-gradient(circle,#3E3323,#221A10);border:1px solid rgba(232,201,138,.45);font-family:var(--font-sans)}
    .xlr-node{position:absolute;width:58px;margin-left:-29px;margin-top:-24px;text-align:center;pointer-events:none}
    .xlr-node .xn-badge{display:inline-flex;align-items:center;justify-content:center;height:48px;width:48px;border-radius:50%;
      background:rgba(34,26,16,.92);border:1.5px solid rgba(232,201,138,.3);color:#CFC2A6;font-size:13px;font-weight:700;
      box-shadow:0 4px 10px rgba(0,0,0,.35);transition:border-color .18s ease,box-shadow .18s ease,color .18s ease,transform .18s ease}
    .xlr-node .xn-sub{font-size:9px;color:#8E8570;margin-top:3px;letter-spacing:.04em;font-family:var(--font-sans);display:block}
    .xlr-node.on .xn-badge{color:#FFF6DE;border-color:#E8C98A;box-shadow:0 0 16px rgba(232,201,138,.75),0 4px 12px rgba(0,0,0,.4);
      transform:scale(1.08)}
    .xlr-node.hit .xn-badge{animation:nodeHit 1s ease-in-out 2}
    @keyframes nodeHit{0%,100%{box-shadow:0 0 12px rgba(232,201,138,.6)}50%{box-shadow:0 0 30px rgba(232,201,138,1),0 0 52px rgba(232,201,138,.5)}}
    .xlr-verdict{position:relative;text-align:center;margin-top:8px;font-size:14px;color:#F4E7C8;font-weight:700;letter-spacing:.1em;min-height:22px}
    .xlr-verdict small{display:block;font-size:11.5px;color:#A99F8C;font-weight:400;margin-top:3px;font-family:var(--font-sans);letter-spacing:.02em}

    /* ===== 塔罗/雷诺曼：抽牌动画 + 3D 翻牌 ===== */
    :root{--card-w:104px;--card-h:168px}
    .fan-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;width:var(--card-w)}
    .flip-card{position:relative;width:var(--card-w);height:var(--card-h);perspective:960px;cursor:pointer;
      -webkit-tap-highlight-color:transparent;flex:none}
    .flip-card.lock{cursor:default}
    .flip-card .fc-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
    .flip-card.flipped .fc-inner{transform:rotateY(180deg)}
    .fan-zone.bulk .flip-card .fc-inner{transition-delay:calc(var(--fdi,0)*.1s)}
    .fan-zone.bulk .mean-item.revealed .mi-txt{transition:opacity .3s ease calc(var(--fdi,0)*.1s)}
    .flip-card .fc-side{position:absolute;inset:0;border-radius:11px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}

  '山风蛊': {

    yaoCi: [

      { name: '六四', original: '裕父之蠱，往見吝。', baihua: '四爻阴位：宽容父弊、往见吝，治之不力。' },

  '地泽临': {

  '风地观': {

    yaoCi: [
      { name: '初六', original: '童觀，小人無咎，君子吝。', baihua: '初爻阴位：幼稚之观，小人无咎、君子吝，宜深察。' },

    yaoCi: [

  '山天大畜': {

  '泽风大过': {

  '离为火': {

      { name: '九四', original: '突如其來如，焚如，死如，棄如。', baihua: '四爻阳位：突如其来如、焚如死如弃如，骤变凶。' },
      { name: '六五', original: '出涕沱若，戚嗟若，吉。', baihua: '五爻阴位：出涕沱若、戚嗟若，吉，忧而能惧。' },
      { name: '上九', original: '王用出征，有嘉折首，獲其匪丑，無咎。', baihua: '上爻阳位：王用出征、折首获丑，无咎，明罚。' },
    ]
  },
  '泽山咸': {

      { name: '九三', original: '咸其股，執其隨，往吝。', baihua: '三爻阴位：感其股、执其随，往吝，随人失主。' },
      { name: '九四', original: '貞吉悔亡，憧憧往來，朋從爾思。', baihua: '四爻阳位：守正吉悔亡，憧憧往来、朋从尔思，感应有方。' },

    ]

  '雷风恒': {
    number: 32,
    short: '恒',
    guaCi: { original: '恆，亨，無咎，利貞，利有攸往。', baihua: '恒卦，亨无咎，利贞，利有攸往。恒久守常。' },

    yaoCi: [
      { name: '初六', original: '浚恆，貞凶，無攸利。', baihua: '初爻阴位：浚深其恒、守正凶，无所利，求恒太急。' },
      { name: '九二', original: '悔亡。', baihua: '二爻阳位：悔亡，恒而得中。' },
      { name: '九三', original: '不恆其德，或承之羞，貞吝。', baihua: '三爻阴位：不恒其德、或承之羞，守正吝，德不一。' },
      { name: '九四', original: '田無禽。', baihua: '四爻阳位：田无禽，徒劳无获。' },
      { name: '六五', original: '恆其德，貞婦人吉，夫子凶。', baihua: '五爻阴位：恒其德、贞妇人吉、夫子凶，守宜有别。' },
      { name: '上六', original: '振恆，凶。', baihua: '上爻阴位：振恒、凶，恒而失度。' },
    ]

  '天山遁': {
    number: 33,
    short: '遁',
    guaCi: { original: '遯，亨，小利貞。', baihua: '遁卦，亨，小利贞。退避隐遁。' },

    yaoCi: [
      { name: '初六', original: '遯尾，厲，勿用有攸往。', baihua: '初爻阴位：遁尾、危，勿用有攸往，退已晚。' },
      { name: '六二', original: '執之用黃牛之革，莫之勝說。', baihua: '二爻阴位：执之用黄牛之革，莫能脱，坚隐。' },
      { name: '九三', original: '系遯，有疾厲，畜臣妾吉。', baihua: '三爻阴位：系恋而遁、有疾厉，畜臣妾吉，牵绊。' },
      { name: '九四', original: '好遯，君子吉，小人否。', baihua: '四爻阳位：好遁、君子吉，小人否，洒脱。' },
      { name: '九五', original: '嘉遯，貞吉。', baihua: '五爻阳位：嘉遁、守正吉，美退。' },
      { name: '上九', original: '肥遯，無不利。', baihua: '上爻阳位：肥遁、无不利，远走高飞。' },
    ]
  },
  '雷天大壮': {
    number: 34,
    short: '大壮',
    guaCi: { original: '大壯，利貞。', baihua: '大壮卦，利贞。阳刚壮盛。' },
    xiangCi: { original: '雷在天上，大壯。君子以非禮勿履。', baihua: '雷在天上、大壮，君子非礼勿履。' },
    yaoCi: [
      { name: '初九', original: '壯于趾，征凶，有孚。', baihua: '初爻阳位：壮于趾、征凶，有孚，进宜慎。' },
      { name: '九二', original: '貞吉。', baihua: '二爻阳位：守正吉，壮而能正。' },
      { name: '九三', original: '小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。', baihua: '三爻阳位：小人用壮、君子用罔，守正危；羝羊触藩、羸其角，妄进受困。' },
      { name: '九四', original: '貞吉悔亡，藩決不羸，壯于大輿之輹。', baihua: '四爻阳位：守正吉悔亡，藩决不羸、壮于大舆之輹，碍去。' },
      { name: '六五', original: '喪羊于易，無悔。', baihua: '五爻阴位：丧羊于易、无悔，失而能安。' },
      { name: '上六', original: '羝羊觸藩，不能退，不能遂，無攸利，艱則吉。', baihua: '上爻阴位：羝羊触藩、不能退不能遂，无所利，艰则吉。' },
    ]
  },
  '火地晋': {
    number: 35,
    short: '晋',
    guaCi: { original: '晉，康侯用錫馬蕃庶，晝日三接。', baihua: '晋卦，康侯用锡马蕃庶、昼日三接。进而有光。' },
    xiangCi: { original: '明出地上，晉。君子以自昭明德。', baihua: '明出地上、晋，君子自昭明德。' },
    yaoCi: [
      { name: '初六', original: '晉如，摧如，貞吉。罔孚，裕，無咎。', baihua: '初爻阴位：晋如摧如、守正吉；未孚而宽裕无咎。' },
      { name: '六二', original: '晉如，愁如，貞吉。受茲介福于其王母。', baihua: '二爻阴位：晋如愁如、守正吉，受福于王母。' },
      { name: '六三', original: '眾允，悔亡。', baihua: '三爻阴位：众信、悔亡，得人助。' },
      { name: '九四', original: '晉如碩鼠，貞厲。', baihua: '四爻阳位：晋如硕鼠、守正危，贪进如鼠。' },
      { name: '六五', original: '悔亡，失得勿恤，往吉，無不利。', baihua: '五爻阴位：悔亡、失得勿恤，往吉无不利。' },
      { name: '上九', original: '晉其角，維用伐邑，厲，吉，無咎，貞吝。', baihua: '上爻阳位：晋其角、维用伐邑，危吉无咎，守正吝。' },
    ]
  },
  '地火明夷': {
    number: 36,
    short: '明夷',
    guaCi: { original: '明夷，利艱貞。', baihua: '明夷卦，利艰贞。光明受损、晦暗之时。' },
    xiangCi: { original: '明入地中，明夷。君子以蒞眾，用晦而明。', baihua: '明入地中、明夷，君子莅众、用晦而明。' },
    yaoCi: [
      { name: '初九', original: '明夷于飛，垂其翼。君子于行，三日不食。有攸往，主人有言。', baihua: '初爻阳位：明夷于飞、垂其翼；君子于行、三日不食，往则主人有言，宜忍。' },
      { name: '六二', original: '明夷，夷于左股，用拯馬壯，吉。', baihua: '二爻阴位：明夷伤左股，用壮马拯之吉，得助。' },
      { name: '九三', original: '明夷于南狩，得其大首，不可疾貞。', baihua: '三爻阳位：明夷南狩、得其大首，不可疾贞，缓图。' },
      { name: '六四', original: '入于左腹，獲明夷之心，于出門庭。', baihua: '四爻阴位：入左腹、获明夷之心，于出门庭，内省得要。' },
      { name: '六五', original: '箕子之明夷，利貞。', baihua: '五爻阴位：箕子之明夷、利贞，晦其明而守。' },
      { name: '上六', original: '不明晦，初登于天，后入于地。', baihua: '上爻阴位：不明晦、初登天后天入地，明暗反转。' },
    ]
  },
  '风火家人': {
    number: 37,
    short: '家人',
    guaCi: { original: '家人，利女貞。', baihua: '家人卦，利女贞。家道整肃。' },

    yaoCi: [
      { name: '初九', original: '閑有家，悔亡。', baihua: '初爻阳位：闲有家、悔亡，治家先立规。' },
      { name: '六二', original: '無攸遂，在中饋，貞吉。', baihua: '二爻阴位：无所专遂、主中馈，守正吉，妇职。' },
      { name: '九三', original: '家人嗃嗃，悔厲吉。婦子嘻嘻，終吝。', baihua: '三爻阳位：家人嗃嗃、悔厉吉；妇子嘻嘻、终吝，严而过宽皆失。' },

      { name: '九五', original: '王假有家，勿恤吉。', baihua: '五爻阳位：王假有家、勿恤吉，家齐国治。' },
      { name: '上九', original: '有孚威如，終吉。', baihua: '上爻阳位：有孚威如、终吉，威恩并施。' },
    ]
  },
  '火泽睽': {
    number: 38,
    short: '睽',
    guaCi: { original: '睽，小事吉。', baihua: '睽卦，小事吉。乖离相背。' },
    xiangCi: { original: '上火下澤，睽。君子以同而異。', baihua: '上火下泽、睽，君子同而异。' },
    yaoCi: [
      { name: '初九', original: '悔亡，喪馬勿逐，自復。見惡人無咎。', baihua: '初爻阳位：悔亡，丧马勿逐自复；见恶人无咎，化敌。' },
      { name: '九二', original: '遇主于巷，無咎。', baihua: '二爻阳位：遇主于巷、无咎，不期而遇。' },
      { name: '六三', original: '見輿曳，其牛掣，其人天且劓，無初有終。', baihua: '三爻阴位：见舆曳、其牛掣，人天且劓，无初有终，困而通。' },

      { name: '六五', original: '悔亡，厥宗噬膚，往何咎。', baihua: '五爻阴位：悔亡、厥宗噬肤，往何咎，亲族相和。' },
      { name: '上九', original: '睽孤，見豕負涂，載鬼一車，先張之弧，后說之弧，匪寇婚媾，往遇雨則吉。', baihua: '上爻阳位：睽孤见豕负涂、载鬼一车，先张弧后说弧，匪寇婚媾，遇雨则吉，疑释。' },
    ]
  },
  '水山蹇': {
    number: 39,
    short: '蹇',
    guaCi: { original: '蹇，利西南，不利東北。利見大人。貞吉。', baihua: '蹇卦，利西南、不利东北，利见大人，守正吉。山高水险。' },

    yaoCi: [
      { name: '初六', original: '往蹇，來譽。', baihua: '初爻阴位：往蹇来誉，退而有名。' },
      { name: '六二', original: '王臣蹇蹇，匪躬之故。', baihua: '二爻阴位：王臣蹇蹇、匪躬之故，尽忠不避。' },
      { name: '九三', original: '往蹇來反。', baihua: '三爻阳位：往蹇来反，退而自守。' },
      { name: '六四', original: '往蹇來連。', baihua: '四爻阴位：往蹇来连，退而相连。' },
      { name: '九五', original: '大蹇朋來。', baihua: '五爻阳位：大蹇朋来，困极得助。' },
      { name: '上六', original: '往蹇來碩，吉。利見大人。', baihua: '上爻阴位：往蹇来硕、吉，利见大人，终得转机。' },
    ]
  },
  '雷水解': {
    number: 40,
    short: '解',
    guaCi: { original: '解，利西南。無所往，其來復吉。有攸往，夙吉。', baihua: '解卦，利西南。无所往则来复吉，有攸往夙吉。险难化解。' },
    xiangCi: { original: '雷雨作，解。君子以赦過宥罪。', baihua: '雷雨作、解，君子赦过宥罪。' },
    yaoCi: [
      { name: '初六', original: '無咎。', baihua: '初爻阴位：无咎，初解无忧。' },
      { name: '九二', original: '田獲三狐，得黃矢，貞吉。', baihua: '二爻阳位：田获三狐、得黄矢，守正吉，去邪得直。' },
      { name: '六三', original: '負且乘，致寇至，貞吝。', baihua: '三爻阴位：负且乘、致寇至，守正吝，露财招盗。' },
      { name: '九四', original: '解而拇，朋至斯孚。', baihua: '四爻阳位：解其拇、朋至斯孚，释小碍得友。' },
      { name: '六五', original: '君子維有解，吉。有孚于小人。', baihua: '五爻阴位：君子维有解、吉，有孚于小人，化敌。' },
      { name: '上六', original: '公用射隼于高墉之上，獲之，無不利。', baihua: '上爻阳位：公用射隼于高墉、获之无不利，除害。' },
    ]
  },
  '山泽损': {
    number: 41,
    short: '损',
    guaCi: { original: '損，有孚，元吉，無咎，可貞，利有攸往。曷之用二簋，可用享。', baihua: '损卦，有孚、元吉无咎、可贞，利有攸往。二簋可用享，减省。' },
    xiangCi: { original: '山下有澤，損。君子以懲忿窒欲。', baihua: '山下有泽、损，君子惩忿窒欲。' },
    yaoCi: [
      { name: '初九', original: '已事遄往，無咎，酌損之。', baihua: '初爻阳位：已事遄往无咎，酌损之，速行小损。' },
      { name: '九二', original: '利貞，征凶，弗損益之。', baihua: '二爻阳位：利贞、征凶，弗损益之，不损反益。' },
      { name: '六三', original: '三人行，則損一人。一人行，則得其友。', baihua: '三爻阴位：三人行则损一人，一人行则得其友，损益相得。' },
      { name: '六四', original: '損其疾，使遄有喜，無咎。', baihua: '四爻阴位：损其疾、使遄有喜无咎，去病。' },
      { name: '六五', original: '或益之，十朋之龜弗克違，元吉。', baihua: '五爻阴位：或益之十朋之龟弗克违，元吉，受大益。' },
      { name: '上九', original: '弗損，益之，無咎，貞吉，利有攸往。得臣無家。', baihua: '上爻阳位：弗损益之、无咎贞吉，利有攸往，得臣无家，不损而益。' },
    ]
  },
  '风雷益': {
    number: 42,
    short: '益',
    guaCi: { original: '益，利有攸往，利涉大川。', baihua: '益卦，利有攸往、利涉大川。增益成长。' },
    xiangCi: { original: '風雷，益。君子以見善則遷，有過則改。', baihua: '风雷、益，君子见善则迁、有过则改。' },
    yaoCi: [
      { name: '初九', original: '利用為大作，元吉，無咎。', baihua: '初爻阳位：利用为大作、元吉无咎，乘时而兴。' },
      { name: '六二', original: '或益之，十朋之龜弗克違，永貞吉。王用享于帝，吉。', baihua: '二爻阴位：或益之十朋之龟弗克违，永贞吉；王享于帝吉，受大益。' },
      { name: '六三', original: '益之用凶事，無咎。有孚中行，告公用圭。', baihua: '三爻阴位：益用于凶事无咎，有孚中行、告公用圭，因危得益。' },
      { name: '六四', original: '中行，告公從，利用為依遷國。', baihua: '四爻阴位：中行告公从、利用为依迁国，中道得人。' },
      { name: '九五', original: '有孚惠心，勿問元吉。有孚惠我德。', baihua: '五爻阳位：有孚惠心、勿问元吉，有孚惠我德，施惠得报。' },
      { name: '上九', original: '莫益之，或擊之，立心勿恆，凶。', baihua: '上爻阳位：莫益之、或击之，立心勿恒凶，贪益招损。' },
    ]
  },
  '泽天夬': {
    number: 43,
    short: '夬',
    guaCi: { original: '夬，揚于王庭，孚號，有厲，告自邑，不利即戎，利有攸往。', baihua: '夬卦，扬于王庭、孚号有厉，告自邑、不利即戎，利有攸往。决而能和。' },
    xiangCi: { original: '澤上于天，夬。君子以施祿及下，居德則忌。', baihua: '泽上于天、夬，君子施禄及下、居德则忌。' },
    yaoCi: [
      { name: '初九', original: '壯于前趾，往不勝為吝。', baihua: '初爻阳位：壮于前趾、往不胜为吝，轻进难成。' },
      { name: '九二', original: '惕號，莫夜有戎，勿恤。', baihua: '二爻阳位：惕号、莫夜有戎勿恤，警备无忧。' },
      { name: '九三', original: '壯于頄，有凶。君子夬夬獨行，遇雨若濡，有慍，無咎。', baihua: '三爻阳位：壮于頄、有凶；君子夬夬独行、遇雨若濡，有愠无咎，刚断。' },
      { name: '九四', original: '臀無膚，其行次且。牽羊悔亡，聞言不信。', baihua: '四爻阳位：臀无肤、其行次且，牵羊悔亡，闻言不信，行滞。' },
      { name: '九五', original: '莧陸夬夬中行，無咎。', baihua: '五爻阳位：苋陆夬夬中行、无咎，果断中道。' },
      { name: '上六', original: '無號，終有凶。', baihua: '上爻阴位：无号、终有凶，失警则危。' },
    ]
  },
  '天风姤': {
    number: 44,
    short: '姤',
    guaCi: { original: '姤，女壯，勿用取女。', baihua: '姤卦，女壮，勿用取女。不期而遇。' },
    xiangCi: { original: '天下有風，姤。后以施命誥四方。', baihua: '天下有风、姤，后施命诰四方。' },
    yaoCi: [
      { name: '初六', original: '系于金柅，貞吉，有攸往，見凶，羸豕踟躅。', baihua: '初爻阴位：系于金柅、守正吉；有攸往见凶，羸豕踟躅，微动宜制。' },
      { name: '九二', original: '包有魚，無咎，不利賓。', baihua: '二爻阳位：包有鱼、无咎，不利宾，近者得之。' },
      { name: '九三', original: '臀無膚，其行次且，厲，無大咎。', baihua: '三爻阳位：臀无肤、其行次且，厉无大咎，行滞。' },
      { name: '九四', original: '包無魚，起凶。', baihua: '四爻阳位：包无鱼、起凶，失所据。' },
      { name: '九五', original: '以杞包瓜，含章，有隕自天。', baihua: '五爻阳位：以杞包瓜、含章，有陨自天，含蓄待时。' },
      { name: '上九', original: '姤其角，吝，無咎。', baihua: '上爻阳位：姤其角、吝无咎，遇于角无争。' },
    ]
  },
  '泽地萃': {
    number: 45,
    short: '萃',
    guaCi: { original: '萃，亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。', baihua: '萃卦，亨。王假有庙，利见大人，亨，利贞，用大牲吉，利有攸往。荟萃聚集。' },
    xiangCi: { original: '澤上於地，萃。君子以除戎器，戒不虞。', baihua: '泽上于地、萃，君子除戎器、戒不虞。' },
    yaoCi: [
      { name: '初六', original: '有孚不終，乃亂乃萃，若號，一握為笑，勿恤，往無咎。', baihua: '初爻阴位：有孚不终、乃乱乃萃，若号一握为笑，勿恤往无咎，诚乱复聚。' },
      { name: '六二', original: '引吉，無咎，孚乃利用禴。', baihua: '二爻阴位：引吉无咎，孚乃利用禴，牵引相聚。' },
      { name: '六三', original: '萃如，嗟如，無攸利，往無咎，小吝。', baihua: '三爻阴位：萃如嗟如、无所利，往无咎小吝，孤而不聚。' },
      { name: '九四', original: '大吉，無咎。', baihua: '四爻阳位：大吉无咎，聚得其位。' },
      { name: '九五', original: '萃有位，無咎。匪孚，元永貞，悔亡。', baihua: '五爻阴位：萃有位、无咎，匪孚、元永贞悔亡，居位聚人。' },
      { name: '上六', original: '齎咨涕洟，無咎。', baihua: '上爻阴位：齎咨涕洟、无咎，忧聚而通。' },
    ]
  },
  '地风升': {
    number: 46,
    short: '升',
    guaCi: { original: '升，元亨，用見大人，勿恤。南征吉。', baihua: '升卦，元亨，用见大人勿恤，南征吉。循序上升。' },
    xiangCi: { original: '地中生木，升。君子以順德，積小以高大。', baihua: '地中生木、升，君子顺德、积小以高大。' },
    yaoCi: [
      { name: '初六', original: '允升，大吉。', baihua: '初爻阴位：允升、大吉，信而上升。' },
      { name: '九二', original: '孚乃利用禴，無咎。', baihua: '二爻阳位：孚乃利用禴、无咎，诚而上升。' },
      { name: '九三', original: '升虛邑。', baihua: '三爻阳位：升虚邑，无阻而升。' },
      { name: '六四', original: '王用亨于岐山，吉無咎。', baihua: '四爻阴位：王用亨于岐山、吉无咎，顺天上升。' },
      { name: '六五', original: '貞吉，升階。', baihua: '五爻阴位：守正吉、升阶，步步登高。' },
      { name: '上六', original: '冥升，利于不息之貞。', baihua: '上爻阴位：冥升、利于不息之贞，昧进不止。' },
    ]
  },
  '泽水困': {
    number: 47,
    short: '困',
    guaCi: { original: '困，亨，貞大人吉，無咎。有言不信。', baihua: '困卦，亨，守正大人吉无咎，有言不信。困顿受制。' },
    xiangCi: { original: '澤無水，困。君子以致命遂志。', baihua: '泽无水、困，君子致命遂志。' },
    yaoCi: [
      { name: '初六', original: '臀困于株木，入于幽谷，三歲不見。', baihua: '初爻阴位：臀困于株木、入幽谷，三岁不见，久困。' },
      { name: '九二', original: '困于酒食，朱紱方來，利用亨祀，征凶，無咎。', baihua: '二爻阳位：困于酒食、朱紱方来，利用亨祀，征凶无咎，困而有享。' },
      { name: '六三', original: '困于石，據于蒺藜，入于其宮，不見其妻，凶。', baihua: '三爻阴位：困于石、据于蒺藜，入宫不见其妻，凶，进退皆碍。' },
      { name: '九四', original: '來徐徐，困于金車，吝，有終。', baihua: '四爻阳位：来徐徐、困于金车，吝有终，迟助。' },
      { name: '九五', original: '劓刖，困于赤紱，乃徐有說，利用祭祀。', baihua: '五爻阳位：劓刖、困于赤紱，乃徐有说，利用祭祀，困而缓释。' },
      { name: '上六', original: '困于葛藟，于臲卼，曰動悔，有悔，征吉。', baihua: '上爻阴位：困于葛藟、于臲卼，曰动悔有悔，征吉，困极思动。' },
    ]
  },
  '水风井': {
    number: 48,
    short: '井',
    guaCi: { original: '井，改邑不改井，無喪無得。往來井井，汔至亦未繘井，羸其瓶，凶。', baihua: '井卦，改邑不改井，无丧无得，往来井井；汔至亦未繘井、羸其瓶，凶。井养不穷。' },
    xiangCi: { original: '木上有水，井。君子以勞民勸相。', baihua: '木上有水、井，君子劳民劝相。' },
    yaoCi: [
      { name: '初六', original: '井泥不食，舊井無禽。', baihua: '初爻阴位：井泥不食、旧井无禽，废弃不治。' },
      { name: '九二', original: '井谷射鮒，瓮敝漏。', baihua: '二爻阳位：井谷射鲋、瓮敝漏，养而未成。' },
      { name: '九三', original: '井渫不食，為我民惻，可用汲，王明，并受其福。', baihua: '三爻阳位：井渫不食、为我民恻，可用汲，王明并受其福，洁净待用。' },
      { name: '六四', original: '井甃，無咎。', baihua: '四爻阴位：井甃、无咎，修治其壁。' },
      { name: '九五', original: '井冽，寒泉食。', baihua: '五爻阳位：井冽、寒泉食，清美可饮。' },
      { name: '上六', original: '井收勿幕，有孚元吉。', baihua: '上爻阴位：井收勿幕、有孚元吉，功成不掩。' },
    ]
  },
  '泽火革': {
    number: 49,
    short: '革',
    guaCi: { original: '革，己日乃孚，元亨利貞，悔亡。', baihua: '革卦，己日乃孚，元亨利贞，悔亡。变革除旧。' },
    xiangCi: { original: '澤中有火，革。君子以治歷明時。', baihua: '泽中有火、革，君子治历明时。' },
    yaoCi: [
      { name: '初九', original: '鞏用黃牛之革。', baihua: '初爻阳位：巩用黄牛之革，坚守待时。' },
      { name: '六二', original: '己日乃革之，征吉，無咎。', baihua: '二爻阴位：己日乃革之、征吉无咎，当革而革。' },
      { name: '九三', original: '征凶，貞厲，革言三就，有孚。', baihua: '三爻阳位：征凶守正危，革言三就、有孚，审而后行。' },
      { name: '九四', original: '悔亡，有孚改命，吉。', baihua: '四爻阳位：悔亡、有孚改命吉，信而变革。' },
      { name: '九五', original: '大人虎變，未占有孚。', baihua: '五爻阳位：大人虎变、未占有孚，变革昭明。' },
      { name: '上六', original: '君子豹變，小人革面，征凶，居貞吉。', baihua: '上爻阴位：君子豹变、小人革面，征凶居贞吉，变而有度。' },
    ]
  },
  '火风鼎': {
    number: 50,
    short: '鼎',
    guaCi: { original: '鼎，元吉，亨。', baihua: '鼎卦，元吉亨。鼎新之象。' },
    xiangCi: { original: '木上有火，鼎。君子以正位凝命。', baihua: '木上有火、鼎，君子正位凝命。' },
    yaoCi: [
      { name: '初六', original: '鼎顛趾，利出否，得妾以其子，無咎。', baihua: '初爻阴位：鼎颠趾、利出否，得妾以其子无咎，去故。' },
      { name: '九二', original: '鼎有實，我仇有疾，不我能即，吉。', baihua: '二爻阳位：鼎有实、我仇有疾不我能即，吉，实而待时。' },
      { name: '九三', original: '鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。', baihua: '三爻阳位：鼎耳革、其行塞，雉膏不食，方雨亏悔终吉，暂滞。' },
      { name: '九四', original: '鼎折足，覆公餗，其形渥，凶。', baihua: '四爻阴位：鼎折足、覆公餗、其形渥，凶，不胜其任。' },
      { name: '六五', original: '鼎黃耳金鉉，利貞。', baihua: '五爻阴位：鼎黄耳金铉、利贞，中正可用。' },
      { name: '上九', original: '鼎玉鉉，大吉，無不利。', baihua: '上爻阳位：鼎玉铉、大吉无不利，柔节而成。' },
    ]
  },
  '震为雷': {
    number: 51,
    short: '震',
    guaCi: { original: '震，亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。', baihua: '震卦，亨。震来虩虩、笑言哑哑，震惊百里、不丧匕鬯。震动戒惧。' },
    xiangCi: { original: '洊雷，震。君子以恐懼修身。', baihua: '洊雷、震，君子恐惧修身。' },
    yaoCi: [
      { name: '初九', original: '震來虩虩，后笑言啞啞，吉。', baihua: '初爻阳位：震来虩虩、后笑言哑哑，吉，惊而定。' },
      { name: '六二', original: '震來厲，億喪貝，躋于九陵，勿逐，七日得。', baihua: '二爻阴位：震来厉、亿丧贝，跻于九陵勿逐，七日得，失而复。' },
      { name: '六三', original: '震蘇蘇，震行無眚。', baihua: '三爻阴位：震苏苏、震行无眚，惧而能行。' },
      { name: '九四', original: '震遂泥。', baihua: '四爻阳位：震遂泥，陷于震中。' },
      { name: '六五', original: '震往來厲，億無喪，有事。', baihua: '五爻阴位：震往来厉、亿无丧有事，危而守业。' },
      { name: '上六', original: '震索索，視矍矍，征凶。震不于其躬，于其鄰，無咎。婚媾有言。', baihua: '上爻阴位：震索索、视矍矍，征凶；震不在躬在邻无咎，婚媾有言，惊及旁。' },
    ]
  },
  '艮为山': {
    number: 52,
    short: '艮',
    guaCi: { original: '艮，艮其背，不獲其身，行其庭，不見其人，無咎。', baihua: '艮卦，艮其背、不获其身，行其庭、不见其人，无咎。止当其止。' },
    xiangCi: { original: '兼山，艮。君子以思不出其位。', baihua: '兼山、艮，君子思不出其位。' },
    yaoCi: [
      { name: '初六', original: '艮其趾，無咎，利永貞。', baihua: '初爻阴位：艮其趾、无咎，利永贞，止之于始。' },
      { name: '六二', original: '艮其腓，不拯其隨，其心不快。', baihua: '二爻阴位：艮其腓、不拯其随，其心不快，止而难随。' },
      { name: '九三', original: '艮其限，列其夤，厲薰心。', baihua: '三爻阳位：艮其限、列其夤，厉薰心，止而受伤。' },
      { name: '六四', original: '艮其身，無咎。', baihua: '四爻阴位：艮其身、无咎，安其位。' },
      { name: '六五', original: '艮其輔，言有序，悔亡。', baihua: '五爻阴位：艮其辅、言有序，悔亡，止其言。' },
      { name: '上九', original: '敦艮，吉。', baihua: '上爻阳位：敦艮、吉，厚止。' },
    ]
  },
  '风山渐': {
    number: 53,
    short: '渐',
    guaCi: { original: '漸，女歸吉，利貞。', baihua: '渐卦，女归吉，利贞。循序渐进。' },
    xiangCi: { original: '山上有木，漸。君子以居賢德善俗。', baihua: '山上有木、渐，君子居贤德善俗。' },
    yaoCi: [
      { name: '初六', original: '鴻漸于干，小子厲。有言，無咎。', baihua: '初爻阴位：鸿渐于干、小子厉，有言无咎，始进宜慎。' },
      { name: '六二', original: '鴻漸于磐，飲食衎衎，吉。', baihua: '二爻阴位：鸿渐于磐、饮食衎衎，吉，安渐。' },
      { name: '九三', original: '鴻漸于陸，夫征不復，婦孕不育，凶。利御寇。', baihua: '三爻阳位：鸿渐于陆、夫征不复、妇孕不育，凶；利御寇，进失其偶。' },
      { name: '六四', original: '鴻漸于木，或得其桷，無咎。', baihua: '四爻阴位：鸿渐于木、或得其桷，无咎，得所依。' },
      { name: '九五', original: '鴻漸于陵，婦三歲不孕，終莫之勝，吉。', baihua: '五爻阳位：鸿渐于陵、妇三岁不孕终莫之胜，吉，久进得成。' },
      { name: '上九', original: '鴻漸于逵，其羽可用為儀，吉。', baihua: '上爻阳位：鸿渐于逵、其羽可用为仪，吉，进于高位。' },
    ]
  },
  '雷泽归妹': {
    number: 54,
    short: '归妹',
    guaCi: { original: '歸妹，征凶，無攸利。', baihua: '归妹卦，征凶、无所利。位置失当。' },
    xiangCi: { original: '澤上有雷，歸妹。君子以永終知敝。', baihua: '泽上有雷、归妹，君子永终知敝。' },
    yaoCi: [
      { name: '初九', original: '歸妹以娣，跛能履，征吉。', baihua: '初爻阳位：归妹以娣、跛能履，征吉，次之而进。' },
      { name: '九二', original: '眇能視，利幽人之貞。', baihua: '二爻阳位：眇能视、利幽人之贞，偏而能明。' },
      { name: '六三', original: '歸妹以須，反歸以娣。', baihua: '三爻阴位：归妹以须、反归于娣，待时而降。' },
      { name: '九四', original: '歸妹愆期，遲歸有時。', baihua: '四爻阳位：归妹愆期、迟归有时，延期得宜。' },
      { name: '六五', original: '帝乙歸妹，其君之袂，不如其娣之袂良，月几望，吉。', baihua: '五爻阴位：帝乙归妹、其君之袂不如其娣之袂良，月几望吉，谦而尊。' },
      { name: '上六', original: '女承筐無實，士刲羊無血，無攸利。', baihua: '上爻阴位：女承筐无实、士刲羊无血，无所利，名实不副。' },
    ]
  },
  '雷火丰': {
    number: 55,
    short: '丰',
    guaCi: { original: '丰，亨，王假之，勿憂，宜日中。', baihua: '丰卦，亨，王假之，勿忧，宜日中。丰盛盈满。' },
    xiangCi: { original: '雷電皆至，丰。君子以折獄致刑。', baihua: '雷电皆至、丰，君子折狱致刑。' },
    yaoCi: [
      { name: '初九', original: '遇其配主，雖旬無咎，往有尚。', baihua: '初爻阳位：遇其配主、虽旬无咎，往有尚，势均相得。' },
      { name: '六二', original: '丰其蔀，日中見斗，往得疑疾，有孚發若，吉。', baihua: '二爻阴位：丰其蔀、日中见斗，往得疑疾，有孚发若吉，蔽而能明。' },
      { name: '九三', original: '丰其沛，日中見昧，折其右肱，無咎。', baihua: '三爻阳位：丰其沛、日中见昧，折其右肱无咎，助失其一。' },
      { name: '九四', original: '丰其蔀，日中見斗，遇其夷主，吉。', baihua: '四爻阳位：丰其蔀、日中见斗，遇其夷主吉，得同道。' },
      { name: '六五', original: '來章，有慶譽，吉。', baihua: '五爻阴位：来章、有庆誉吉，显其文采。' },
      { name: '上六', original: '丰其屋，蔀其家，窺其戶，闃其無人，三歲不見，凶。', baihua: '上爻阴位：丰其屋、蔀其家，窥户阒其无人、三岁不见，凶，盛极孤蔽。' },
    ]
  },
  '火山旅': {
    number: 56,
    short: '旅',
    guaCi: { original: '旅，小亨，旅貞吉。', baihua: '旅卦，小亨，旅贞吉。行旅在外。' },

          el('span', {style: {display: 'flex', gap: 10, alignItems: 'center'}},
            el('button', {style: {fontSize: 12, color: 'var(--skin-accent)', fontWeight: 600}, onClick: pickAnother}, '更换档案'),
            el('button', {style: {fontSize: 12, color: 'var(--skin-accent)', fontWeight: 600}, onClick: () => setView('grid')}, '我已知道类型，直接输入'))),
        el('div', {className: 'mbti-progress'}, el('i', {style: {width: pct + '%'}})),
        scoring ? el('div', {style: {textAlign: 'center', color: 'var(--text-2)', padding: '18px 0'}}, '判型中…') : el(React.Fragment, null,
          el('div', {style: {fontSize: 17, fontWeight: 700, color: 'var(--text-1)', lineHeight: 1.6, margin: '10px 0'}}, cur.text),
          el('div', {style: {display: 'flex', flexDirection: 'column', gap: 10}},
            (cur.options || []).map(o => el('button', {key: o.key, className: 'btn btn-outline', onClick: () => choose(o.key)}, o.key + '. ' + o.text))),
          el('div', {className: 'back-row'},
            idx > 0 ? el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => setIdx(idx - 1)}, '上一题') : null,
            el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => {
              setIdx(0);
              setAnswers([]);
              setScoreErr('');
            }}, '重新开始'))),
        scoreErr ? el('div', {className: 'card failed-box', style: {margin: '10px 0 0'}},
          el('div', {className: 'section-title'}, '判型失败'),
          el('div', {className: 'error'}, scoreErr),
          el('div', {className: 'back-row', style: {justifyContent: 'center'}},
            el('button', {className: 'btn btn-primary', style: {width: 'auto'}, onClick: () => submitScore(answers)}, '重试判型'),
            idx > 0 ? el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => setIdx(idx - 1)}, '返回上一题') : null,
            el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: reset}, '重新开始'))) : null);
    }
  }
  return el('div', {className: 'container'},
    el('div', {className: 'hub-title'}, el(Icon, {name: 'spark', size: 22}), ' MBTI 人格测试'),
    el('div', {style: {fontSize: 12, color: 'var(--text-3)', marginBottom: 4}}, '16 型人格测评 · 60 题 · 判型与文案由后端接口提供'),
    el('div', {className: 'pair-entry'},
      el('div', {className: 'pe-main'},
        el('div', {className: 'pe-title'}, '配对解析'),
        el('div', {className: 'pe-sub'}, '选择两份已测 MBTI 档案，基于双方人格信息解读两人相处与协作（付费 LLM，按实际用量扣余额 ¥）')),
      el('button', {className: 'btn btn-outline', type: 'button', onClick: () => openPairAnalyze({module: 'mbti'})}, ['配对解析', payBadge(payEnough)])),
    body);
}

/* ---------- REQ-070：档案「分享帮填」落地页（/case/share/{token} 免登录代建档案，归发起者） ---------- */
// 访客打开发起者分享的一次性链接：GET /api/case/share/{token}（免登录；noAuth 强制不带
// Authorization）→ 展示「为 {owner_name} 填写档案」+ 与统一建档组件（OnboardingPage）同构的表单：
// 姓名（必填，即代建档案名）+ 出生年/月/日/时辰 + 性别 + 出生地（省市区级联，选到区县自动带经纬度）
// + 真太阳时 + 选填手机号/邮箱。POST /api/case/share/{token}/submit 代建档案（一次性，成功后后端
// 原子置 used 失效），成功 toast「已提交，档案归发起者」并停在成功态（不跳发起者档案列表）。
// 访客隔离：本页为独立表单页——全程 noAuth + App 访客会话置空，不展示/不可访问发起者任何既有档案
// 数据；链接不存在/已使用/已过期（404）统一渲染「分享链接不存在或已失效」。
function CaseSharePage({
  token,
  onNavigate
}) {
  const el = React.createElement;
  const C = UI_COPY.caseShareLanding;
  const reg = typeof window !== 'undefined' && window.REGIONS || {};
  const curYear = new Date().getFullYear();
  const defaultYear = String(Math.max(1940, curYear - 35));
  const YEARS = [];
  for (let y = curYear - 18; y >= 1940; y--) YEARS.push(String(y));
  const MONTHS = [];
  for (let m = 1; m <= 12; m++) MONTHS.push(String(m));
  const DAYS = [];
  for (let d = 1; d <= 31; d++) DAYS.push(String(d));
  const HOURS = [];
  for (let h = 0; h <= 23; h++) HOURS.push(String(h));
  // BUG-009 加固：token 判空/去空白 —— 直接访问 /case/share 无 token、或 token 在路由/传参环节
  // 丢失时，立即按「缺少链接参数」渲染（见下方 !tk 分支），绝不发起 /case/share/undefined 之类请求。
  const tk = token && String(token).trim() ? String(token).trim() : '';
  const base = tk ? '/case/share/' + encodeURIComponent(tk) : null;
  // 表单默认值镜像统一建档组件：年份预置默认年，月/日留空由访客选择，时辰/性别带后端同款默认值
  const blankForm = () => ({
    name: '',
    birth_year: defaultYear,
    birth_month: '',
    birth_day: '',
    birth_hour: '0',
    gender: 'male',
    birth_province: '',
    birth_city: '',
    birth_district: '',
    longitude: '',
    latitude: '',
    true_solar_time: false,
    phone: '',
    email: ''
  });
  const [meta, setMeta] = useState(null); // GET 返回 {owner_name, fields}（仅发起者昵称，无档案数据）
  const [loading, setLoading] = useState(true);
  const [errored, setErrored] = useState('');
  const [form, setForm] = useState(blankForm);
  const [coordTouched, setCoordTouched] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false); // 提交成功 → 停在成功态，不回跳发起者档案列表
  const [err, setErr] = useState('');
  // —— 拉取落地页信息（GET /api/case/share/{token}，免登录；noAuth 强制不带 Authorization）——
  useEffect(() => {
    let alive = true;
    if (!tk) {
      setLoading(false);
      setErrored(C.invalid_no_token);
      return () => {
        alive = false;
      };
    }
    (async () => {
      setLoading(true);
      setErrored('');
      try {
        const res = await api(base, { noAuth: true });
        const d = res && res.data || res || {};
        if (!d || !d.owner_name) throw new Error(C.invalid_link);
        if (alive) setMeta({
          owner_name: d.owner_name
        });
      } catch (e) {
        // 404（不存在/已用/过期，后端不区分细节）→ 统一按「链接不存在或已失效」提示
        if (alive) setErrored(e && e.status === 404 ? C.invalid_link : (e && e.message ? e.message : C.load_fail));
      } finally {
        if (alive) setLoading(false);
      }
    })();
    return () => {
      alive = false;
    };
  }, [tk]);
  // —— 表单联动（与 OnboardingPage 建档组件同构：原生 select 点击即填；出生地级联自动带经纬度）——
  const update = k => e => setForm(Object.assign({}, form, {
    [k]: e.target.value
  }));
  const updateProvince = e => {
    const p = e.target.value;
    const cs = p && reg[p] ? Object.keys(reg[p]) : [];
    const next = Object.assign({}, form, {
      birth_province: p,
      birth_city: '',
      birth_district: ''
    });
    if (cs.length === 1) next.birth_city = cs[0]; // 直辖市等单「市/市辖区」结构：市自动带出
    if (!coordTouched) {
      next.longitude = '';
      next.latitude = '';
    }
    setForm(next);
  };
  const updateCity = e => {
    const c = e.target.value;
    const next = Object.assign({}, form, {
      birth_city: c,
      birth_district: ''
    });
    if (!coordTouched) {
      next.longitude = '';
      next.latitude = '';
    }
    setForm(next);
  };
  const updateDistrict = e => {
    const d = e.target.value;
    const next = Object.assign({}, form, {
      birth_district: d
    });
    if (!coordTouched && d) {
      const coord = reg[form.birth_province] && reg[form.birth_province][form.birth_city] && reg[form.birth_province][form.birth_city][d];
      if (coord) {
        next.longitude = String(coord[0]);
        next.latitude = String(coord[1]);
      }
    }
    setForm(next);
  };
  const updateCoord = k => e => {
    setCoordTouched(true);
    setForm(Object.assign({}, form, {
      [k]: e.target.value
    }));
  };
  const toggleSolar = e => setForm(Object.assign({}, form, {
    true_solar_time: e.target.checked
  }));
  // —— 提交代建（POST /api/case/share/{token}/submit，免登录；字段名与后端 CaseShareSubmitRequest 精确对齐）——
  const submitCase = async () => {
    if (submitting) return;
    setSubmitting(true);
    setErr('');
    const y = +form.birth_year,
      m = +form.birth_month,
      d = +form.birth_day,
      h = +form.birth_hour;
    const nameRaw = String(form.name || '').trim();
    const phoneRaw = String(form.phone || '').trim();
    const emailRaw = String(form.email || '').trim();
    // 姓名必填（strip 后非空，与后端口径一致）
    if (!nameRaw) {
      setErr(C.name_required);
      setSubmitting(false);
      return;
    }
    if (!y || y < 1900 || y > 2100) {
      setErr(C.year_err);
      setSubmitting(false);
      return;
    }
    if (!m || m < 1 || m > 12) {
      setErr(C.month_err);
      setSubmitting(false);
      return;
    }
    if (!d || d < 1 || d > 31) {
      setErr(C.day_err);
      setSubmitting(false);
      return;
    }
    if (h < 0 || h > 23 || isNaN(h)) {
      setErr(C.hour_err);
      setSubmitting(false);
      return;
    }
    // 选填联系方式格式校验（与 REQ-065 / 建档同口径）
    if (phoneRaw && !/^\d{11}$/.test(phoneRaw)) {
      toast(C.phone_err);
      setSubmitting(false);
      return;
    }
    if (emailRaw && !/^[^\s@]+@[^\s@]+$/.test(emailRaw)) {
      toast(C.email_err);
      setSubmitting(false);
      return;
    }
    const birthplace = [form.birth_province, form.birth_city, form.birth_district].filter(Boolean).join('/');
    try {
      const res = await api(base + '/submit', {
        method: 'POST',
        noAuth: true,
        body: JSON.stringify({
          name: nameRaw,
          birth_year: y,
          birth_month: m,
          birth_day: d,
          birth_hour: h,
          gender: form.gender,
          birthplace: birthplace,
          longitude: form.longitude ? +form.longitude : null,
          latitude: form.latitude ? +form.latitude : null,
          true_solar_time: !!form.true_solar_time,
          phone: phoneRaw || null,
          email: emailRaw || null
        })
      });
      const rd = res && res.data || res || {};
      if (!rd || !rd.caseId) throw new Error(C.submit_fail);
      toast(C.ok_toast); // 已提交，档案归发起者
      setDone(true); // 停在成功态（一次性链接后端已置 used，本页不再跳转发起者档案列表）
    } catch (e) {
      // 404：链接已被并发消费/过期 → 按「链接不存在或已失效」提示；其余透传后端/通用文案
      if (e && e.status === 404) toast(C.submit_link_dead); else toast(e && e.message ? e.message : C.submit_fail);
    } finally {
      setSubmitting(false);
    }
  };
  const handleSubmit = e => {
    e.preventDefault();
    submitCase();
  };
  let body;
  if (done) {
    // —— 成功态：提交后停留本页（不跳发起者档案列表）——
    body = el('div', { className: 'card', style: { textAlign: 'center', padding: '28px 18px' } },
      el('div', { className: 'section-title' }, C.ok_title),
      el('div', { style: { fontSize: 17, fontWeight: 700, color: 'var(--text-1)', margin: '10px 0 6px' } }, C.ok_toast),
      el('div', { style: { fontSize: 12.5, color: 'var(--text-3)', lineHeight: 1.7, margin: '0 0 16px' } }, C.ok_note),
      el('div', { className: 'back-row', style: { justifyContent: 'center' } },
        el('button', { className: 'btn btn-primary', style: { width: 'auto' }, onClick: () => onNavigate('landing') }, C.done_btn)));
  } else if (!tk) {
    // BUG-009 加固（渲染兜底）：token 为空/缺失 → 不等 effect、不闪 loading，直接渲染「无法打开分享」
    body = el('div', { className: 'card failed-box' },
      el('div', { className: 'section-title' }, C.invalid_title),
      el('div', { className: 'error' }, C.invalid_no_token),
      el('div', { className: 'back-row', style: { justifyContent: 'center' } },
        el('button', { className: 'btn btn-primary', style: { width: 'auto' }, onClick: () => onNavigate('landing') }, UI_COPY.buttons.back_home)));
  } else if (loading) {
    body = el('div', { className: 'card', style: { textAlign: 'center', color: 'var(--text-2)', padding: '28px 16px' } }, C.loading);
  } else if (errored) {
    // 404（不存在/已用/过期）→ 统一失败态
    body = el('div', { className: 'card failed-box' },
      el('div', { className: 'section-title' }, C.invalid_title),
      el('div', { className: 'error' }, errored),
      el('div', { className: 'back-row', style: { justifyContent: 'center' } },
        el('button', { className: 'btn btn-primary', style: { width: 'auto' }, onClick: () => onNavigate('landing') }, UI_COPY.buttons.back_home)));
  } else {
    // —— 免登录代填表单视图 ——
    const ownerName = meta && meta.owner_name ? meta.owner_name : '';
    const cityNames = form.birth_province && reg[form.birth_province] ? Object.keys(reg[form.birth_province]) : [];
    const districtNames = form.birth_province && form.birth_city && reg[form.birth_province] && reg[form.birth_province][form.birth_city] ? Object.keys(reg[form.birth_province][form.birth_city]) : [];
    body = el('div', { className: 'card' },
      el('h2', { className: 'title' }, C.fill_for.replace('{owner}', ownerName)),
      el('p', { style: { fontSize: 12.5, color: 'var(--text-2)', margin: '2px 0 12px', lineHeight: 1.7 } }, C.intro),
      err ? el('div', { className: 'error', style: { marginBottom: 12 } }, err) : null,
      el('form', { onSubmit: handleSubmit },
        el('label', { className: 'label', htmlFor: 'cs_name' }, C.name_label),
        el('input', { id: 'cs_name', className: 'input', type: 'text', maxLength: 128, value: form.name, onChange: update('name'), placeholder: C.name_ph, required: true }),
        el('label', { className: 'label', htmlFor: 'cs_year' }, C.year_label),
        el('select', { id: 'cs_year', className: 'input', value: form.birth_year, onChange: update('birth_year'), required: true },
          el('option', { value: '' }, C.select_ph),
          YEARS.map(v => el('option', { key: v, value: v }, v))),
        el('label', { className: 'label', htmlFor: 'cs_month' }, C.month_label),
        el('select', { id: 'cs_month', className: 'input', value: form.birth_month, onChange: update('birth_month'), required: true },
          el('option', { value: '' }, C.select_ph),
          MONTHS.map(v => el('option', { key: v, value: v }, v))),
        el('label', { className: 'label', htmlFor: 'cs_day' }, C.day_label),
        el('select', { id: 'cs_day', className: 'input', value: form.birth_day, onChange: update('birth_day'), required: true },
          el('option', { value: '' }, C.select_ph),
          DAYS.map(v => el('option', { key: v, value: v }, v))),
        el('label', { className: 'label', htmlFor: 'cs_hour' }, C.hour_label),
        el('select', { id: 'cs_hour', className: 'input', value: form.birth_hour, onChange: update('birth_hour') },
          HOURS.map(v => el('option', { key: v, value: v }, v))),
        el('label', { className: 'label', htmlFor: 'cs_gender' }, C.gender_label),
        el('select', { id: 'cs_gender', className: 'input', value: form.gender, onChange: update('gender') },
          el('option', { value: 'male' }, C.gender_male),
          el('option', { value: 'female' }, C.gender_female)),
        el('label', { className: 'label' }, C.birth_place_label),
        el('div', { className: 'field-row' },
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_province' }, C.province_label),
            el('select', { id: 'cs_province', className: 'input', value: form.birth_province, onChange: updateProvince },
              el('option', { value: '' }, C.select_ph),
              Object.keys(reg).map(p => el('option', { key: p, value: p }, p)))),
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_city' }, C.city_label),
            el('select', { id: 'cs_city', className: 'input', value: form.birth_city, onChange: updateCity, disabled: !form.birth_province },
              el('option', { value: '' }, C.select_ph),
              cityNames.map(c => el('option', { key: c, value: c }, c)))),
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_district' }, C.district_label),
            el('select', { id: 'cs_district', className: 'input', value: form.birth_district, onChange: updateDistrict, disabled: !form.birth_city },
              el('option', { value: '' }, C.select_ph),
              districtNames.map(x => el('option', { key: x, value: x }, x))))),
        el('div', { className: 'field-row' },
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_lng' }, C.lng_label),
            el('input', { id: 'cs_lng', className: 'input', type: 'number', step: '0.0001', value: form.longitude, onChange: updateCoord('longitude'), placeholder: C.lng_ph })),
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_lat' }, C.lat_label),
            el('input', { id: 'cs_lat', className: 'input', type: 'number', step: '0.0001', value: form.latitude, onChange: updateCoord('latitude'), placeholder: C.lat_ph }))),
        !coordTouched && form.longitude && form.latitude ? el('p', { className: 'coord-hint' }, C.coord_auto_note) : null,
        el('div', { className: 'field-row', style: { marginTop: 12 } },
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_phone' }, C.phone_label),
            el('input', { id: 'cs_phone', className: 'input', type: 'tel', inputMode: 'numeric', maxLength: 11, value: form.phone, onChange: update('phone'), placeholder: C.phone_ph })),
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_email' }, C.email_label),
            el('input', { id: 'cs_email', className: 'input', type: 'email', value: form.email, onChange: update('email'), placeholder: C.email_ph }))),
        el('p', { style: { fontSize: 12, color: 'var(--text-3)', margin: '2px 0 0', lineHeight: 1.5 } }, C.contact_note),
        el('div', { className: 'switch-row' },
          el('label', { className: 'switch' },
            el('input', { type: 'checkbox', id: 'cs_solar', checked: form.true_solar_time, onChange: toggleSolar }),
            el('span', { className: 'slider' })),
          el('label', { htmlFor: 'cs_solar', style: { fontSize: 13, color: 'var(--text-2)' } }, C.solar_label)),
        el('div', { className: 'field-row', style: { marginTop: 14 } },
          el('button', { className: 'btn btn-primary', type: 'submit', disabled: submitting, style: { flex: '1 1 auto' } }, submitting ? C.submitting : C.submit)),
        el('p', { style: { fontSize: 11.5, color: 'var(--text-3)', margin: '12px 0 0', lineHeight: 1.7 } }, C.privacy_note),
        el('p', { style: { fontSize: 11.5, color: 'var(--text-3)', margin: '6px 0 0', lineHeight: 1.7 } }, UI_COPY.landing.disclaimer_short)));
  }
  return el('div', { className: 'container' },
    el('div', { className: 'hub-title' }, el(Icon, { name: 'spark', size: 22 }), ' ' + C.hub_title),
    body);
}

/* ---------- REQ-047：免登录分享答题页（/mbti/share/{token} 直达 · 公开免登录） ---------- */
function MbtiSharePage({
  token,
  onNavigate
}) {
  const el = React.createElement;
  // REQ-066④：分享表单太初 UI —— share_taichu_ui 开 → 答题表单内显示太初 logo、登录注册与免责提示；
  // 关 → 仅表单（填完仅保存结果；访客会话隔离与受限页拦截由 BUG-011 / BUG-002 负责）。
  const shareUiOn = TC_SETTINGS.share_taichu_ui !== false;
  const shareBrand = shareUiOn ? el('div', {className: 'tc-share-brand'},
    el('div', {className: 'tc-share-brand-head'},
      el(Icon, {name: 'spark', size: 18}),
      el('span', {className: 'tc-share-brand-name'}, UI_COPY.brand.name),
      el('span', {className: 'tc-share-brand-tag'}, UI_COPY.brand.tagline)),
    el('div', {className: 'tc-share-brand-note'}, UI_COPY.landing.disclaimer_short),
    el('div', {className: 'tc-share-brand-links'},
      el('button', {type: 'button', className: 'btn btn-outline', onClick: () => onNavigate('auth')}, '登录 / 注册'),
      el('button', {type: 'button', className: 'btn btn-outline', onClick: () => onNavigate('landing')}, '了解太初'))) : null;
  const [caseName, setCaseName] = useState('');
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState([]); // [{question_id, choice}]
  const [scoring, setScoring] = useState(false);
  const [result, setResult] = useState(null); // {type, scores}
  const [loading, setLoading] = useState(true);
  const [errored, setErrored] = useState('');
  const total = questions && questions.length ? questions.length : 0;
  // BUG-009 加固①：token 判空/去空白 —— 直接访问 /mbti/share 无 token、或 token 在路由/传参环节

  const tk = token && String(token).trim() ? String(token).trim() : '';

  // —— 拉取分享题库（GET /api/mbti/share/{token}，免登录；BUG-011：noAuth 强制不带 Authorization）——
  useEffect(() => {
    let alive = true;

      setLoading(false);
      setErrored('分享链接无效');
      return () => { alive = false; };
    }
    (async () => {
      setLoading(true);
      setErrored('');
      try {
        const res = await api(base, {noAuth: true});
        const d = res && res.data || res || {};
        const list = d.questions || [];
        if (!list.length) throw new Error('题库为空');
        if (alive) {
          setCaseName(d.case_name || '');
          setQuestions(list);
        }
      } catch (e) {
        // 404（code1002）/ 网络失败 → 统一按「链接失效」提示
        if (alive) setErrored('分享链接不存在或已失效');
      } finally {
        if (alive) setLoading(false);
      }
    })();

      alive = false;
    };

        method: 'POST',
        noAuth: true,
        body: JSON.stringify({
          answers: list

    const next = answers.slice();

      question_id: q.id,
      choice: key

        el('div', {className: 'back-row', style: {justifyContent: 'center'}},
          el('button', {className: 'btn btn-primary', style: {width: 'auto'}, onClick: () => {

      body = el('div', {className: 'card'},
        el('div', {style: {display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 6, fontSize: 12, color: 'var(--text-3)', marginBottom: 2}},

          el('span', {style: {display: 'flex', gap: 10, alignItems: 'center'}},
            el('button', {style: {fontSize: 12, color: 'var(--skin-accent)', fontWeight: 600}, onClick: () => {

        scoring ? el('div', {style: {textAlign: 'center', color: 'var(--text-2)', padding: '18px 0'}}, '判型中…') : el(React.Fragment, null,
          el('div', {style: {fontSize: 17, fontWeight: 700, color: 'var(--text-1)', lineHeight: 1.6, margin: '10px 0'}}, q.text),

            opts.length ? opts.map(o => el('button', {key: o.key, className: 'btn btn-outline', onClick: () => choose(o.key)}, o.key + '. ' + o.text))

  }

  const inForm = !!tk && !result && !loading && !errored && total > 0 && !!questions[idx];
  return el('div', {className: 'container'},
    el('div', {className: 'hub-title'}, el(Icon, {name: 'spark', size: 22}), ' MBTI 人格测试'),
    caseName && !result ? el('div', {style: {fontSize: 13, color: 'var(--text-2)', marginBottom: 2}}, '为「' + caseName + '」填写 MBTI') : null,
    inForm && shareUiOn ? el('div', {className: 'card', style: {padding: '14px 20px 10px', margin: '12px 0 0'}}, shareBrand) : null,
    body);
