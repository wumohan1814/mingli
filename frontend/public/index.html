<!DOCTYPE html>
<html lang="zh-CN" data-skin="guoxue">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>太初 · 命理全局运势趋势</title>
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/regions.js"></script>
  <style>
    :root{
      /* 主色 墨蓝 / 靛青 */
      --ink-400:#5E6FB3; --ink-500:#44558F; --ink-600:#364573; --ink-700:#2C385C; --ink-900:#1A2138;
      /* 金 / 玉 / 朱砂 */
      --gold-300:#E6CF9A; --gold-500:#B8893E; --gold-600:#9C6E2E;
      --jade-500:#3E7C6B; --cinnabar:#B23A3A; --error:#C0392B;
      /* 中性 宣纸暖灰 */
      --paper:#F7F4EC; --surface:#FFFFFF; --text-1:#1F1F26; --text-2:#5C5C68; --text-3:#8A8A94; --border:#E5E0D4;
      /* 字体 */
      --font-serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
      --font-sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Hiragino Sans GB",sans-serif;
      --font-latin-serif:Georgia,"Times New Roman",serif;
      /* 圆角 / 阴影 */
      --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
      --shadow-card:0 2px 12px rgba(26,33,56,.10);
      --dur:.22s; --ease:cubic-bezier(.4,0,.2,1);

      /* ===== 多文化皮肤（v1.2.7 最终）：内部标识色=玉青（按钮/吉），顶部 Banner + 底部胶囊=朱砂红 ===== */
      --skin-accent:#3E7C6B;
      --skin-accent-soft:rgba(62,124,107,.14);
      --skin-accent-ink:#F7F4EC;
      --skin-banner:#B23A3A;
      --skin-banner-ink:#F7F4EC;
      --skin-tag-bg:rgba(0,0,0,.16);
    }
    /* 西式占星：内部=深空蓝；顶部 Banner=月银 */
    [data-skin="astrology"]{
      --skin-accent:#2A3A5C; --skin-accent-soft:rgba(42,58,92,.14); --skin-accent-ink:#F7F4EC;
      --skin-banner:#C9CBD3; --skin-banner-ink:#1F1F26; --skin-tag-bg:rgba(255,255,255,.55);
    }
    /* 塔罗：内部=琥珀；顶部 Banner=紫晶 */
    [data-skin="tarot"]{
      --skin-accent:#C9A24B; --skin-accent-soft:rgba(201,162,75,.18); --skin-accent-ink:#1F1F26;
      --skin-banner:#5B4B8A; --skin-banner-ink:#F7F4EC; --skin-tag-bg:rgba(0,0,0,.16);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{font-family:var(--font-sans);color:var(--text-1);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
    .serif{font-family:var(--font-serif)}
    button{font-family:inherit;cursor:pointer;border:none;background:none}
    input,select,textarea{font-family:inherit}

    /* 星点背景（星象式沉浸感，低透明度不影响阅读） */
    .starfield{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.55;
      background:
        radial-gradient(1px 1px at 18% 28%, rgba(230,207,154,.8), transparent),
        radial-gradient(1px 1px at 76% 18%, rgba(230,207,154,.55), transparent),
        radial-gradient(1.6px 1.6px at 52% 62%, rgba(255,255,255,.55), transparent),
        radial-gradient(1px 1px at 86% 74%, rgba(230,207,154,.65), transparent),
        radial-gradient(1.2px 1.2px at 12% 82%, rgba(255,255,255,.45), transparent),
        radial-gradient(1.4px 1.4px at 33% 12%, rgba(230,207,154,.5), transparent);
      background-repeat:no-repeat;animation:twinkle 6s ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.7}}

    .app-shell{position:relative;z-index:1;min-height:100vh;padding-top:58px;padding-bottom:104px}
    .container{max-width:480px;margin:0 auto;padding:24px 20px}

    /* 顶部固定 Banner（随主题换色） */
    .topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
      padding:12px 20px;background:var(--skin-banner);color:var(--skin-banner-ink);
      box-shadow:0 1px 0 var(--gold-500),0 6px 18px rgba(26,33,56,.18);transition:background var(--dur) var(--ease)}
    .brand{font-family:var(--font-serif);font-weight:700;font-size:18px;letter-spacing:.04em}
    .brand .dot{color:var(--gold-300);margin:0 2px}
    .topbar .tagline{font-size:12px;opacity:.85}

    /* 底部皮肤切换胶囊（随主题换色） */
    .skin-switch{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;display:flex;gap:6px;
      padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);
      box-shadow:0 6px 18px rgba(26,33,56,.14)}
    .skin-switch button{padding:8px 16px;border-radius:var(--radius-pill);font-size:13px;color:var(--text-2);font-weight:500;position:relative;transition:background var(--dur) var(--ease)}
    .skin-switch button.active{background:var(--skin-banner);color:var(--skin-banner-ink)}
    .skin-switch button:disabled{opacity:.5;cursor:not-allowed}
    .skin-switch button .soon{display:block;font-size:9px;opacity:.7;font-weight:400}

    /* 卡片 / 按钮 / 表单 */
    .card{background:var(--surface);border-radius:var(--radius-lg);padding:24px;margin:12px 0;box-shadow:var(--shadow-card);border:1px solid rgba(26,33,56,.04)}
    .feature{border-left:3px solid var(--skin-accent)}
    .btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;border:none;border-radius:var(--radius-md);font-size:16px;cursor:pointer;font-weight:600;transition:transform .12s,box-shadow .2s}
    .btn:active{transform:translateY(1px)}
    .btn-primary{background:var(--skin-accent);color:var(--skin-accent-ink);box-shadow:0 4px 16px rgba(26,33,56,.18)}
    .btn-gold{background:var(--gold-500);color:#fff}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-1)}
    .input{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;margin:8px 0;background:var(--surface);color:var(--text-1)}
    .input:focus{outline:none;border-color:var(--skin-accent)}
    .label{font-size:13px;color:var(--text-2);margin-top:12px;display:block}

    /* 注册协议勾选（仅注册页显示） */
    .agree-row{display:flex;align-items:flex-start;gap:8px;margin:14px 0 2px;text-align:left}
    .agree-row input{flex-shrink:0;margin-top:3px;width:auto;accent-color:var(--skin-accent);cursor:pointer}
    .agree-label{font-size:13px;color:var(--text-2);line-height:1.6;cursor:pointer}
    .agree-label a{color:var(--ink-500);text-decoration:none;border-bottom:1px solid rgba(68,85,143,.35);margin:0 1px}
    .agree-label a:hover{color:var(--skin-accent);border-bottom-color:currentColor}
    .title{font-family:var(--font-serif);font-size:24px;color:var(--ink-700);text-align:center;margin:8px 0 16px;font-weight:600}
    .subtitle{font-size:14px;color:var(--text-2);text-align:center;margin-bottom:24px}
    .error{background:#FFF0F0;color:var(--cinnabar);padding:12px;border-radius:var(--radius-sm);font-size:13px}
    .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--radius-pill);background:var(--skin-tag-bg);color:var(--skin-banner-ink);margin-right:4px}

    /* 免责星印（跨皮肤合规标记，硬编码朱砂） */
    .disclaimer{font-size:11px;color:var(--cinnabar);text-align:center;margin:0 auto;padding:18px 20px;max-width:480px;line-height:1.6}
    .disclaimer .star{margin-right:4px}
    /* 协议链接行（低调小字，随免责色） */
    .disclaimer .legal-links{margin-top:8px;font-size:10px;letter-spacing:.02em}
    .disclaimer .legal-links a{color:inherit;text-decoration:none;border-bottom:1px dashed rgba(178,58,58,.4);padding-bottom:1px;margin:0 3px;opacity:.85}
    .disclaimer .legal-links a:hover{opacity:1;border-bottom-color:rgba(178,58,58,.9)}
    .disclaimer .legal-sep{opacity:.5}

    .progress{height:6px;background:var(--border);border-radius:3px;margin:16px 0;overflow:hidden}
    .progress-bar{height:100%;background:linear-gradient(90deg,var(--skin-accent),var(--gold-500));border-radius:3px;transition:width .5s var(--ease)}
    .trend-ji{border-left:3px solid var(--skin-accent)}
    .trend-xiong{border-left:3px solid var(--cinnabar)}
    .trend-ping{border-left:3px solid var(--ink-400)}

    .flex-row{display:flex;gap:8px}
    .flex-row > *{flex:1}

    /* 开关 / 提示 / 修正输入 / 失败态 / 登出 / 双列 */
    .switch-row{display:flex;align-items:center;gap:10px;margin:10px 0}
    .switch{position:relative;width:44px;height:24px;flex:none}
    .switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:999px;transition:.2s}
    .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
    .switch input:checked + .slider{background:var(--skin-accent)}
    .switch input:checked + .slider:before{transform:translateX(20px)}
    .coord-hint{font-size:11px;color:var(--skin-accent);margin:2px 0 0}
    .note-input{width:100%;min-height:64px;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-top:8px;resize:vertical;font-family:inherit}
    .failed-box{text-align:center}
    .failed-box .error{margin-bottom:12px;text-align:left}
    .logout-bar{display:flex;justify-content:flex-end;gap:16px;margin-top:8px}
    .logout-link{font-size:12px;color:var(--text-3);cursor:pointer;background:none;border:none;padding:4px}
    .field-row{display:flex;gap:8px}
    .field-row > div{flex:1}
    .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
    .kv:last-child{border-bottom:none}
    .kv .k{color:var(--text-2)}
    .kv .v{color:var(--text-1);font-weight:600}
    .section-title{font-size:15px;color:var(--ink-700);margin:4px 0 8px;font-weight:600}

    /* 断前尘星象轨道动画（C1） */
    .dqc-stage{margin:8px auto 0;max-width:520px;padding:32px 20px 28px;border-radius:var(--radius-lg);
      background:radial-gradient(120% 90% at 50% 25%, #232C49 0%, var(--ink-900) 80%);box-shadow:var(--shadow-card)}
    .dqc-plate{width:240px;height:240px;margin:0 auto;display:block}
    .dqc-rings{transform-box:fill-box;transform-origin:center;animation:spin 70s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .gold{fill:var(--gold-500)}
    .gold-stroke{stroke:var(--gold-500)}
    .ring-stroke{stroke:#3A4470}
    .s-pending{fill:var(--ink-700);opacity:.55}
    .s-active{fill:var(--gold-500);animation:pulse 1.2s ease-in-out infinite}
    .s-done{fill:var(--gold-300)}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    .dqc-progress{text-align:center;margin-top:16px;font-family:var(--font-serif);font-size:20px;color:var(--gold-300);letter-spacing:.05em}
    .dqc-method{text-align:center;margin-top:6px;font-size:14px;color:#C9C6DA}
    .dqc-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.12);margin:14px auto 0;max-width:360px;overflow:hidden}
    .dqc-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-600),var(--gold-300));transition:width .5s var(--ease)}
    .dqc-status{text-align:center;margin-top:10px;font-size:12px;color:#8E8AA6;font-family:var(--font-latin-serif);letter-spacing:.04em}
    .dqc-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px auto 0;max-width:420px}
    .dqc-list span{font-size:12px;padding:4px 10px;border-radius:var(--radius-pill);background:rgba(255,255,255,.06);color:#9FA3BC}
    .dqc-list span.done{background:var(--skin-accent-soft);color:#fff}
    .dqc-list span.active{background:var(--gold-600);color:#fff}

    /* 轻提示 */
    .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);background:var(--ink-900);color:#fff;
      padding:10px 18px;border-radius:var(--radius-pill);font-size:13px;opacity:0;pointer-events:none;transition:.25s var(--ease);z-index:40}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* 骨架屏（shimmer 加载占位） */
    .skeleton{position:relative;overflow:hidden;background:var(--border);border-radius:6px}
    .skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shimmer 1.3s infinite}
    @keyframes shimmer{100%{transform:translateX(100%)}}
    .sk-line{height:12px;margin:10px 0}
    .sk-title{height:22px;width:55%;margin:6px 0 16px}
    .sk-card{background:var(--surface);border-radius:var(--radius-lg);padding:22px;margin:12px 0;box-shadow:var(--shadow-card);border:1px solid rgba(26,33,56,.04);overflow:hidden}

    /* 页面切换过渡（key=page 重挂载触发） */
    .view-enter{animation:viewEnter .34s var(--ease) both}
    @keyframes viewEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    /* 图标 / 卡片 hover 微交互 */
    .icon{display:inline-flex;vertical-align:middle}
    .card{transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
    .card:hover{box-shadow:0 6px 22px rgba(26,33,56,.14)}
    .btn-primary:hover{box-shadow:0 6px 20px rgba(26,33,56,.26)}

    /* 解读页「历史追问 / 矫正」列表 */
    .hist-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .hist-item{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
      background:var(--paper);font-size:13px;color:var(--text-1);line-height:1.55;cursor:pointer;word-break:break-word;
      transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
    .hist-item:hover{border-color:var(--skin-accent);background:#f0ece0}

    /* ===== 完整盘面（八字/紫微/占星/七政/奇门/五运六气） ===== */
    .chart-view{margin-top:14px}
    .chart-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
    .chart-tab{padding:7px 13px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-pill);font-size:13px;cursor:pointer;color:var(--text-2);transition:.18s}
    .chart-tab:hover{border-color:var(--skin-accent)}
    .chart-tab.active{background:var(--skin-accent);color:var(--skin-accent-ink);border-color:var(--skin-accent);font-weight:600}
    .sub-title{font-size:13px;font-weight:600;color:var(--skin-accent);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
    .sub-title::before{content:"";width:3px;height:13px;background:var(--skin-accent);border-radius:2px;display:inline-block}
    .daymaster{display:flex;align-items:baseline;gap:8px;margin:2px 0 4px}
    .daymaster .dm{font-size:21px;font-weight:700;color:var(--skin-accent)}
    .daymaster .dm-wx{font-size:13px;color:var(--text-2)}
    .aux-line{font-size:12px;color:var(--text-3);margin:6px 0;line-height:1.75}
    .aux-line b{color:var(--text-2);font-weight:600}

    /* 四柱表 */
    .four-pillars{display:grid;grid-template-columns:74px repeat(4,1fr);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)}
    .fp-cell{padding:9px 6px;text-align:center;font-size:13px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);min-width:0;word-break:break-word}
    .fp-cell:last-child{border-right:none}
    .fp-cell.fp-rowhead{background:#f4f0e7;font-weight:600;color:var(--text-2);text-align:left;padding-left:10px}
    .fp-cell.fp-head{background:var(--skin-accent);color:var(--skin-accent-ink);font-weight:600}
    .fp-cell.fp-day{background:var(--skin-accent-soft);font-weight:600;color:var(--skin-accent)}
    .fp-cell.fp-head.fp-day{background:var(--skin-accent);color:var(--skin-accent-ink)}

    /* 神煞标签 */
    .shensha-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
    .shensha-tag{font-size:12px;padding:3px 9px;border-radius:var(--radius-pill);border:1px solid transparent;line-height:1.4}
    .shensha-tag.green{background:rgba(62,124,107,.14);color:#2f6b5b;border-color:rgba(62,124,107,.3)}
    .shensha-tag.red{background:rgba(178,58,58,.12);color:var(--cinnabar);border-color:rgba(178,58,58,.3)}
    .shensha-tag.gold{background:rgba(191,161,90,.16);color:#9a7d34;border-color:rgba(191,161,90,.35)}

    /* 通用小表格 */
    .mini-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
    .mini-table th,.mini-table td{border:1px solid var(--border);padding:6px 8px;text-align:center}
    .mini-table th{background:#f4f0e7;color:var(--text-2);font-weight:600}
    .mini-table td{color:var(--text-1)}

    /* 流年时间轴 */
    .timeline{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-top:4px}
    .tl-item{flex:0 0 auto;width:128px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px}
    .tl-year{font-weight:700;font-size:14px;color:var(--skin-accent)}
    .tl-age{font-size:11px;color:var(--text-3);font-weight:400;margin-left:4px}
    .tl-ganzhi{font-size:13px;margin:3px 0}
    .tl-dy{display:block;font-size:11px;color:var(--text-3)}
    .tl-events{display:flex;flex-direction:column;gap:3px}
    .tl-ev{font-size:11px;color:var(--cinnabar);background:rgba(178,58,58,.07);border-radius:6px;padding:2px 5px;line-height:1.35}

    /* 紫微十二宫 */
    .ziwei-wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
    .ziwei-wheel{flex:0 0 auto;width:240px;height:240px;max-width:100%}
    .zw-ring{fill:none;stroke:var(--skin-accent);stroke-width:1.5;opacity:.5}
    .zw-ring-inner{fill:none;stroke:var(--skin-accent);stroke-width:1;opacity:.3}
    .zw-label{font-size:12px;fill:var(--text-2)}
    .zw-center{font-size:13px;font-weight:700;fill:var(--skin-accent)}
    .zw-center2{font-size:11px;fill:var(--text-3)}
    .palace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;flex:1;min-width:260px}
    .palace-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 10px;background:var(--surface)}
    .palace-card.body{border-color:var(--skin-accent);background:var(--skin-accent-soft)}
    .pc-name{font-weight:700;font-size:13px;color:var(--text-1);display:flex;align-items:center;gap:5px}
    .pc-badge{font-size:10px;background:var(--skin-accent);color:var(--skin-accent-ink);border-radius:6px;padding:1px 5px}
    .pc-stem{font-size:12px;color:var(--text-3);margin:2px 0}
    .pc-stars{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
    .pc-major{font-size:12px;background:var(--skin-accent);color:var(--skin-accent-ink);border-radius:6px;padding:1px 6px}
    .pc-stars.sm{font-size:11px;color:var(--text-2)}
    .pc-stars.adj{font-size:11px;color:var(--text-3)}
    .pc-sihua{font-size:11px;color:var(--cinnabar);margin-top:3px}

    /* 占星 / 七政 表格 */
    .planet-table,.star-table,.aspect-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
    .planet-table th,.star-table th,.aspect-table th,.planet-table td,.star-table td,.aspect-table td{border:1px solid var(--border);padding:6px 8px}
    .planet-table th,.star-table th,.aspect-table th{background:#f4f0e7;color:var(--text-2);font-weight:600;text-align:left}
    .planet-table td,.star-table td,.aspect-table td{color:var(--text-1)}
    .retro{color:var(--cinnabar);font-size:11px}

    /* 奇门九宫 */
    .qimen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:420px;margin-top:4px}
    .qimen-cell{border:1px solid var(--border);border-radius:var(--radius-md);padding:7px 8px;background:var(--surface);min-height:78px}
    .qc-name{font-weight:700;font-size:13px;color:var(--skin-accent)}
    .qc-meta{font-size:11px;color:var(--text-3)}
