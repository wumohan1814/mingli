const {
  useState,

  useRef,
  useLayoutEffect
} = React;
// ===== B1 全站 UI 文案常量（REQ-037）→ REQ-128 阶段1：全站界面文案总表 TC_COPY =====
// 文案总表已迁至独立数据文件 frontend/public/data/ui-copy.js（window.TC_COPY，key 规范见
// docs/standards/01-命名与变量约定.md §12：ui.<模块>.<动作|状态>，小写+连字符）。
// 说明：既有 190+ 处 UI_COPY.xxx 引用（各模块页/内容页）保留原名继续可用 —— 本行以兼容
// 别名指向 TC_COPY.ui（同一文案源，零改写零回归）；框架层页面（落地/登录注册/三 Hub/
// Banner/菜单/页脚/通用）已直引 TC_COPY.ui.* 规范路径。
const UI_COPY = TC_COPY.ui;
const API = '/api';
// REQ-增强：全局请求超时配置（毫秒）。可通过 api(path, { timeout: N }) 单接口覆盖；
// 设 0 或 false 禁用超时（与旧行为一致）。默认 15s 平衡用户体验与后端长任务容忍度。
const API_DEFAULT_TIMEOUT = 15000;
let token = '';
let refreshToken = '';
// BUG-002: 需登录才能访问的页面白名单（landing/auth/guoxue-hub/xishi-hub 保持公开）
const AUTH_REQUIRED_PAGES = ['cases','onboarding','waiting','calibration','predict','revise','topic','archive','credits','zodiac','divination','tarot','lenormand','astrology','mbti','nine-pick','agent','guoxue-tools'];
// 未登录访问受限页时记录的回跳目标 {p, p2}；登录/注册成功后优先回跳
let authRedirect = null;
let onUnauthorized = null;
// ===== REQ-066：功能设置（前端全局设置核心） =====
// 后端契约：GET /api/settings（需 Bearer）→ {code:0,data:{settings:{anim_enabled,default_mode,
// banner_dropdown,share_taichu_ui,bg_enabled,card_images,agent_enabled}}}；PUT 部分字段 → 全量 settings。
// 前端默认值见 SETTINGS_DEFAULTS；未登录或接口失败一律用前端默认值（登录后由 App 拉取覆盖）。
// 运行期镜像 TC_SETTINGS 供各页面/钩子读取（模块级对象原地 Object.assign，页挂载即读到最新值），
// 另暴露 camelCase 只读钩子（animEnabled / defaultMode / bannerDropdown / shareTaichuUi /
// bgEnabled / cardImages / agentEnabled），供 REQ-061 动效、REQ-076 Agent 后续接入。
const SETTINGS_DEFAULTS = {
  anim_enabled: true,
  default_mode: 'auto', // 'auto'=默认项目起卦/抽卡（现状）| 'manual'=默认手动快速填写 | 'both'=两入口并行不设默认
  banner_dropdown: false,
  share_taichu_ui: true,
  bg_enabled: true,
  card_images: true,
  agent_enabled: true
};
const SETTINGS_KEYS = Object.keys(SETTINGS_DEFAULTS);
const TC_SETTINGS = Object.assign({}, SETTINGS_DEFAULTS);
(function installTcAliases() {
  const map = {
    anim_enabled: 'animEnabled',
    default_mode: 'defaultMode',
    banner_dropdown: 'bannerDropdown',
    share_taichu_ui: 'shareTaichuUi',
    bg_enabled: 'bgEnabled',
    card_images: 'cardImages',
    agent_enabled: 'agentEnabled'
  };
  Object.keys(map).forEach(function (k) {
    Object.defineProperty(TC_SETTINGS, map[k], {
      enumerable: false,
      configurable: true,
      get: function () { return TC_SETTINGS[k]; }
    });
  });
})();
// 服务端原始值 → 前端规范化设置对象（未知/缺失字段回退默认值；default_mode 白名单校验）
function normalizeTcSettings(raw) {
  const out = Object.assign({}, SETTINGS_DEFAULTS);
  if (raw && typeof raw === 'object') {
    SETTINGS_KEYS.forEach(function (k) {
      const v = raw[k];
      if (k === 'default_mode') {
        if (v === 'auto' || v === 'manual' || v === 'both') out[k] = v;
      } else if (typeof v === 'boolean') {
        out[k] = v;
      }
    });
  }
  return out;
}
function shallowEqTc(a, b) {
  for (let i = 0; i < SETTINGS_KEYS.length; i++) {
    if (a[SETTINGS_KEYS[i]] !== b[SETTINGS_KEYS[i]]) return false;
  }
  return true;
}
// ② 默认模式助手：manual=默认停在手动录入入口；auto=自动起卦/抽卡（现状）；
// both=两入口并行、不强行设默认 → 每次打开保留上次所选（返回 keepCurrent 原值）。
function tcAskNextDefault(keepCurrent) {
  const dm = TC_SETTINGS.default_mode;
  if (dm === 'manual') return 'manual';
  if (dm === 'both') return keepCurrent;
  return 'auto';
}
// BUG-011：MBTI 分享落地页（/mbti/share 或 /mbti/share/{token}）是公开免登录入口，
// 访客会话必须与分享者隔离：分享页期间全局 token/refreshToken 一律置空（绝不写回
// localStorage），使任何 api() 请求都不携带分享者 Authorization；离开分享页时若有
// 本地 token（同浏览器本人）再恢复正常会话。
function isMbtiSharePath(p) {
  p = String(p || '');
  return /^\/mbti\/share\/?$/.test(p) || /^\/mbti\/share\//.test(p);
}
function switchShareGuestSession(entering) {
  if (entering) {
    // 进入分享落地页：置空内存会话（访客态标记即「空 token」，不触碰 localStorage）
    token = '';
    refreshToken = '';
    return;
  }
  // 离开分享落地页：若内存仍为空且有本地 token（同浏览器本人），恢复正常会话；
  // 无本地 token 的访客维持未登录，受限操作由 BUG-002 拦截引导去登录页。
  if (token) return;
  let saved = null;
  try {
    saved = localStorage.getItem('taichu_token');
  } catch (e) {
    saved = null;
  }
  if (saved) {
    token = saved;
    try {
      refreshToken = localStorage.getItem('taichu_refresh_token') || '';
    } catch (e) {
      refreshToken = '';
    }
  }
}
// REQ-070：档案「分享帮填」落地页（/case/share/{token}）与 MBTI 分享同属公开免登录入口，
// 会话隔离同口径：进入时内存 token 置空（访客态）、离开时按 switchShareGuestSession 恢复。
function isCaseSharePath(p) {
  p = String(p || '');
  return /^\/case\/share\/?$/.test(p) || /^\/case\/share\//.test(p);
}
// 分享落地页页名（mbti-share / case-share）判定：App 内页切换/前进后退跨越分享页时统一切换访客会话
function isGuestSharePageName(p) {
  return p === 'mbti-share' || p === 'case-share';
}
// ===== REQ-092：新用户建档强制门禁（登录账号 0 档案 → 强制先新建档案） =====
// 触发条件（一律以 GET /cases 实时校验为准）：新注册 / 删光全部 / 无档案存量账号 = 0 档即强制；
// ≥1 档案 → 放行。强制期全部功能入口（含 landing、各 HUB、功能设置、太初先生等不依赖档案的
// 功能也一并拦截）重定向到新建档案 onboarding；仅放行 onboarding/auth 与分享帮填访客页
// （/case/share、/mbti/share 未登录访客不受门禁影响）。
// 状态机：null=本会话未决（未登录 / 尚未校验），true=0 档强制中，false=≥1 档放行。
// 关键点重校验：登录/注册成功（AuthPage）、启动带 token（App 首挂载 effect）、删光档案
// （CasesPage）；建档成功 ≥1 档即置 false 解锁（OnboardingPage）。校验失败不误锁（按放行处理）。
// 未完成建档关闭页面/退出登录：下次启动/登录仍会因 0 档被重新强制回到新建档案，无需额外持久化。
let forceOnboarding = null;

// REQ-092 校验器：GET /cases 判档案数 → 更新 forceOnboarding；false→true 转换时补埋点一次
// （事件名沿用全局 snake_case 风格：force_onboarding）。未登录直接复位不校验。
async function checkCaseGate() {
  if (!token) {
    forceOnboarding = null;
    return;
  }
  let list = null;
  try {
    const res = await api('/cases', {
      method: 'GET'
    });
    list = res && res.data && res.data.cases || (res && res.cases) || [];
  } catch (e) {
    // 拉取失败 / 会话过期（api() 401 已清 token 并跳登录页）：不误锁 —— 仍登录按放行，否则复位
    forceOnboarding = token ? false : null;
    return;
  }
  const hasCase = Array.isArray(list) && list.length >= 1;
  if (hasCase) {
    forceOnboarding = false;
    return;
  }
  if (forceOnboarding !== true) {
    // 0 档 → 进入强制建档门禁（仅 false→true 转换打一次埋点，避免重复触发重复上报）
    forceOnboarding = true;
    track('force_onboarding', {
      cases: 0
    });
  }
}
// 余额不足弹窗处理器：由 App 注册（setCreditInsuffHandler），api() 在拦截到 5002 时调用
let creditInsuffHandler = null;
function setCreditInsuffHandler(fn) {
  creditInsuffHandler = fn;
}
// REQ-072：配对解析弹窗处理器 —— PairModal 在 App 根部渲染（跨三大模块复用），
// 模块页/入口经 openPairAnalyze({module}) 打开（App 经 useEffect 注册 setPairAnalyzeOpener）。
let pairAnalyzeOpener = null;
function setPairAnalyzeOpener(fn) {
  pairAnalyzeOpener = fn;
}
function openPairAnalyze(opts) {
  if (pairAnalyzeOpener) pairAnalyzeOpener(opts || {});
}
// 充值链接：严禁前端硬编码；由后端/部署时注入 window.TAICHU_RECHARGE_URL。
// 未注入时回退占位，保证按钮可点击不报错（待后端下发真实小鹅通链接）。
const RECHARGE_FALLBACK = '/recharge';
function getRechargeUrl() {
  return typeof window !== 'undefined' && window.TAICHU_RECHARGE_URL || RECHARGE_FALLBACK;
}

// —— 充值（金数据表单）+ 到账轮询 ——
// 后端 POST /api/credits/charge-code（需 JWT）→ {code:0, data:{code,url}}，url 即金数据充值表单；
// GET /api/credits/balance → {code:0, data:{balance,...}}，用于轮询到账（到账并非实时，通常 1–5 分钟）。
const RECHARGE_POLL_MS = 4000; // 每 4 秒查一次余额（3–5 秒区间）
const RECHARGE_MAX_WAIT_MS = 10 * 60 * 1000; // 等待上限：10 分钟
const RECHARGE_PENDING_KEY = 'taichu_pending_recharge';
let rechargePollTimer = null;
let rechargePollStartAt = 0;
let rechargePreBalance = null;

// 读当前余额（兼容双信封：data.balance 或顶层 balance）
async function fetchCreditBalance() {
  const r = await api('/credits/balance');
  const b = r && r.data && r.data.balance != null ? r.data.balance : r ? r.balance : null;
  return b == null ? null : Number(b);
}

// 结束到账轮询并清掉「待确认充值」标记
function stopRechargePoll() {
  if (rechargePollTimer) {
    clearInterval(rechargePollTimer);
    rechargePollTimer = null;
  }
  try {
    sessionStorage.removeItem(RECHARGE_PENDING_KEY);
  } catch (e) {/* 忽略 */}
}

// 到账轮询：每 4 秒 GET /api/credits/balance；余额 > 充值前 → 到账提示；超过 10 分钟 → 放弃提示
function startRechargePoll(preBalance, startAt) {
  stopRechargePoll();
  rechargePreBalance = preBalance == null ? null : Number(preBalance);
  rechargePollStartAt = startAt || Date.now();
  const tick = async () => {
    if (Date.now() - rechargePollStartAt > RECHARGE_MAX_WAIT_MS) {
      stopRechargePoll();
      toast(TC_COPY.ui.balance['recharge-processing']);
      return;
    }
    if (rechargePreBalance == null) return; // 未能取得充值前余额则只计时、不做增减判断
    try {
      const b = await fetchCreditBalance();
      if (b != null && b > rechargePreBalance) {
        stopRechargePoll();
        toast(TC_COPY.ui.balance['recharge-ok']);
      }
    } catch (e) {/* 单次查询失败静默，下轮重试 */}
  };
  tick();
  rechargePollTimer = setInterval(tick, RECHARGE_POLL_MS);
}

// 金数据表单整页跳转、用户返回本页（刷新/重开）后，凭 sessionStorage 标记续查到账
function resumePendingRechargePoll() {
  let marker = null;
  try {
    marker = JSON.parse(sessionStorage.getItem(RECHARGE_PENDING_KEY) || 'null');
  } catch (e) {/* 忽略 */}
  if (!marker) return;
  if (marker.at && Date.now() - marker.at > RECHARGE_MAX_WAIT_MS) {
    stopRechargePoll();
    toast(TC_COPY.ui.balance['recharge-processing']);
    return;
  }
  if (marker.pre != null) startRechargePoll(marker.pre, marker.at);
}

// 充值入口统一动作：POST /api/credits/charge-code 取 code+url → 记录充值前余额 → 打开金数据表单 → 轮询到账
async function startRecharge() {
  // 1) 记录充值前余额（失败不阻断充值流程）
  let preBalance = null;
  try {
    preBalance = await fetchCreditBalance();
  } catch (e) {/* 忽略 */}
  // 2) 向后端换取本次充值 code 与金数据表单 url（双信封：code:0 时 data 内取值）
  let payload = null;
  try {
    const res = await api('/credits/charge-code', {
      method: 'POST'
    });
    payload = res && res.data || res || {};
  } catch (e) {
    toast(e && e.message ? e.message : TC_COPY.ui.balance['recharge-unavailable']);
    return; // 失败态：仅提示，保持当前页面
  }
  const code = payload && payload.code != null ? payload.code : '';
  const url = payload && payload.url ? payload.url : '';
  if (!url) {
    toast(TC_COPY.ui.balance['recharge-no-link']);
    return;
  }
  // 3) 埋点
  track('credit_recharge_start', {
    code: String(code)
  });
  // 4) 记录「待确认充值」（sessionStorage：整页跳转后返回时据此续查，且 10 分钟窗口跨跳转保留）
  try {
    sessionStorage.setItem(RECHARGE_PENDING_KEY, JSON.stringify({
      pre: preBalance,
      at: Date.now()
    }));
  } catch (e) {/* 忽略 */}
  // 5) 优先新标签打开表单（本页存活可持续轮询）；被拦截则同标签跳转，返回后由续查接管
  const win = window.open(url, '_blank');
  if (win) {
    try {
      win.opener = null;
    } catch (e) {/* 忽略 */}
    startRechargePoll(preBalance, Date.now());
  } else {
    window.location.href = url;
  }
}

const DQC_METHODS = ['八字', '紫微斗数', '六爻', '奇门遁甲', '大六壬', '太乙神数', '七政四余', '铁板神数', '果老星宗'];

// ---- 埋点（批量防抖，异步不阻塞，失败静默）----
let _trackQueue = [];
let _trackTimer = null;
function _sessionId() {
  let s = localStorage.getItem('taichu_session_id');
  if (!s) {
    s = window.crypto && crypto.randomUUID ? crypto.randomUUID() : 's' + Date.now();
    localStorage.setItem('taichu_session_id', s);
  }
  return s;
}
function _flushTrack() {
  if (!_trackQueue.length) return;
  const batch = _trackQueue.splice(0, _trackQueue.length);
  const payload = JSON.stringify({
    events: batch.map(e => ({
      event_name: e.n,
      props: e.p,
      session_id: _sessionId()
    }))
  });
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(API + '/events', new Blob([payload], {
        type: 'application/json'
      }));
    } else {
      fetch(API + '/events', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: payload,
        keepalive: true
      }).catch(() => {});
    }
  } catch (e) {/* 埋点失败静默 */}
}
function track(name, props) {
  _trackQueue.push({
    n: name,
    p: props || {}
  });
  if (_trackQueue.length >= 10) {
    clearTimeout(_trackTimer);
    _trackTimer = null;
    _flushTrack();
  } else if (!_trackTimer) {
    _trackTimer = setTimeout(() => {
      _trackTimer = null;
      _flushTrack();
    }, 2000);
  }
}

  '火天大有': {

    yaoCi: [

    yaoCi: [

    yaoCi: [

      { name: '九四', original: '隨有獲，貞凶。有孚在道，以明，何咎？', baihua: '四爻阳位：随而有获、守正防凶；有信在道、明则无咎。' },

  '山火贲': {

    yaoCi: [

  '山天大畜': {

    yaoCi: [

      { name: '九二', original: '枯楊生稊，老夫得其女妻，無不利。', baihua: '二爻阳位：枯杨生稊、老夫得女妻，无不利，枯木逢春。' },

      { name: '九五', original: '枯楊生華，老婦得其士夫，無咎無譽。', baihua: '五爻阳位：枯杨生华、老妇得士夫，无咎无誉，虚华。' },

  '坎为水': {

    yaoCi: [

  '离为火': {
    number: 30,
    short: '离',
    guaCi: { original: '離，利貞，亨。畜牝牛吉。', baihua: '离卦，利贞亨，畜牝牛吉。光明依附。' },

    yaoCi: [

    ]
  },
  '泽山咸': {
    number: 31,

    ]

  '雷风恒': {
    number: 32,
    short: '恒',

    yaoCi: [
      { name: '初六', original: '遯尾，厲，勿用有攸往。', baihua: '初爻阴位：遁尾、危，勿用有攸往，退已晚。' },

    ]

  '风火家人': {

    ]
  },

  '水山蹇': {
    number: 39,
    short: '蹇',

      { name: '六四', original: '往蹇來連。', baihua: '四爻阴位：往蹇来连，退而相连。' },
      { name: '九五', original: '大蹇朋來。', baihua: '五爻阳位：大蹇朋来，困极得助。' },
      { name: '上六', original: '往蹇來碩，吉。利見大人。', baihua: '上爻阴位：往蹇来硕、吉，利见大人，终得转机。' },
    ]
  },
  '雷水解': {
    number: 40,
    short: '解',
    guaCi: { original: '解，利西南。無所往，其來復吉。有攸往，夙吉。', baihua: '解卦，利西南。无所往则来复吉，有攸往夙吉。险难化解。' },

    yaoCi: [
      { name: '初六', original: '無咎。', baihua: '初爻阴位：无咎，初解无忧。' },
      { name: '九二', original: '田獲三狐，得黃矢，貞吉。', baihua: '二爻阳位：田获三狐、得黄矢，守正吉，去邪得直。' },
      { name: '六三', original: '負且乘，致寇至，貞吝。', baihua: '三爻阴位：负且乘、致寇至，守正吝，露财招盗。' },
      { name: '九四', original: '解而拇，朋至斯孚。', baihua: '四爻阳位：解其拇、朋至斯孚，释小碍得友。' },
      { name: '六五', original: '君子維有解，吉。有孚于小人。', baihua: '五爻阴位：君子维有解、吉，有孚于小人，化敌。' },
      { name: '上六', original: '公用射隼于高墉之上，獲之，無不利。', baihua: '上爻阳位：公用射隼于高墉、获之无不利，除害。' },
    ]
  },
  '山泽损': {
    number: 41,
    short: '损',
    guaCi: { original: '損，有孚，元吉，無咎，可貞，利有攸往。曷之用二簋，可用享。', baihua: '损卦，有孚、元吉无咎、可贞，利有攸往。二簋可用享，减省。' },
    xiangCi: { original: '山下有澤，損。君子以懲忿窒欲。', baihua: '山下有泽、损，君子惩忿窒欲。' },
    yaoCi: [
      { name: '初九', original: '已事遄往，無咎，酌損之。', baihua: '初爻阳位：已事遄往无咎，酌损之，速行小损。' },
      { name: '九二', original: '利貞，征凶，弗損益之。', baihua: '二爻阳位：利贞、征凶，弗损益之，不损反益。' },
      { name: '六三', original: '三人行，則損一人。一人行，則得其友。', baihua: '三爻阴位：三人行则损一人，一人行则得其友，损益相得。' },
      { name: '六四', original: '損其疾，使遄有喜，無咎。', baihua: '四爻阴位：损其疾、使遄有喜无咎，去病。' },
      { name: '六五', original: '或益之，十朋之龜弗克違，元吉。', baihua: '五爻阴位：或益之十朋之龟弗克违，元吉，受大益。' },
      { name: '上九', original: '弗損，益之，無咎，貞吉，利有攸往。得臣無家。', baihua: '上爻阳位：弗损益之、无咎贞吉，利有攸往，得臣无家，不损而益。' },
    ]
  },
  '风雷益': {
    number: 42,
    short: '益',
    guaCi: { original: '益，利有攸往，利涉大川。', baihua: '益卦，利有攸往、利涉大川。增益成长。' },
    xiangCi: { original: '風雷，益。君子以見善則遷，有過則改。', baihua: '风雷、益，君子见善则迁、有过则改。' },
    yaoCi: [
      { name: '初九', original: '利用為大作，元吉，無咎。', baihua: '初爻阳位：利用为大作、元吉无咎，乘时而兴。' },
      { name: '六二', original: '或益之，十朋之龜弗克違，永貞吉。王用享于帝，吉。', baihua: '二爻阴位：或益之十朋之龟弗克违，永贞吉；王享于帝吉，受大益。' },
      { name: '六三', original: '益之用凶事，無咎。有孚中行，告公用圭。', baihua: '三爻阴位：益用于凶事无咎，有孚中行、告公用圭，因危得益。' },
      { name: '六四', original: '中行，告公從，利用為依遷國。', baihua: '四爻阴位：中行告公从、利用为依迁国，中道得人。' },
      { name: '九五', original: '有孚惠心，勿問元吉。有孚惠我德。', baihua: '五爻阳位：有孚惠心、勿问元吉，有孚惠我德，施惠得报。' },
      { name: '上九', original: '莫益之，或擊之，立心勿恆，凶。', baihua: '上爻阳位：莫益之、或击之，立心勿恒凶，贪益招损。' },
    ]
  },
  '泽天夬': {
    number: 43,
    short: '夬',
    guaCi: { original: '夬，揚于王庭，孚號，有厲，告自邑，不利即戎，利有攸往。', baihua: '夬卦，扬于王庭、孚号有厉，告自邑、不利即戎，利有攸往。决而能和。' },
    xiangCi: { original: '澤上于天，夬。君子以施祿及下，居德則忌。', baihua: '泽上于天、夬，君子施禄及下、居德则忌。' },
    yaoCi: [
      { name: '初九', original: '壯于前趾，往不勝為吝。', baihua: '初爻阳位：壮于前趾、往不胜为吝，轻进难成。' },
      { name: '九二', original: '惕號，莫夜有戎，勿恤。', baihua: '二爻阳位：惕号、莫夜有戎勿恤，警备无忧。' },

      { name: '九四', original: '臀無膚，其行次且。牽羊悔亡，聞言不信。', baihua: '四爻阳位：臀无肤、其行次且，牵羊悔亡，闻言不信，行滞。' },
      { name: '九五', original: '莧陸夬夬中行，無咎。', baihua: '五爻阳位：苋陆夬夬中行、无咎，果断中道。' },
      { name: '上六', original: '無號，終有凶。', baihua: '上爻阴位：无号、终有凶，失警则危。' },
    ]
  },
  '天风姤': {
    number: 44,
    short: '姤',
    guaCi: { original: '姤，女壯，勿用取女。', baihua: '姤卦，女壮，勿用取女。不期而遇。' },
    xiangCi: { original: '天下有風，姤。后以施命誥四方。', baihua: '天下有风、姤，后施命诰四方。' },
    yaoCi: [
      { name: '初六', original: '系于金柅，貞吉，有攸往，見凶，羸豕踟躅。', baihua: '初爻阴位：系于金柅、守正吉；有攸往见凶，羸豕踟躅，微动宜制。' },
      { name: '九二', original: '包有魚，無咎，不利賓。', baihua: '二爻阳位：包有鱼、无咎，不利宾，近者得之。' },
      { name: '九三', original: '臀無膚，其行次且，厲，無大咎。', baihua: '三爻阳位：臀无肤、其行次且，厉无大咎，行滞。' },
      { name: '九四', original: '包無魚，起凶。', baihua: '四爻阳位：包无鱼、起凶，失所据。' },
      { name: '九五', original: '以杞包瓜，含章，有隕自天。', baihua: '五爻阳位：以杞包瓜、含章，有陨自天，含蓄待时。' },
      { name: '上九', original: '姤其角，吝，無咎。', baihua: '上爻阳位：姤其角、吝无咎，遇于角无争。' },
    ]
  },
  '泽地萃': {
    number: 45,
    short: '萃',
    guaCi: { original: '萃，亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。', baihua: '萃卦，亨。王假有庙，利见大人，亨，利贞，用大牲吉，利有攸往。荟萃聚集。' },
    xiangCi: { original: '澤上於地，萃。君子以除戎器，戒不虞。', baihua: '泽上于地、萃，君子除戎器、戒不虞。' },
    yaoCi: [
      { name: '初六', original: '有孚不終，乃亂乃萃，若號，一握為笑，勿恤，往無咎。', baihua: '初爻阴位：有孚不终、乃乱乃萃，若号一握为笑，勿恤往无咎，诚乱复聚。' },
      { name: '六二', original: '引吉，無咎，孚乃利用禴。', baihua: '二爻阴位：引吉无咎，孚乃利用禴，牵引相聚。' },
      { name: '六三', original: '萃如，嗟如，無攸利，往無咎，小吝。', baihua: '三爻阴位：萃如嗟如、无所利，往无咎小吝，孤而不聚。' },
      { name: '九四', original: '大吉，無咎。', baihua: '四爻阳位：大吉无咎，聚得其位。' },
      { name: '九五', original: '萃有位，無咎。匪孚，元永貞，悔亡。', baihua: '五爻阴位：萃有位、无咎，匪孚、元永贞悔亡，居位聚人。' },
      { name: '上六', original: '齎咨涕洟，無咎。', baihua: '上爻阴位：齎咨涕洟、无咎，忧聚而通。' },
    ]
  },
  '地风升': {
    number: 46,
    short: '升',
    guaCi: { original: '升，元亨，用見大人，勿恤。南征吉。', baihua: '升卦，元亨，用见大人勿恤，南征吉。循序上升。' },
    xiangCi: { original: '地中生木，升。君子以順德，積小以高大。', baihua: '地中生木、升，君子顺德、积小以高大。' },

      { name: '初六', original: '允升，大吉。', baihua: '初爻阴位：允升、大吉，信而上升。' },
      { name: '九二', original: '孚乃利用禴，無咎。', baihua: '二爻阳位：孚乃利用禴、无咎，诚而上升。' },
      { name: '九三', original: '升虛邑。', baihua: '三爻阳位：升虚邑，无阻而升。' },
      { name: '六四', original: '王用亨于岐山，吉無咎。', baihua: '四爻阴位：王用亨于岐山、吉无咎，顺天上升。' },
      { name: '六五', original: '貞吉，升階。', baihua: '五爻阴位：守正吉、升阶，步步登高。' },
      { name: '上六', original: '冥升，利于不息之貞。', baihua: '上爻阴位：冥升、利于不息之贞，昧进不止。' },
    ]
  },
  '泽水困': {
    number: 47,
    short: '困',
    guaCi: { original: '困，亨，貞大人吉，無咎。有言不信。', baihua: '困卦，亨，守正大人吉无咎，有言不信。困顿受制。' },
    xiangCi: { original: '澤無水，困。君子以致命遂志。', baihua: '泽无水、困，君子致命遂志。' },
    yaoCi: [
      { name: '初六', original: '臀困于株木，入于幽谷，三歲不見。', baihua: '初爻阴位：臀困于株木、入幽谷，三岁不见，久困。' },
      { name: '九二', original: '困于酒食，朱紱方來，利用亨祀，征凶，無咎。', baihua: '二爻阳位：困于酒食、朱紱方来，利用亨祀，征凶无咎，困而有享。' },
      { name: '六三', original: '困于石，據于蒺藜，入于其宮，不見其妻，凶。', baihua: '三爻阴位：困于石、据于蒺藜，入宫不见其妻，凶，进退皆碍。' },
      { name: '九四', original: '來徐徐，困于金車，吝，有終。', baihua: '四爻阳位：来徐徐、困于金车，吝有终，迟助。' },
      { name: '九五', original: '劓刖，困于赤紱，乃徐有說，利用祭祀。', baihua: '五爻阳位：劓刖、困于赤紱，乃徐有说，利用祭祀，困而缓释。' },
      { name: '上六', original: '困于葛藟，于臲卼，曰動悔，有悔，征吉。', baihua: '上爻阴位：困于葛藟、于臲卼，曰动悔有悔，征吉，困极思动。' },
    ]
  },
  '水风井': {
    number: 48,
    short: '井',
    guaCi: { original: '井，改邑不改井，無喪無得。往來井井，汔至亦未繘井，羸其瓶，凶。', baihua: '井卦，改邑不改井，无丧无得，往来井井；汔至亦未繘井、羸其瓶，凶。井养不穷。' },
    xiangCi: { original: '木上有水，井。君子以勞民勸相。', baihua: '木上有水、井，君子劳民劝相。' },
    yaoCi: [
      { name: '初六', original: '井泥不食，舊井無禽。', baihua: '初爻阴位：井泥不食、旧井无禽，废弃不治。' },

      { name: '九三', original: '井渫不食，為我民惻，可用汲，王明，并受其福。', baihua: '三爻阳位：井渫不食、为我民恻，可用汲，王明并受其福，洁净待用。' },
      { name: '六四', original: '井甃，無咎。', baihua: '四爻阴位：井甃、无咎，修治其壁。' },
      { name: '九五', original: '井冽，寒泉食。', baihua: '五爻阳位：井冽、寒泉食，清美可饮。' },
      { name: '上六', original: '井收勿幕，有孚元吉。', baihua: '上爻阴位：井收勿幕、有孚元吉，功成不掩。' },
    ]
  },
  '泽火革': {
    number: 49,
    short: '革',
    guaCi: { original: '革，己日乃孚，元亨利貞，悔亡。', baihua: '革卦，己日乃孚，元亨利贞，悔亡。变革除旧。' },
    xiangCi: { original: '澤中有火，革。君子以治歷明時。', baihua: '泽中有火、革，君子治历明时。' },
    yaoCi: [
      { name: '初九', original: '鞏用黃牛之革。', baihua: '初爻阳位：巩用黄牛之革，坚守待时。' },
      { name: '六二', original: '己日乃革之，征吉，無咎。', baihua: '二爻阴位：己日乃革之、征吉无咎，当革而革。' },
      { name: '九三', original: '征凶，貞厲，革言三就，有孚。', baihua: '三爻阳位：征凶守正危，革言三就、有孚，审而后行。' },
      { name: '九四', original: '悔亡，有孚改命，吉。', baihua: '四爻阳位：悔亡、有孚改命吉，信而变革。' },
      { name: '九五', original: '大人虎變，未占有孚。', baihua: '五爻阳位：大人虎变、未占有孚，变革昭明。' },
      { name: '上六', original: '君子豹變，小人革面，征凶，居貞吉。', baihua: '上爻阴位：君子豹变、小人革面，征凶居贞吉，变而有度。' },
    ]
  },
  '火风鼎': {
    number: 50,
    short: '鼎',
    guaCi: { original: '鼎，元吉，亨。', baihua: '鼎卦，元吉亨。鼎新之象。' },
    xiangCi: { original: '木上有火，鼎。君子以正位凝命。', baihua: '木上有火、鼎，君子正位凝命。' },
    yaoCi: [
      { name: '初六', original: '鼎顛趾，利出否，得妾以其子，無咎。', baihua: '初爻阴位：鼎颠趾、利出否，得妾以其子无咎，去故。' },
      { name: '九二', original: '鼎有實，我仇有疾，不我能即，吉。', baihua: '二爻阳位：鼎有实、我仇有疾不我能即，吉，实而待时。' },
      { name: '九三', original: '鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。', baihua: '三爻阳位：鼎耳革、其行塞，雉膏不食，方雨亏悔终吉，暂滞。' },
      { name: '九四', original: '鼎折足，覆公餗，其形渥，凶。', baihua: '四爻阴位：鼎折足、覆公餗、其形渥，凶，不胜其任。' },
      { name: '六五', original: '鼎黃耳金鉉，利貞。', baihua: '五爻阴位：鼎黄耳金铉、利贞，中正可用。' },
      { name: '上九', original: '鼎玉鉉，大吉，無不利。', baihua: '上爻阳位：鼎玉铉、大吉无不利，柔节而成。' },
    ]
  },
  '震为雷': {
    number: 51,
    short: '震',
    guaCi: { original: '震，亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。', baihua: '震卦，亨。震来虩虩、笑言哑哑，震惊百里、不丧匕鬯。震动戒惧。' },
    xiangCi: { original: '洊雷，震。君子以恐懼修身。', baihua: '洊雷、震，君子恐惧修身。' },
    yaoCi: [
      { name: '初九', original: '震來虩虩，后笑言啞啞，吉。', baihua: '初爻阳位：震来虩虩、后笑言哑哑，吉，惊而定。' },
      { name: '六二', original: '震來厲，億喪貝，躋于九陵，勿逐，七日得。', baihua: '二爻阴位：震来厉、亿丧贝，跻于九陵勿逐，七日得，失而复。' },
      { name: '六三', original: '震蘇蘇，震行無眚。', baihua: '三爻阴位：震苏苏、震行无眚，惧而能行。' },

      { name: '六五', original: '震往來厲，億無喪，有事。', baihua: '五爻阴位：震往来厉、亿无丧有事，危而守业。' },
      { name: '上六', original: '震索索，視矍矍，征凶。震不于其躬，于其鄰，無咎。婚媾有言。', baihua: '上爻阴位：震索索、视矍矍，征凶；震不在躬在邻无咎，婚媾有言，惊及旁。' },
    ]
  },
  '艮为山': {
    number: 52,
    short: '艮',
    guaCi: { original: '艮，艮其背，不獲其身，行其庭，不見其人，無咎。', baihua: '艮卦，艮其背、不获其身，行其庭、不见其人，无咎。止当其止。' },

              el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => onNavigate('onboarding', {returnTo: 'mbti'})}, UI_COPY.buttons.create_case),
              el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => onNavigate('cases')}, '管理档案')),
            // REQ-109：MBTI「配对解析」入口移至底部操作区（原 REQ-082④「档案操作」与「选择档案」
            // 之间的条状入口已移除），样式对齐 REQ-108 星座入口：横跨屏幕大按键（功能标题 + 解释文字）
            el('button', {type: 'button', className: 'pair-big', style: {marginTop: 12, marginBottom: 0}, onClick: () => openPairAnalyze({module: 'mbti'})},
              el('span', {className: 'pb-title'}, el(Icon, {name: 'spark', size: 20, color: 'var(--skin-accent)'}), '配对解析', payBadge(payEnough)),
              el('span', {className: 'pb-sub'}, '选择两份已测心理测试档案，基于双方人格信息解读两人相处与协作（付费 LLM，按实际用量扣余额 ¥）'))));
      }
      body = gate;
    } else {
      const answered = Math.min(answers.length, total);
      const pct = total ? Math.round(answered / total * 100) : 0;
      body = el('div', {className: 'card'},
        el('div', {style: {display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 6, fontSize: 12, color: 'var(--text-3)', marginBottom: 2}},
          el('span', null, '第 ' + (idx + 1) + ' / ' + total + ' 题'),
          el('span', {style: {display: 'flex', gap: 10, alignItems: 'center'}},
            el('button', {style: {fontSize: 12, color: 'var(--skin-accent)', fontWeight: 600}, onClick: pickAnother}, '更换档案'),
            el('button', {style: {fontSize: 12, color: 'var(--skin-accent)', fontWeight: 600}, onClick: () => setView('grid')}, '我已知道类型，直接输入'))),
        el('div', {className: 'mbti-progress'}, el('i', {style: {width: pct + '%'}})),
        scoring ? el('div', {style: {textAlign: 'center', color: 'var(--text-2)', padding: '18px 0'}}, '判型中…') : el(React.Fragment, null,
          el('div', {style: {fontSize: 17, fontWeight: 700, color: 'var(--text-1)', lineHeight: 1.6, margin: '10px 0'}}, cur.text),
          el('div', {style: {display: 'flex', flexDirection: 'column', gap: 10}},
            (cur.options || []).map(o => el('button', {key: o.key, className: 'btn btn-outline', onClick: () => choose(o.key)}, o.key + '. ' + o.text))),
          el('div', {className: 'back-row'},
            idx > 0 ? el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => setIdx(idx - 1)}, '上一题') : null,
            el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => {
              setIdx(0);
              setAnswers([]);
              setScoreErr('');
            }}, '重新开始'))),
        scoreErr ? el('div', {className: 'card failed-box', style: {margin: '10px 0 0'}},
          el('div', {className: 'section-title'}, '判型失败'),
          el('div', {className: 'error'}, scoreErr),
          el('div', {className: 'back-row', style: {justifyContent: 'center'}},
            el('button', {className: 'btn btn-primary', style: {width: 'auto'}, onClick: () => submitScore(answers)}, '重试判型'),
            idx > 0 ? el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => setIdx(idx - 1)}, '返回上一题') : null,
            el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: reset}, '重新开始'))) : null);
    }
  }
  return el('div', {className: 'container'},
    el('div', {className: 'hub-title'}, el(Icon, {name: 'spark', size: 22}), ' 人格测试'),
    el('div', {style: {fontSize: 12, color: 'var(--text-3)', marginBottom: 4}}, '16 型人格测评 · 60 题 · 判型与文案由后端接口提供'),
    body);
}

/* ---------- REQ-070：档案「分享帮填」落地页（/case/share/{token} 免登录代建档案，归发起者） ---------- */
// 访客打开发起者分享的一次性链接：GET /api/case/share/{token}（免登录；noAuth 强制不带
// Authorization）→ 展示「为 {owner_name} 填写档案」+ 与统一建档组件（OnboardingPage）同构的表单：
// 姓名（必填，即代建档案名）+ 出生年/月/日/时辰 + 性别 + 出生地（省市区级联，选到区县自动带经纬度）
// + 真太阳时 + 选填手机号/邮箱。POST /api/case/share/{token}/submit 代建档案（一次性，成功后后端
// 原子置 used 失效），成功 toast「已提交，档案归发起者」并停在成功态（不跳发起者档案列表）。
// 访客隔离：本页为独立表单页——全程 noAuth + App 访客会话置空，不展示/不可访问发起者任何既有档案
// 数据；链接不存在/已使用/已过期（404）统一渲染「分享链接不存在或已失效」。
function CaseSharePage({
  token,
  onNavigate
}) {
  const el = React.createElement;
  const C = UI_COPY.caseShareLanding;
  const reg = typeof window !== 'undefined' && window.REGIONS || {};
  const curYear = new Date().getFullYear();
  const defaultYear = String(Math.max(1940, curYear - 35));
  const YEARS = [];
  for (let y = curYear - 18; y >= 1940; y--) YEARS.push(String(y));
  const MONTHS = [];
  for (let m = 1; m <= 12; m++) MONTHS.push(String(m));
  const DAYS = [];
  for (let d = 1; d <= 31; d++) DAYS.push(String(d));
  const HOURS = [];
  for (let h = 0; h <= 23; h++) HOURS.push(String(h));
  // BUG-009 加固：token 判空/去空白 —— 直接访问 /case/share 无 token、或 token 在路由/传参环节
  // 丢失时，立即按「缺少链接参数」渲染（见下方 !tk 分支），绝不发起 /case/share/undefined 之类请求。
  const tk = token && String(token).trim() ? String(token).trim() : '';
  const base = tk ? '/case/share/' + encodeURIComponent(tk) : null;
  // 表单默认值镜像统一建档组件：年份预置默认年，月/日留空由访客选择，时辰/性别带后端同款默认值
  const blankForm = () => ({
    name: '',
    birth_year: defaultYear,
    birth_month: '',
    birth_day: '',
    birth_hour: '0',
    gender: 'male',
    birth_province: '',
    birth_city: '',
    birth_district: '',
    longitude: '',
    latitude: '',
    true_solar_time: false,
    phone: '',
    email: ''
  });
  const [meta, setMeta] = useState(null); // GET 返回 {owner_name, fields}（仅发起者昵称，无档案数据）
  const [loading, setLoading] = useState(true);
  const [errored, setErrored] = useState('');
  const [form, setForm] = useState(blankForm);
  const [coordTouched, setCoordTouched] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false); // 提交成功 → 停在成功态，不回跳发起者档案列表
  const [err, setErr] = useState('');
  // —— 拉取落地页信息（GET /api/case/share/{token}，免登录；noAuth 强制不带 Authorization）——
  useEffect(() => {
    let alive = true;
    if (!tk) {
      setLoading(false);
      setErrored(C.invalid_no_token);
      return () => {
        alive = false;
      };
    }
    (async () => {
      setLoading(true);
      setErrored('');
      try {
        const res = await api(base, { noAuth: true });
        const d = res && res.data || res || {};
        if (!d || !d.owner_name) throw new Error(C.invalid_link);
        if (alive) setMeta({
          owner_name: d.owner_name
        });
      } catch (e) {
        // 404（不存在/已用/过期，后端不区分细节）→ 统一按「链接不存在或已失效」提示
        if (alive) setErrored(e && e.status === 404 ? C.invalid_link : (e && e.message ? e.message : C.load_fail));
      } finally {
        if (alive) setLoading(false);
      }
    })();
    return () => {
      alive = false;
    };
  }, [tk]);
  // —— 表单联动（与 OnboardingPage 建档组件同构：原生 select 点击即填；出生地级联自动带经纬度）——
  const update = k => e => setForm(Object.assign({}, form, {
    [k]: e.target.value
  }));
  const updateProvince = e => {
    const p = e.target.value;
    const cs = p && reg[p] ? Object.keys(reg[p]) : [];
    const next = Object.assign({}, form, {
      birth_province: p,
      birth_city: '',
      birth_district: ''
    });
    if (cs.length === 1) next.birth_city = cs[0]; // 直辖市等单「市/市辖区」结构：市自动带出
    if (!coordTouched) {
      next.longitude = '';
      next.latitude = '';
    }
    setForm(next);
  };
  const updateCity = e => {
    const c = e.target.value;
    const next = Object.assign({}, form, {
      birth_city: c,
      birth_district: ''
    });
    if (!coordTouched) {
      next.longitude = '';
      next.latitude = '';
    }
    setForm(next);
  };
  const updateDistrict = e => {
    const d = e.target.value;
    const next = Object.assign({}, form, {
      birth_district: d
    });
    if (!coordTouched && d) {
      const coord = reg[form.birth_province] && reg[form.birth_province][form.birth_city] && reg[form.birth_province][form.birth_city][d];
      if (coord) {
        next.longitude = String(coord[0]);
        next.latitude = String(coord[1]);
      }
    }
    setForm(next);
  };
  const updateCoord = k => e => {
    setCoordTouched(true);
    setForm(Object.assign({}, form, {
      [k]: e.target.value
    }));
  };
  const toggleSolar = e => setForm(Object.assign({}, form, {
    true_solar_time: e.target.checked
  }));
  // —— 提交代建（POST /api/case/share/{token}/submit，免登录；字段名与后端 CaseShareSubmitRequest 精确对齐）——
  const submitCase = async () => {
    if (submitting) return;
    setSubmitting(true);
    setErr('');
    const y = +form.birth_year,
      m = +form.birth_month,
      d = +form.birth_day,
      h = +form.birth_hour;
    const nameRaw = String(form.name || '').trim();
    const phoneRaw = String(form.phone || '').trim();
    const emailRaw = String(form.email || '').trim();
    // 姓名必填（strip 后非空，与后端口径一致）
    if (!nameRaw) {
      setErr(C.name_required);
      setSubmitting(false);
      return;
    }
    if (!y || y < 1900 || y > 2100) {
      setErr(C.year_err);
      setSubmitting(false);
      return;
    }
    if (!m || m < 1 || m > 12) {
      setErr(C.month_err);
      setSubmitting(false);
      return;
    }
    if (!d || d < 1 || d > 31) {
      setErr(C.day_err);
      setSubmitting(false);
      return;
    }
    if (h < 0 || h > 23 || isNaN(h)) {
      setErr(C.hour_err);
      setSubmitting(false);
      return;
    }
    // 选填联系方式格式校验（与 REQ-065 / 建档同口径）
    if (phoneRaw && !/^\d{11}$/.test(phoneRaw)) {
      toast(C.phone_err);
      setSubmitting(false);
      return;
    }
    if (emailRaw && !/^[^\s@]+@[^\s@]+$/.test(emailRaw)) {
      toast(C.email_err);
      setSubmitting(false);
      return;
    }
    const birthplace = [form.birth_province, form.birth_city, form.birth_district].filter(Boolean).join('/');
    try {
      const res = await api(base + '/submit', {
        method: 'POST',
        noAuth: true,
        body: JSON.stringify({
          name: nameRaw,
          birth_year: y,
          birth_month: m,
          birth_day: d,
          birth_hour: h,
          gender: form.gender,
          birthplace: birthplace,
          longitude: form.longitude ? +form.longitude : null,
          latitude: form.latitude ? +form.latitude : null,
          true_solar_time: !!form.true_solar_time,
          phone: phoneRaw || null,
          email: emailRaw || null
        })
      });
      const rd = res && res.data || res || {};
      if (!rd || !rd.caseId) throw new Error(C.submit_fail);
      toast(C.ok_toast); // 已提交，档案归发起者
      setDone(true); // 停在成功态（一次性链接后端已置 used，本页不再跳转发起者档案列表）
    } catch (e) {
      // 404：链接已被并发消费/过期 → 按「链接不存在或已失效」提示；其余透传后端/通用文案
      if (e && e.status === 404) toast(C.submit_link_dead); else toast(e && e.message ? e.message : C.submit_fail);
    } finally {
      setSubmitting(false);
    }
  };
  const handleSubmit = e => {
    e.preventDefault();
    submitCase();
  };
  let body;
  if (done) {
    // —— 成功态：提交后停留本页（不跳发起者档案列表）——
    body = el('div', { className: 'card', style: { textAlign: 'center', padding: '28px 18px' } },
      el('div', { className: 'section-title' }, C.ok_title),
      el('div', { style: { fontSize: 17, fontWeight: 700, color: 'var(--text-1)', margin: '10px 0 6px' } }, C.ok_toast),
      el('div', { style: { fontSize: 12.5, color: 'var(--text-3)', lineHeight: 1.7, margin: '0 0 16px' } }, C.ok_note),
      el('div', { className: 'back-row', style: { justifyContent: 'center' } },
        el('button', { className: 'btn btn-primary', style: { width: 'auto' }, onClick: () => onNavigate('landing') }, C.done_btn)));
  } else if (!tk) {
    // BUG-009 加固（渲染兜底）：token 为空/缺失 → 不等 effect、不闪 loading，直接渲染「无法打开分享」
    body = el('div', { className: 'card failed-box' },
      el('div', { className: 'section-title' }, C.invalid_title),
      el('div', { className: 'error' }, C.invalid_no_token),
      el('div', { className: 'back-row', style: { justifyContent: 'center' } },
        el('button', { className: 'btn btn-primary', style: { width: 'auto' }, onClick: () => onNavigate('landing') }, UI_COPY.buttons.back_home)));
  } else if (loading) {
    body = el('div', { className: 'card', style: { textAlign: 'center', color: 'var(--text-2)', padding: '28px 16px' } }, C.loading);
  } else if (errored) {
    // 404（不存在/已用/过期）→ 统一失败态
    body = el('div', { className: 'card failed-box' },
      el('div', { className: 'section-title' }, C.invalid_title),
      el('div', { className: 'error' }, errored),
      el('div', { className: 'back-row', style: { justifyContent: 'center' } },
        el('button', { className: 'btn btn-primary', style: { width: 'auto' }, onClick: () => onNavigate('landing') }, UI_COPY.buttons.back_home)));
  } else {
    // —— 免登录代填表单视图 ——
    const ownerName = meta && meta.owner_name ? meta.owner_name : '';
    const cityNames = form.birth_province && reg[form.birth_province] ? Object.keys(reg[form.birth_province]) : [];
    const districtNames = form.birth_province && form.birth_city && reg[form.birth_province] && reg[form.birth_province][form.birth_city] ? Object.keys(reg[form.birth_province][form.birth_city]) : [];
    body = el('div', { className: 'card' },
      el('h2', { className: 'title' }, C.fill_for.replace('{owner}', ownerName)),
      el('p', { style: { fontSize: 12.5, color: 'var(--text-2)', margin: '2px 0 12px', lineHeight: 1.7 } }, C.intro),
      err ? el('div', { className: 'error', style: { marginBottom: 12 } }, err) : null,
      el('form', { onSubmit: handleSubmit },
        el('label', { className: 'label', htmlFor: 'cs_name' }, C.name_label),
        el('input', { id: 'cs_name', className: 'input', type: 'text', maxLength: 128, value: form.name, onChange: update('name'), placeholder: C.name_ph, required: true }),
        el('label', { className: 'label', htmlFor: 'cs_year' }, C.year_label),
        el('select', { id: 'cs_year', className: 'input', value: form.birth_year, onChange: update('birth_year'), required: true },
          el('option', { value: '' }, C.select_ph),
          YEARS.map(v => el('option', { key: v, value: v }, v))),
        el('label', { className: 'label', htmlFor: 'cs_month' }, C.month_label),
        el('select', { id: 'cs_month', className: 'input', value: form.birth_month, onChange: update('birth_month'), required: true },
          el('option', { value: '' }, C.select_ph),
          MONTHS.map(v => el('option', { key: v, value: v }, v))),
        el('label', { className: 'label', htmlFor: 'cs_day' }, C.day_label),
        el('select', { id: 'cs_day', className: 'input', value: form.birth_day, onChange: update('birth_day'), required: true },
          el('option', { value: '' }, C.select_ph),
          DAYS.map(v => el('option', { key: v, value: v }, v))),
        el('label', { className: 'label', htmlFor: 'cs_hour' }, C.hour_label),
        el('select', { id: 'cs_hour', className: 'input', value: form.birth_hour, onChange: update('birth_hour') },
          HOURS.map(v => el('option', { key: v, value: v }, v))),
        el('label', { className: 'label', htmlFor: 'cs_gender' }, C.gender_label),
        el('select', { id: 'cs_gender', className: 'input', value: form.gender, onChange: update('gender') },
          el('option', { value: 'male' }, C.gender_male),
          el('option', { value: 'female' }, C.gender_female)),
        el('label', { className: 'label' }, C.birth_place_label),
        el('div', { className: 'field-row' },
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_province' }, C.province_label),
            el('select', { id: 'cs_province', className: 'input', value: form.birth_province, onChange: updateProvince },
              el('option', { value: '' }, C.select_ph),
              Object.keys(reg).map(p => el('option', { key: p, value: p }, p)))),
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_city' }, C.city_label),
            el('select', { id: 'cs_city', className: 'input', value: form.birth_city, onChange: updateCity, disabled: !form.birth_province },
              el('option', { value: '' }, C.select_ph),
              cityNames.map(c => el('option', { key: c, value: c }, c)))),
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_district' }, C.district_label),
            el('select', { id: 'cs_district', className: 'input', value: form.birth_district, onChange: updateDistrict, disabled: !form.birth_city },
              el('option', { value: '' }, C.select_ph),
              districtNames.map(x => el('option', { key: x, value: x }, x))))),
        el('div', { className: 'field-row' },
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_lng' }, C.lng_label),
            el('input', { id: 'cs_lng', className: 'input', type: 'number', step: '0.0001', value: form.longitude, onChange: updateCoord('longitude'), placeholder: C.lng_ph })),
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_lat' }, C.lat_label),
            el('input', { id: 'cs_lat', className: 'input', type: 'number', step: '0.0001', value: form.latitude, onChange: updateCoord('latitude'), placeholder: C.lat_ph }))),
        !coordTouched && form.longitude && form.latitude ? el('p', { className: 'coord-hint' }, C.coord_auto_note) : null,
        el('div', { className: 'field-row', style: { marginTop: 12 } },
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_phone' }, C.phone_label),
            el('input', { id: 'cs_phone', className: 'input', type: 'tel', inputMode: 'numeric', maxLength: 11, value: form.phone, onChange: update('phone'), placeholder: C.phone_ph })),
          el('div', null,
            el('label', { className: 'label', htmlFor: 'cs_email' }, C.email_label),
            el('input', { id: 'cs_email', className: 'input', type: 'email', value: form.email, onChange: update('email'), placeholder: C.email_ph }))),
        el('p', { style: { fontSize: 12, color: 'var(--text-3)', margin: '2px 0 0', lineHeight: 1.5 } }, C.contact_note),
        el('div', { className: 'switch-row' },
          el('label', { className: 'switch' },
            el('input', { type: 'checkbox', id: 'cs_solar', checked: form.true_solar_time, onChange: toggleSolar }),
            el('span', { className: 'slider' })),
          el('label', { htmlFor: 'cs_solar', style: { fontSize: 13, color: 'var(--text-2)' } }, C.solar_label)),
        el('div', { className: 'field-row', style: { marginTop: 14 } },
          el('button', { className: 'btn btn-primary', type: 'submit', disabled: submitting, style: { flex: '1 1 auto' } }, submitting ? C.submitting : C.submit)),
        el('p', { style: { fontSize: 11.5, color: 'var(--text-3)', margin: '12px 0 0', lineHeight: 1.7 } }, C.privacy_note),
        el('p', { style: { fontSize: 11.5, color: 'var(--text-3)', margin: '6px 0 0', lineHeight: 1.7 } }, UI_COPY.landing.disclaimer_short)));
  }
  return el('div', { className: 'container' },
    el('div', { className: 'hub-title' }, el(Icon, { name: 'spark', size: 22 }), ' ' + C.hub_title),
    body);
}

/* ---------- REQ-047：免登录分享答题页（/mbti/share/{token} 直达 · 公开免登录） ---------- */
function MbtiSharePage({
  token,
  onNavigate
}) {
  const el = React.createElement;
  // REQ-066④：分享表单太初 UI —— share_taichu_ui 开 → 答题表单内显示太初 logo、登录注册与免责提示；
  // 关 → 仅表单（填完仅保存结果；访客会话隔离与受限页拦截由 BUG-011 / BUG-002 负责）。
  const shareUiOn = TC_SETTINGS.share_taichu_ui !== false;
  const shareBrand = shareUiOn ? el('div', {className: 'tc-share-brand'},
    el('div', {className: 'tc-share-brand-head'},
      el(Icon, {name: 'spark', size: 18}),
      el('span', {className: 'tc-share-brand-name'}, UI_COPY.brand.name),
      el('span', {className: 'tc-share-brand-tag'}, UI_COPY.brand.tagline)),

  // ② 进入页面：开场白 + 历史。开场白作为第一条 assistant 消息展示；
  //    BUG-014：开场白由前端 4 候选随机 4 选 1（不再取 /agent/greeting，避免把「开发说明文件」文本当开场展示）；
  //    有历史 → 原样展示历史（开场白只在全新会话出现，不重复前置）。
  useEffect(function () {
    let alive = true;
    (async function () {
      let hist = [];
      let err = '';
      try {
        const hr = await api('/agent/messages?limit=50');
        const list = (hr && hr.data && hr.data.messages) || (hr && hr.messages) || [];
        hist = (Array.isArray(list) ? list : []).map(function (m) {
          return { role: m.role === 'user' ? 'user' : 'assistant', content: String(m.content != null ? m.content : '') };
        });
      } catch (e) {
        err = (e && e.message) || '历史消息加载失败，请重试。';
      }
      if (!alive) return;
      let msgs;
      if (hist.length) {
        // BUG-014：有历史 → 原样展示（开场白仅在全新会话随机 4 选 1 作为首条，不重复前置）
        msgs = hist;
      } else {
        msgs = [{ role: 'assistant', content: randomAgentGreeting(), greeting: true }];
      }
      setMessages(msgs);
      if (err) setLoadErr(err);
    })();
    return function () { alive = false; };
  }, []);

  // ③ 消息变化 → 滚动到底
  useEffect(function () {
    const node = chatRef.current;
    if (node) node.scrollTop = node.scrollHeight;
  }, [messages, sending]);

  const caseName = function (id) {
    const c = (caseList || []).find(function (x) { return String(x.caseId) === String(id); });
    if (!c) return '';
    const nm = (c.name && String(c.name).trim()) || '档案 ' + c.caseId;
    if (c.birthYear != null && c.birthYear !== '') return nm + '（' + String(c.birthYear) + ' 年）';
    return nm;
  };

  // ④ 发送：追加 user 气泡 + 「正在聆听…」占位 → POST chat
  //    → 用 reply 替换占位；失败（5002 余额不足已弹充值引导）移除占位并展示错误文本。
  //    REQ-113④：不提供不选档案的闲聊 —— caseId 为空（无档案）时引导先建档，不发请求。
  const handleSend = async function () {
    const text = input.trim();
    if (!text || sending) return;
    if (!caseId) {
      toast('请先建立档案，再与太初先生对话。');
      return;
    }
    setSendErr('');
    setInput('');
    const next = [{ role: 'user', content: text }];
    next.push({ role: 'assistant', content: '正在聆听…', pending: true });
    setMessages(function (prev) { return (prev || []).concat(next); });
    setSending(true);
    try {
      const r = await api('/agent/chat', {
        method: 'POST',
        body: JSON.stringify({ message: text, case_id: Number(caseId) })
      });
      const reply = (r && r.data && r.data.reply) ? String(r.data.reply) : '';
      setMessages(function (prev) {
        const arr = prev.slice();
        for (let i = arr.length - 1; i >= 0; i--) {
          if (arr[i].pending) {
            arr[i] = { role: 'assistant', content: reply };
            break;
          }
        }
        return arr;
      });
    } catch (e) {
      setSendErr((e && e.message) || '先生暂时没有回应，请稍后重试。');
      setMessages(function (prev) { return (prev || []).filter(function (m) { return !m.pending; }); });
    } finally {
      setSending(false);
    }
  };
  const onInputKey = function (e) {
    if (e.key === 'Enter' && !(e.nativeEvent && e.nativeEvent.isComposing)) {
      e.preventDefault();
      handleSend();
    }
  };

  const selName = caseId ? caseName(caseId) : '';
  // REQ-113④：下拉切换档案 —— 目标即默认档案直接选中；目标为非默认档案时弹确认窗口
  // （「设为默认档案」重新定义默认 / 「仅临时使用」），确认前不改变当前选择。
  const onPickCase = function (id) {
    setSendErr('');
    if (!id || String(id) === String(caseId)) return;
    const target = (caseList || []).find(function (c) { return String(c.caseId) === String(id); });
    if (!target) return;
    const def = (caseList || []).find(function (c) { return c && c.isDefault; });
    if (def && String(def.caseId) === String(id)) {
      setCaseId(id);
      return;
    }
    const nm = (target.name && String(target.name).trim()) || '档案 ' + target.caseId;
    setSwitchTarget({ id: String(target.caseId), name: nm });
  };
  const confirmSwitchAsDefault = async function () {
    if (!switchTarget || switchBusy) return;
    setSwitchBusy(true);
    try {
      const res = await api('/cases/' + switchTarget.id, {
        method: 'PATCH',
        body: JSON.stringify({ set_default: true })
      });
      if (res && res.code != null && res.code !== 0) throw new Error(res && res.message || '设置失败');
      setCaseId(switchTarget.id);
      setCaseList(function (prev) {
        return (prev || []).map(function (c) {
          return Object.assign({}, c, { isDefault: String(c.caseId) === switchTarget.id });
        });
      });
      setSwitchTarget(null);
      toast('已将该档案设为默认');
    } catch (e) {
      toast((e && e.message) || '设置默认档案失败，请重试。');
    } finally {
      setSwitchBusy(false);
    }
  };
  const confirmSwitchTemporary = function () {
    if (!switchTarget) return;
    setCaseId(switchTarget.id);
    setSwitchTarget(null);
    toast('已临时切换档案（不改变默认设置）');
  };
  // 档案下拉：无档案时不提供「暂不选（闲聊）」选项（REQ-113④：不提供无档案闲聊）
  const pick = el('div', { className: 'agent-pick' },
    el('select', {
      value: caseId,
      onChange: function (e) { onPickCase(e.target.value); },
      disabled: sending || caseList === null || !(caseList && caseList.length),
      'aria-label': '选择档案（仅本人档案）'
    },
    caseList && caseList.length ? caseList.map(function (c) {
      const id = String(c.caseId);
      const nm = (c.name && String(c.name).trim()) || '档案 ' + c.caseId;
      const label = c.birthYear != null && c.birthYear !== '' ? nm + '（' + String(c.birthYear) + ' 年）' : nm;
      return el('option', { key: id, value: id }, label);
    }) : el('option', { value: '' }, '暂无档案')),
    caseList === null ? el('div', { className: 'agent-pick-hint' }, '档案加载中…')
      : caseList && caseList.length ? null
      : el('div', { className: 'agent-pick-hint' }, '暂无档案，请先建立一份'));

  // 计费提示（可点击跳转余额明细，复用既有 credits 入口）
  const bill = el('div', { className: 'agent-bill' },
    el('span', null, '每轮对话按实际用量扣余额（¥）'),
    el('span', { className: 'bill-link', onClick: function () { onNavigate('credits'); } }, '查看余额明细'),
    selName ? el('span', { className: 'agent-sel-tag' }, '已选：' + selName) : null);

  // 消息区：加载 / 空态 / 气泡列表 三态
  let chatBody;
  if (messages === null) {
    chatBody = el('div', { className: 'agent-chat' },
      el('div', { className: 'agent-loading' },
        el('div', { className: 'agent-loading-dot' }),
        el('span', null, '正在为你沏茶…')));
  } else if (messages.length === 0) {
    chatBody = el('div', { className: 'agent-chat' },
      el('div', { className: 'agent-empty' },
        el('div', { className: 'agent-empty-icon' }, '☕'),
        el('div', null, '太初先生在这儿，有什么想聊聊的？'),
        el('div', null, caseList && caseList.length ? '已默认选中你的档案，可直接开口。' : '请先建立一份档案，再与太初先生对话。')));
  } else {
    chatBody = el('div', { className: 'agent-chat', ref: chatRef },
      messages.map(function (m, i) {
        return el('div', {
          key: i,
          className: 'agent-msg ' + m.role + (m.hint ? ' hint' : '') + (m.pending ? ' pending' : '')
        },
        el('div', { className: 'agent-bubble' }, m.content));
      }));
  }

  const inputRow = el('div', { className: 'agent-input-row' },
    el('input', {
      className: 'agent-input',
      type: 'text',
      value: input,
      onChange: function (e) { setInput(e.target.value); },
      onKeyDown: onInputKey,
      placeholder: selName ? '向太初先生提问（已结合「' + selName + '」）…' : '请先建立档案，再与太初先生对话…',
      disabled: sending || !caseId,
      maxLength: 500
    }),
    el('button', {
      type: 'button',
      className: 'agent-send',
      onClick: handleSend,
      disabled: sending || !input.trim() || !caseId
    }, sending ? '聆听中' : ['发送', payBadge(payEnough)]));

  // REQ-113④：切换非默认档案的确认弹窗 —— 「设为默认档案」重新定义默认 / 「仅临时使用」
  // REQ-113④：切换非默认档案的确认弹窗 —— 已迁移至 ModalBase（2026-09-10）
  const switchModal = switchTarget ? el(ModalBase, {
    title: '切换档案',
    onClose: function () { if (!switchBusy) setSwitchTarget(null); },
    maskClosable: !switchBusy,
    footer: el(React.Fragment, null,
      el('button', { type: 'button', className: 'btn btn-primary', disabled: switchBusy, onClick: confirmSwitchAsDefault }, switchBusy ? '设置中…' : '设为默认档案'),
      el('button', { type: 'button', className: 'btn btn-outline', disabled: switchBusy, onClick: confirmSwitchTemporary }, '仅临时使用'),
      el('button', { type: 'button', className: 'btn btn-outline', disabled: switchBusy, onClick: function () { setSwitchTarget(null); } }, UI_COPY.buttons.cancel)
    )
  },
    el('p', { style: { fontSize: 13, color: 'var(--text-2)', lineHeight: 1.7, margin: '6px 0 2px' } },
      '「' + switchTarget.name + '」不是当前默认档案。'),
    el('p', { style: { fontSize: 13, color: 'var(--text-2)', lineHeight: 1.7, margin: '0 0 6px' } },
      '要将它设为默认档案，还是仅本次临时使用？')
  ) : null;

  return el('div', { className: 'agent-page' },
    el('div', { className: 'agent-head' },
      el('div', { className: 'agent-title' }, el(Icon, { name: 'chat', size: 20 }), ' 太初先生'),
      pick),
    bill,
    loadErr ? el('div', { className: 'agent-err' }, loadErr) : null,
    caseErr && !(caseList && caseList.length) ? el('div', { className: 'agent-err' }, caseErr) : null,
    chatBody,
    sendErr ? el('div', { className: 'agent-err' }, sendErr) : null,
    inputRow,
    switchModal);
}

// ===== REQ-080：真实子路径路由（history API · pathname ⇄ 页面 双向映射）=====
// 映射口径见 docs/模块URL映射表-REQ080.md（2026-09-08 需求方确认）：
//   /→landing  /guoxue→guoxue-hub  /xishi→xishi-hub  /mbti→mbti-hub（心理测试 Hub）
//   /mbti/test→mbti（人格测试） /jiufa→nine-pick
//   /zodiac→zodiac  /divination→divination  /astrology→astrology  /tarot→tarot
//   /lenormand→lenormand  /cases→cases  /cases/:id→archive  /agent→agent
//   /settings→settings  /login|/register→auth  /mbti/share/:token→mbti-share
//   /case/share/:token→case-share
// Hub 页以 pages dict 实际名为准：guoxue-hub/xishi-hub 落 /guoxue、/xishi（URL 不带 -hub 后缀）；
// 九法合一页实际名 nine-pick → /jiufa；auth 页登录/注册同页（内部 tab 切换）→ 正向统一写 /login，
// 反向 /register 亦反解为 auth。映射表外的工作流中间页（onboarding/waiting/calibration/predict/
// revise/topic/credits）携带 caseId/topic/context 等长文本、刻意不做深链：pathFor 返回 null →
// 只切换 React 视图、不写 URL 也不新增 history 条目（浏览器后退直达上一真实路径页）。
const REQ080_PAGE_PATH = {
  landing: '/',
  'guoxue-hub': '/guoxue',
  'guoxue-tools': '/guoxue/tools',
  'xishi-hub': '/xishi',
  'mbti-hub': '/mbti',
  mbti: '/mbti/test',
  'nine-pick': '/jiufa',
  zodiac: '/zodiac',
  divination: '/divination',
  almanac: '/almanac',
  taiyi: '/taiyi',
  huangji: '/huangji',
  astrology: '/astrology',
  tarot: '/tarot',
  lenormand: '/lenormand',
  cases: '/cases',
  agent: '/agent',
  settings: '/settings',
  auth: '/login'
};
// 动态段路径：URL ⇄ params 互转（:id / :token），一律 encodeURIComponent 编解码；
// 参数缺失时回退到该模块列表页（/cases、/mbti/share、/case/share），避免 /undefined 死链。
const REQ080_DYNAMIC = [{
  page: 'archive',
  param: 'caseId',
  toUrl: v => v == null || v === '' ? '/cases' : '/cases/' + encodeURIComponent(v),
  fromUrl: s => ({
    caseId: decodeSeg(s)
  })
}, {
  page: 'mbti-share',
  param: 'token',
  toUrl: v => v == null || v === '' ? '/mbti/share' : '/mbti/share/' + encodeURIComponent(v),
  fromUrl: s => ({
    token: decodeSeg(s)
  })
}, {
  page: 'case-share',
  param: 'token',
  toUrl: v => v == null || v === '' ? '/case/share' : '/case/share/' + encodeURIComponent(v),
  fromUrl: s => ({
    token: decodeSeg(s)
  })
}];
// 深链/刷新直落模块功能页时同步模块与皮肤（口径与「Banner 模块下拉直达 / HUB 卡片」一致，
// 对应 MOD_NAV_GROUPS item.module/skin 与 MODULE_HUB，避免直落 tarot/astrology 仍沿用旧模块皮肤）；
// landing/auth/cases/settings/agent/archive 等中立页不在表内（保持当前模块与皮肤）。
const REQ080_PAGE_THEME = {
  'guoxue-hub': {
    module: 'guoxue',
    skin: 'guoxue'
  },
  'guoxue-tools': {
    module: 'guoxue',
    skin: 'guoxue'
  },
  'xishi-hub': {
    module: 'xishi',
    skin: 'xishi'
  },
  'nine-pick': {
    module: 'guoxue',
    skin: 'guoxue'
  },
  zodiac: {
    module: 'guoxue',
    skin: 'guoxue'
  },
  divination: {
    module: 'guoxue',
    skin: 'guoxue'
  },
  almanac: {
    module: 'guoxue',
    skin: 'guoxue'
  },
  taiyi: {
    module: 'guoxue',
    skin: 'guoxue'
  },
  huangji: {
    module: 'guoxue',
    skin: 'guoxue'
  },
  astrology: {
    module: 'xishi',
    skin: 'xingzuo'
  },
  tarot: {

  },
  lenormand: {

  },
  'mbti-hub': {
    module: 'mbti',
    skin: 'mbti'
  },
  mbti: {
    module: 'mbti',
    skin: 'mbti'
  }
};
function decodeSeg(s) {
  try {
    return decodeURIComponent(s);
  } catch (e) {
    return s; // 非法 % 编码 → 原样兜底
  }
}
// pathname 形态归一化：剔除 query/hash、折叠重复斜杠、去尾斜杠（根路径除外）
function req080NormPath(raw) {
  let p = String(raw || '');
  let q = p.indexOf('?');
  if (q >= 0) p = p.slice(0, q);
  q = p.indexOf('#');
  if (q >= 0) p = p.slice(0, q);
  if (!p) p = '/';
  p = p.replace(/\/{2,}/g, '/');
  if (p.length > 1 && p.slice(-1) === '/') p = p.replace(/\/+$/, '') || '/';
  return p;
}
// 正向：page+params → 真实子路径；映射表外的中间页返回 null（不写 URL）
function req080PathFor(p, p2) {
  p2 = p2 || {};
  if (Object.prototype.hasOwnProperty.call(REQ080_PAGE_PATH, p)) return REQ080_PAGE_PATH[p];
  for (let i = 0; i < REQ080_DYNAMIC.length; i++) {
    if (REQ080_DYNAMIC[i].page === p) return REQ080_DYNAMIC[i].toUrl(p2[REQ080_DYNAMIC[i].param]);
  }
  return null;
}
// 反向：pathname → {page, params, norm, canon}；无法识别的路径返回 null（调用方
// replaceState('/') 回落地页）。norm=归一化路径，canon=该页面规范路径；二者不一致
// （尾斜杠 / 重复斜杠 / index.html / 编码形态等旧书签旧链接）→ 以 canon 归一化重定向，不产生死链。
function req080ParsePath(raw) {
  const norm = req080NormPath(raw);
  if (norm === '/' || norm === '/index.html') return {
    page: 'landing',
    params: {},
    norm: norm,
    canon: '/'
  };
  // 静态段（/login 命中 auth；/register 单独保留其规范路径）
  for (const pg in REQ080_PAGE_PATH) {
    if (REQ080_PAGE_PATH[pg] === norm) return {
      page: pg,
      params: {},
      norm: norm,
      canon: REQ080_PAGE_PATH[pg]
    };
  }
  if (norm === '/register') return {
    page: 'auth',
    params: {},
    norm: norm,
    canon: '/register'
  };
  // 分享深链无 token 段（/mbti/share、/case/share 及尾斜杠形态）也进分享页，判空渲染
  // 「链接无效 / 缺少链接参数」，不请求 /undefined（BUG-009 加固口径保留）。
  if (norm === '/mbti/share') return {
    page: 'mbti-share',
    params: {
      token: ''
    },
    norm: norm,
    canon: '/mbti/share'
  };
  if (norm === '/case/share') return {
    page: 'case-share',
    params: {
      token: ''
    },
    norm: norm,
    canon: '/case/share'
  };
  // 动态段
  let m = norm.match(/^\/cases\/([^/]+)$/);
  if (m) {
    const params = REQ080_DYNAMIC[0].fromUrl(m[1]);
    return {
      page: 'archive',
      params: params,
      norm: norm,
      canon: '/cases/' + encodeURIComponent(params.caseId)
    };
  }
  m = norm.match(/^\/mbti\/share\/(.+)$/);
  if (m) {
    const params = REQ080_DYNAMIC[1].fromUrl(m[1]);
    return {
      page: 'mbti-share',
      params: params,
      norm: norm,
      canon: '/mbti/share/' + encodeURIComponent(params.token)
    };
  }
  m = norm.match(/^\/case\/share\/(.+)$/);
  if (m) {
    const params = REQ080_DYNAMIC[2].fromUrl(m[1]);
    return {
      page: 'case-share',
      params: params,
      norm: norm,
      canon: '/case/share/' + encodeURIComponent(params.token)
    };
  }
  return null; // 未知路径
}
function req080ThemeFor(page) {
  return REQ080_PAGE_THEME[page] || null;
}

// ---- App Router ----
function App() {
  const [page, setPage] = useState('landing');
  const [params, setParams] = useState({});
  const [skin, setSkin] = useState(() => localStorage.getItem('taichu_skin') || 'guoxue');
  const [module, setModule] = useState(() => {
    const s = localStorage.getItem('taichu_skin') || 'guoxue';
    if (s === 'xishi' || s === 'tarot' || s === 'xingzuo') return 'xishi';
    if (s === 'mbti') return 'mbti';
    return 'guoxue';
  });
  const [creditModal, setCreditModal] = useState(null);
  const [pairCfg, setPairCfg] = useState(null); // REQ-072：配对解析弹窗配置 {module}，非空时渲染 PairModal
  // REQ-066：功能设置 —— 全局 state（App 顶层）+ 保存态。默认值 SETTINGS_DEFAULTS；
  // 登录后 GET /api/settings 覆盖，未登录/接口失败保持前端默认；改动本地即时生效并防抖 PUT。
  // tcSavedRef = 服务端最近确认值（用于保存失败回退）；tcLoadedRef = 本登录会话是否已拉取。
  const [tcSet, setTcSet] = useState(function () { return Object.assign({}, SETTINGS_DEFAULTS); });
  const [tcSave, setTcSave] = useState('saved'); // 'saved' | 'saving' | 'failed'
  const tcSavedRef = useRef(Object.assign({}, SETTINGS_DEFAULTS));
  const tcLoadedRef = useRef(false);
  const tcSeqRef = useRef(0); // PUT 序号：忽略乱序返回的旧响应，避免旧响应覆盖新改动
  // BUG-013：onPatch 契约为 (key, value)——SettingsPage 两个调用点（开关 onChange、默认模式
  // onClick）均以 (key, value) 调用；旧实现把首参当「整包对象」合并，导致字符串 key 被
  // Object.assign 按字符索引铺开、7 项设置永不变更（开关点了不切换、无 PUT）。改为单键写入。
  const patchTcSettings = function (key, value) {
    setTcSet(function (prev) {
      const next = Object.assign({}, prev);
      next[key] = value;
      return next;
    });
  };
  const applyTcSettings = function (next) {
    tcSeqRef.current++; // 使任何在途 PUT 失效（GET/登出覆盖优先）
    tcSavedRef.current = next;
    setTcSet(next);
