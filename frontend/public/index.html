<!DOCTYPE html>
<html lang="zh-CN" data-skin="guoxue">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>太初 · 识己于星，安己于时</title>
  <!-- BUG-009：脚本必须用根绝对路径 /vendor/...（不能用相对 ./vendor/...）。
       分享链接直达页路径为 /mbti/share/{token}，相对路径会被浏览器解析为
       /mbti/share/vendor/... → SPA fallback 回退 index.html（text/html 被当 JS 执行）
       → React 加载失败 → 整页白屏。站点部署在域名根，根绝对路径在首页与深层路由都正确。 -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/regions.js"></script>
  <style>
    :root{
      /* 主色 墨蓝 / 靛青 */
      --ink-300:#3A4570; --ink-400:#5E6FB3; --ink-500:#44558F; --ink-600:#364573; --ink-700:#2C385C; --ink-900:#1A2138;
      /* 金 / 玉 / 朱砂 */
      --gold-300:#E6CF9A; --gold-500:#B8893E; --gold-600:#9C6E2E;
      --jade-500:#3E7C6B; --cinnabar:#B23A3A; --error:#C0392B;
      /* 中性 宣纸暖灰 */
      --paper:#F7F4EC; --surface:#FFFFFF; --text-1:#1F1F26; --text-2:#5C5C68; --text-3:#8A8A94; --border:#E5E0D4;
      /* 字体 */
      --font-serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
      --font-sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Hiragino Sans GB",sans-serif;
      --font-latin-serif:Georgia,"Times New Roman",serif;
      /* 圆角 / 阴影 */
      --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
      --shadow-card:0 2px 12px rgba(26,33,56,.10);
      --dur:.22s; --ease:cubic-bezier(.4,0,.2,1);

      /* ===== 多文化皮肤（v1.2.7 最终）：内部标识色=玉青（按钮/吉），顶部 Banner + 底部胶囊=朱砂红 ===== */
      --skin-accent:#3E7C6B;
      --skin-accent-soft:rgba(62,124,107,.14);
      --skin-accent-ink:#F7F4EC;
      --skin-banner:#B23A3A;
      --skin-banner-ink:#F7F4EC;
      --skin-tag-bg:rgba(0,0,0,.16);
    }
    /* 西式占星：内部=深空蓝；顶部 Banner=月银 */
    [data-skin="astrology"]{
      --skin-accent:#2A3A5C; --skin-accent-soft:rgba(42,58,92,.14); --skin-accent-ink:#F7F4EC;
      --skin-banner:#C9CBD3; --skin-banner-ink:#1F1F26; --skin-tag-bg:rgba(255,255,255,.55);
    }
    /* 塔罗：内部=琥珀；顶部 Banner=紫晶 */
    [data-skin="tarot"]{
      --skin-accent:#C9A24B; --skin-accent-soft:rgba(201,162,75,.18); --skin-accent-ink:#1F1F26;
      --skin-banner:#5B4B8A; --skin-banner-ink:#F7F4EC; --skin-tag-bg:rgba(0,0,0,.16);
    }
    /* 西式占卜 HUB：内部=紫晶；顶部 Banner=琥珀（与塔罗互置） */
    [data-skin="xishi"]{
      --skin-accent:#5B4B8A; --skin-accent-soft:rgba(91,75,138,.18); --skin-accent-ink:#F7F4EC;
      --skin-banner:#C9A24B; --skin-banner-ink:#1F1F26; --skin-tag-bg:rgba(0,0,0,.14);
    }
    /* 星座（=原占星）：内部=深空蓝；顶部 Banner=月银 */
    [data-skin="xingzuo"]{
      --skin-accent:#2A3A5C; --skin-accent-soft:rgba(42,58,92,.14); --skin-accent-ink:#F7F4EC;
      --skin-banner:#C9CBD3; --skin-banner-ink:#1F1F26; --skin-tag-bg:rgba(255,255,255,.55);
    }
    /* MBTI：内部=靛蓝；顶部 Banner=薄荷 */
    [data-skin="mbti"]{
      --skin-accent:#4A5BB5; --skin-accent-soft:rgba(74,91,181,.16); --skin-accent-ink:#F7F4EC;
      --skin-banner:#7ED3C6; --skin-banner-ink:#16302C; --skin-tag-bg:rgba(0,0,0,.12);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{font-family:var(--font-sans);color:var(--text-1);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
    .serif{font-family:var(--font-serif)}
    button{font-family:inherit;cursor:pointer;border:none;background:none}
    input,select,textarea{font-family:inherit}

    /* 星点背景（星象式沉浸感，低透明度不影响阅读） */
    .starfield{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.55;
      background:
        radial-gradient(1px 1px at 18% 28%, rgba(230,207,154,.8), transparent),
        radial-gradient(1px 1px at 76% 18%, rgba(230,207,154,.55), transparent),
        radial-gradient(1.6px 1.6px at 52% 62%, rgba(255,255,255,.55), transparent),
        radial-gradient(1px 1px at 86% 74%, rgba(230,207,154,.65), transparent),
        radial-gradient(1.2px 1.2px at 12% 82%, rgba(255,255,255,.45), transparent),
        radial-gradient(1.4px 1.4px at 33% 12%, rgba(230,207,154,.5), transparent);
      background-repeat:no-repeat;animation:twinkle 6s ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.7}}

    .app-shell{position:relative;z-index:1;min-height:100vh;padding-top:58px;padding-bottom:104px}
    .container{max-width:480px;margin:0 auto;padding:24px 20px}

    /* 顶部固定 Banner（随主题换色） */
    .topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
      padding:12px 20px;background:var(--skin-banner);color:var(--skin-banner-ink);
      box-shadow:0 1px 0 var(--gold-500),0 6px 18px rgba(26,33,56,.18);transition:background var(--dur) var(--ease)}
    .brand{font-family:var(--font-serif);font-weight:700;font-size:18px;letter-spacing:.04em}
    .brand .dot{color:var(--gold-300);margin:0 2px}
    .topbar .tagline{font-size:12px;opacity:.85}
    .topbar-side{display:flex;align-items:baseline;gap:12px;min-width:0}

    /* 右上角菜单区：登录按钮 + 汉堡下拉 */
    .topbar-menu{position:relative;display:flex;align-items:center;flex:none}
    .topbar-menu .menu-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;
      background:rgba(128,128,150,.18);color:var(--skin-banner-ink);transition:background .18s ease}
    .topbar-menu .menu-btn:hover{background:rgba(128,128,150,.32)}
    .topbar-menu .menu-btn .bars{display:flex;flex-direction:column;gap:4px;width:16px;pointer-events:none}
    .topbar-menu .menu-btn .bars .bar{height:2px;border-radius:2px;background:currentColor}
    .menu-login-btn{display:flex;align-items:center;gap:6px;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:600;
      color:var(--skin-banner-ink);background:transparent;border:1px solid var(--skin-banner-ink);line-height:1.4;white-space:nowrap;
      transition:background .18s ease,color .18s ease}
    .menu-login-btn:hover{background:var(--skin-banner-ink);color:var(--skin-banner)}

    /* REQ-051：Banner 右上角全局余额（仅登录；积分 ÷ 汇率 → ¥，汇率动态读 system_configs.recharge_rate，读不到按 10） */
    .topbar-balance{display:inline-flex;align-items:center;gap:6px;margin-right:10px;padding:6px 12px;border-radius:999px;background:rgba(128,128,150,.2);color:var(--skin-banner-ink);font-size:12.5px;font-weight:600;line-height:1.5;white-space:nowrap;font-variant-numeric:tabular-nums;cursor:pointer;transition:background .18s ease}
    .topbar-balance:hover{background:rgba(128,128,150,.34)}
    .topbar-balance.static{cursor:default}
    .topbar-balance.static:hover{background:rgba(128,128,150,.2)}
    .topbar-balance .tb-k{font-weight:400;opacity:.8}
    .topbar-balance .tb-sym{opacity:.92}
    .menu-drop{position:absolute;right:0;top:calc(100% + 10px);z-index:60;min-width:184px;padding:6px;
      background:var(--surface);color:var(--text-1);border:1px solid var(--border);border-radius:14px;
      box-shadow:0 14px 34px rgba(26,33,56,.24);display:flex;flex-direction:column;gap:2px}
    .menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:9px;text-align:left;
      font-size:14px;color:var(--text-1);background:none;transition:background .14s ease,color .14s ease;white-space:nowrap}
    .menu-item:hover{background:var(--skin-accent-soft);color:var(--skin-accent)}
    .menu-item .mi-dot{width:8px;height:8px;border-radius:50%;flex:none}
    .menu-sep{height:1px;background:var(--border);margin:4px 8px}
    .menu-item.logout{color:var(--cinnabar)}
    .menu-item.logout:hover{background:rgba(178,58,58,.1);color:var(--cinnabar)}

    /* 底部皮肤切换胶囊（随主题换色） */
    .skin-switch{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:20;display:flex;gap:4px;
      padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);
      box-shadow:0 6px 18px rgba(26,33,56,.14)}
    .skin-switch button{padding:4px 12px;border-radius:var(--radius-pill);font-size:12px;color:var(--text-2);font-weight:500;white-space:nowrap;transition:background var(--dur) var(--ease)}
    .skin-switch button.active{background:var(--skin-banner);color:var(--skin-banner-ink)}
    .skin-switch button:disabled{opacity:.5;cursor:not-allowed}
    /* 线上隐藏胶囊：组件与样式保留，日后恢复只需删除下面这条覆盖 */
    .skin-switch{display:none}

    /* 卡片 / 按钮 / 表单 */
    .card{background:var(--surface);border-radius:var(--radius-lg);padding:24px;margin:12px 0;box-shadow:var(--shadow-card);border:1px solid rgba(26,33,56,.04)}
    .feature{border-left:3px solid var(--skin-accent)}
    .btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;border:none;border-radius:var(--radius-md);font-size:16px;cursor:pointer;font-weight:600;transition:transform .12s,box-shadow .2s}
    .btn:active{transform:translateY(1px)}
    .btn-primary{background:var(--skin-accent);color:var(--skin-accent-ink);box-shadow:0 4px 16px rgba(26,33,56,.18)}
    .btn-gold{background:var(--gold-500);color:#fff}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-1)}
    .btn-mini{width:auto;flex:none;padding:4px 12px;font-size:12px;line-height:1.5;border-radius:var(--radius-pill)}
    .input{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;margin:8px 0;background:var(--surface);color:var(--text-1)}
    .input:focus{outline:none;border-color:var(--skin-accent)}
    .label{font-size:13px;color:var(--text-2);margin-top:12px;display:block}

    /* 注册协议勾选（仅注册页显示） */
    .agree-row{display:flex;align-items:flex-start;gap:8px;margin:14px 0 2px;text-align:left}
    .agree-row input{flex-shrink:0;margin-top:3px;width:auto;accent-color:var(--skin-accent);cursor:pointer}
    .agree-label{font-size:13px;color:var(--text-2);line-height:1.6;cursor:pointer}
    .agree-label a{color:var(--ink-500);text-decoration:none;border-bottom:1px solid rgba(68,85,143,.35);margin:0 1px}
    .agree-label a:hover{color:var(--skin-accent);border-bottom-color:currentColor}
    .title{font-family:var(--font-serif);font-size:24px;color:var(--ink-700);text-align:center;margin:8px 0 16px;font-weight:600}
    .subtitle{font-size:14px;color:var(--text-2);text-align:center;margin-bottom:24px}
    .error{background:#FFF0F0;color:var(--cinnabar);padding:12px;border-radius:var(--radius-sm);font-size:13px}
    .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--radius-pill);background:var(--skin-tag-bg);color:var(--skin-banner-ink);margin-right:4px}

    /* 免责星印（跨皮肤合规标记，硬编码朱砂） */
    .disclaimer{font-size:11px;color:var(--cinnabar);text-align:center;margin:0 auto;padding:18px 20px;max-width:480px;line-height:1.6}
    .disclaimer .star{margin-right:4px}
    /* 协议链接行（低调小字，随免责色） */
    .disclaimer .legal-links{margin-top:8px;font-size:10px;letter-spacing:.02em}
    .disclaimer .legal-links a{color:inherit;text-decoration:none;border-bottom:1px dashed rgba(178,58,58,.4);padding-bottom:1px;margin:0 3px;opacity:.85}
    .disclaimer .legal-links a:hover{opacity:1;border-bottom-color:rgba(178,58,58,.9)}
    .disclaimer .legal-sep{opacity:.5}

    .progress{height:6px;background:var(--border);border-radius:3px;margin:16px 0;overflow:hidden}
    .progress-bar{height:100%;background:linear-gradient(90deg,var(--skin-accent),var(--gold-500));border-radius:3px;transition:width .5s var(--ease)}
    .trend-ji{border-left:3px solid var(--skin-accent)}
    .trend-xiong{border-left:3px solid var(--cinnabar)}
    .trend-ping{border-left:3px solid var(--ink-400)}

    .flex-row{display:flex;gap:8px}
    .flex-row > *{flex:1}

    /* 开关 / 提示 / 修正输入 / 失败态 / 登出 / 双列 */
    .switch-row{display:flex;align-items:center;gap:10px;margin:10px 0}
    .switch{position:relative;width:44px;height:24px;flex:none}
    .switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:999px;transition:.2s}
    .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
    .switch input:checked + .slider{background:var(--skin-accent)}
    .switch input:checked + .slider:before{transform:translateX(20px)}
    .coord-hint{font-size:11px;color:var(--skin-accent);margin:2px 0 0}
    .note-input{width:100%;min-height:64px;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-top:8px;resize:vertical;font-family:inherit}
    .failed-box{text-align:center}
    .failed-box .error{margin-bottom:12px;text-align:left}
    .logout-bar{display:flex;justify-content:flex-end;gap:16px;margin-top:8px}
    .logout-link{font-size:12px;color:var(--text-3);cursor:pointer;background:none;border:none;padding:4px}
    .field-row{display:flex;gap:8px}
    .field-row > div{flex:1}
    .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
    .kv:last-child{border-bottom:none}
    .kv .k{color:var(--text-2)}
    .kv .v{color:var(--text-1);font-weight:600}
    .section-title{font-size:15px;color:var(--ink-700);margin:4px 0 8px;font-weight:600}

    /* 断前尘星象轨道动画（C1） */
    .dqc-stage{margin:8px auto 0;max-width:520px;padding:32px 20px 28px;border-radius:var(--radius-lg);
      background:radial-gradient(120% 90% at 50% 25%, #232C49 0%, var(--ink-900) 80%);box-shadow:var(--shadow-card)}
    .dqc-plate{width:240px;height:240px;margin:0 auto;display:block}
    .dqc-rings{transform-box:fill-box;transform-origin:center;animation:spin 70s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .gold{fill:var(--gold-500)}
    .gold-stroke{stroke:var(--gold-500)}
    .ring-stroke{stroke:#3A4470}
    .s-pending{fill:var(--ink-700);opacity:.55}
    .s-active{fill:var(--gold-500);animation:pulse 1.2s ease-in-out infinite}
    .s-done{fill:var(--gold-300)}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    .dqc-progress{text-align:center;margin-top:16px;font-family:var(--font-serif);font-size:20px;color:var(--gold-300);letter-spacing:.05em}
    .dqc-method{text-align:center;margin-top:6px;font-size:14px;color:#C9C6DA}
    .dqc-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.12);margin:14px auto 0;max-width:360px;overflow:hidden}
    .dqc-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-600),var(--gold-300));transition:width .5s var(--ease)}
    .dqc-status{text-align:center;margin-top:10px;font-size:12px;color:#8E8AA6;font-family:var(--font-latin-serif);letter-spacing:.04em}
    .dqc-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px auto 0;max-width:420px}
    .dqc-list span{font-size:12px;padding:4px 10px;border-radius:var(--radius-pill);background:rgba(255,255,255,.06);color:#9FA3BC}
    .dqc-list span.done{background:var(--skin-accent-soft);color:#fff}
    .dqc-list span.active{background:var(--gold-600);color:#fff}

    /* 轻提示 */
    .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);background:var(--ink-900);color:#fff;
      padding:10px 18px;border-radius:var(--radius-pill);font-size:13px;opacity:0;pointer-events:none;transition:.25s var(--ease);z-index:40}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* 骨架屏（shimmer 加载占位） */
    .skeleton{position:relative;overflow:hidden;background:var(--border);border-radius:6px}
    .skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shimmer 1.3s infinite}
    @keyframes shimmer{100%{transform:translateX(100%)}}
    .sk-line{height:12px;margin:10px 0}
    .sk-title{height:22px;width:55%;margin:6px 0 16px}
    .sk-card{background:var(--surface);border-radius:var(--radius-lg);padding:22px;margin:12px 0;box-shadow:var(--shadow-card);border:1px solid rgba(26,33,56,.04);overflow:hidden}

    /* 页面切换过渡（key=page 重挂载触发） */
    .view-enter{animation:viewEnter .34s var(--ease) both}
    @keyframes viewEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    /* 图标 / 卡片 hover 微交互 */
    .icon{display:inline-flex;vertical-align:middle}
    .card{transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
    .card:hover{box-shadow:0 6px 22px rgba(26,33,56,.14)}
    .btn-primary:hover{box-shadow:0 6px 20px rgba(26,33,56,.26)}

    /* 解读页「历史追问 / 矫正」列表 */
    .hist-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .hist-item{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
      background:var(--paper);font-size:13px;color:var(--text-1);line-height:1.55;cursor:pointer;word-break:break-word;
      transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
    .hist-item:hover{border-color:var(--skin-accent);background:#f0ece0}

    /* ===== 完整盘面（八字/紫微/占星/七政/奇门/五运六气） ===== */
    .chart-view{margin-top:14px}
    .chart-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
    .chart-tab{padding:7px 13px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-pill);font-size:13px;cursor:pointer;color:var(--text-2);transition:.18s}
    .chart-tab:hover{border-color:var(--skin-accent)}
    .chart-tab.active{background:var(--skin-accent);color:var(--skin-accent-ink);border-color:var(--skin-accent);font-weight:600}
    .sub-title{font-size:13px;font-weight:600;color:var(--skin-accent);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
    .sub-title::before{content:"";width:3px;height:13px;background:var(--skin-accent);border-radius:2px;display:inline-block}
    .daymaster{display:flex;align-items:baseline;gap:8px;margin:2px 0 4px}
    .daymaster .dm{font-size:21px;font-weight:700;color:var(--skin-accent)}
    .daymaster .dm-wx{font-size:13px;color:var(--text-2)}
    .aux-line{font-size:12px;color:var(--text-3);margin:6px 0;line-height:1.75}
    .aux-line b{color:var(--text-2);font-weight:600}

    /* 四柱表 */
    .four-pillars{display:grid;grid-template-columns:74px repeat(4,1fr);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)}
    .fp-cell{padding:9px 6px;text-align:center;font-size:13px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);min-width:0;word-break:break-word}
    .fp-cell:last-child{border-right:none}
    .fp-cell.fp-rowhead{background:#f4f0e7;font-weight:600;color:var(--text-2);text-align:left;padding-left:10px}
    .fp-cell.fp-head{background:var(--skin-accent);color:var(--skin-accent-ink);font-weight:600}
    .fp-cell.fp-day{background:var(--skin-accent-soft);font-weight:600;color:var(--skin-accent)}
    .fp-cell.fp-head.fp-day{background:var(--skin-accent);color:var(--skin-accent-ink)}

    /* 神煞标签 */
    .shensha-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
    .shensha-tag{font-size:12px;padding:3px 9px;border-radius:var(--radius-pill);border:1px solid transparent;line-height:1.4}
    .shensha-tag.green{background:rgba(62,124,107,.14);color:#2f6b5b;border-color:rgba(62,124,107,.3)}
    .shensha-tag.red{background:rgba(178,58,58,.12);color:var(--cinnabar);border-color:rgba(178,58,58,.3)}
    .shensha-tag.gold{background:rgba(191,161,90,.16);color:#9a7d34;border-color:rgba(191,161,90,.35)}

    /* 通用小表格 */
    .mini-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
    .mini-table th,.mini-table td{border:1px solid var(--border);padding:6px 8px;text-align:center}
    .mini-table th{background:#f4f0e7;color:var(--text-2);font-weight:600}
    .mini-table td{color:var(--text-1)}

    /* 流年时间轴 */
    .timeline{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-top:4px}
    .tl-item{flex:0 0 auto;width:128px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px}
    .tl-year{font-weight:700;font-size:14px;color:var(--skin-accent)}
    .tl-age{font-size:11px;color:var(--text-3);font-weight:400;margin-left:4px}
    .tl-ganzhi{font-size:13px;margin:3px 0}
    .tl-dy{display:block;font-size:11px;color:var(--text-3)}
    .tl-events{display:flex;flex-direction:column;gap:3px}
    .tl-ev{font-size:11px;color:var(--cinnabar);background:rgba(178,58,58,.07);border-radius:6px;padding:2px 5px;line-height:1.35}

    /* 紫微十二宫 */
    .ziwei-wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
    .ziwei-wheel{flex:0 0 auto;width:240px;height:240px;max-width:100%}
    .zw-ring{fill:none;stroke:var(--skin-accent);stroke-width:1.5;opacity:.5}
    .zw-ring-inner{fill:none;stroke:var(--skin-accent);stroke-width:1;opacity:.3}
    .zw-label{font-size:12px;fill:var(--text-2)}
    .zw-center{font-size:13px;font-weight:700;fill:var(--skin-accent)}
    .zw-center2{font-size:11px;fill:var(--text-3)}
    .palace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;flex:1;min-width:260px}
    .palace-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 10px;background:var(--surface)}
    .palace-card.body{border-color:var(--skin-accent);background:var(--skin-accent-soft)}
    .pc-name{font-weight:700;font-size:13px;color:var(--text-1);display:flex;align-items:center;gap:5px}
    .pc-badge{font-size:10px;background:var(--skin-accent);color:var(--skin-accent-ink);border-radius:6px;padding:1px 5px}
    .pc-stem{font-size:12px;color:var(--text-3);margin:2px 0}
    .pc-stars{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
    .pc-major{font-size:12px;background:var(--skin-accent);color:var(--skin-accent-ink);border-radius:6px;padding:1px 6px}
    .pc-stars.sm{font-size:11px;color:var(--text-2)}
    .pc-stars.adj{font-size:11px;color:var(--text-3)}
    .pc-sihua{font-size:11px;color:var(--cinnabar);margin-top:3px}

    /* 占星 / 七政 表格 */
    .planet-table,.star-table,.aspect-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
    .planet-table th,.star-table th,.aspect-table th,.planet-table td,.star-table td,.aspect-table td{border:1px solid var(--border);padding:6px 8px}
    .planet-table th,.star-table th,.aspect-table th{background:#f4f0e7;color:var(--text-2);font-weight:600;text-align:left}
    .planet-table td,.star-table td,.aspect-table td{color:var(--text-1)}
    .retro{color:var(--cinnabar);font-size:11px}

    /* 奇门九宫 */
    .qimen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:420px;margin-top:4px}
    .qimen-cell{border:1px solid var(--border);border-radius:var(--radius-md);padding:7px 8px;background:var(--surface);min-height:78px}
    .qc-name{font-weight:700;font-size:13px;color:var(--skin-accent)}
    .qc-meta{font-size:11px;color:var(--text-3)}
    .qc-lines{font-size:11.5px;color:var(--text-1);margin-top:3px;line-height:1.5}

    /* 五运六气对比 */
    .wuyun-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
    .wuyun-col{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;background:var(--surface)}
    .wuyun-col h4{margin:0 0 8px;font-size:13px;color:var(--skin-accent)}
    .wuyun-col .kv{font-size:12.5px}

    .empty-note{font-size:13px;color:var(--text-3);background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius-md);padding:14px;text-align:center}
    .deg-banner{font-size:12px;color:var(--cinnabar);background:rgba(178,58,58,.08);border-radius:var(--radius-md);padding:8px 10px;margin-bottom:6px;line-height:1.6}

    /* —— 积分系统（沿用国学皮肤令牌，不新增配色）—— */
    .credit-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:var(--skin-banner);color:#fff;font-size:13px;font-weight:600;cursor:pointer;line-height:1.5;transition:transform .12s,box-shadow .2s}
    .credit-pill:hover{box-shadow:0 4px 14px rgba(178,58,58,.28)}
    .credit-pill.warn{background:var(--cinnabar)}
    .credit-pill .pill-bal{font-variant-numeric:tabular-nums}
    .credit-pill.skeleton{width:96px;height:26px;padding:0;border:none;background:linear-gradient(90deg,#e9e2d6 25%,#f4efe6 37%,#e9e2d6 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite}
    .credit-balance-wrap{display:inline-flex;align-items:center;gap:8px}
    .txn-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
    .txn-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)}
    .txn-icon{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .txn-icon.up{background:var(--skin-accent-soft);color:var(--skin-accent)}
    .txn-icon.down{background:rgba(178,58,58,.12);color:var(--cinnabar)}
    .txn-main{flex:1;min-width:0}
    .txn-title{font-size:14px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .txn-time{font-size:12px;color:var(--text-3);margin-top:2px}
    .txn-right{flex:none;text-align:right}
    .txn-delta{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
    .txn-delta.plus{color:var(--skin-accent)}
    .txn-delta.minus{color:var(--cinnabar)}
    .txn-rest{font-size:11px;color:var(--text-3);margin-top:2px}
    .modal-mask{position:fixed;inset:0;background:rgba(20,24,38,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
    .modal{background:var(--surface);border-radius:16px;padding:24px;max-width:340px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.3);text-align:center}
    .modal-title{font-size:18px;font-weight:700;margin-bottom:10px;color:var(--text-1)}
    .modal-body{font-size:14px;color:var(--text-2);margin-bottom:18px;line-height:1.6}

    /* ===== 左侧导航栏 nav-rail（取代底部皮肤胶囊，§1） ===== */
    /* BUG-001：不再垂直居中，改为贴近顶部 Banner 下缘（app-shell padding-top 58px → 留 6px 间隙） */
    .nav-rail{position:fixed;left:0;top:64px;transform:none;display:flex;flex-direction:column;align-items:flex-start;gap:10px;z-index:42;padding:6px 0}
    .nav-rail button{position:relative;border:none;border-radius:0 14px 14px 0;width:58px;padding:14px 6px;min-height:96px;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
      color:#fff;font-size:13px;font-weight:600;line-height:1.25;letter-spacing:1px;
      transition:transform .18s ease,box-shadow .18s ease,background .18s ease,filter .18s ease,width .2s ease;
      box-shadow:2px 2px 10px rgba(0,0,0,.18);filter:brightness(.82)}
    .nav-rail button .rail-ico{width:22px;height:22px}
    .nav-rail button:hover{filter:brightness(.95);width:66px}
    .nav-rail button.active{width:74px;box-shadow:5px 4px 18px rgba(0,0,0,.32);filter:brightness(1.05)}
    .nav-rail button .rail-label{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap}
    /* 选中模块时按钮展开：竖排窄条 → 横排长条（图标 + 横排文字） */
    .nav-rail button.expanded{width:132px;min-height:56px;padding:10px 16px;flex-direction:row;justify-content:flex-start;gap:10px;
      box-shadow:5px 4px 18px rgba(0,0,0,.32);filter:brightness(1.06)}
    .nav-rail button.expanded:hover{width:132px}
    .nav-rail button.expanded .rail-label{writing-mode:horizontal-tb;text-orientation:mixed;letter-spacing:1px}
    /* BUG-001：手机小屏下落地宣传卡片右移错开，避开左侧 nav-rail（展开按钮宽 132px，留间隙） */
    @media (max-width:480px){
      .landing-hero{margin-left:150px;margin-right:auto}
    }

    /* ===== HUB 入口卡（REQ-038：竖向单列 + 横向卡片） ===== */
    .hub-title{font-size:22px;font-weight:700;color:var(--text-1);margin:4px 0 14px;display:flex;align-items:center;gap:8px}
    .hub-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
    .hub-card{position:relative;display:flex;flex-direction:row;align-items:center;gap:14px;width:100%;box-sizing:border-box;padding:16px 18px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--border);cursor:pointer;overflow:hidden;transition:transform .14s,box-shadow .2s}
    .hub-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(26,33,56,.18)}
    .hub-card .hc-bar{position:absolute;left:0;top:0;bottom:0;width:5px;height:100%}
    .hub-card .hc-ico{flex:none;width:34px;height:34px;color:var(--skin-accent)}
    .hub-card .hc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
    .hub-card .hc-name{font-size:17px;font-weight:700;color:var(--text-1)}
    .hub-card .hc-sub{font-size:12px;color:var(--text-3);line-height:1.5}
    .hub-card.disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.4)}
    .hub-card.disabled:hover{transform:none;box-shadow:none}

    /* ===== BUG-006：档案可选卡片（星座 / MBTI 选档案用，含明显选中态） ===== */
    .step-hint{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;margin:2px 0 10px;color:var(--text-3)}
    .step-hint .sh{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--radius-pill);background:var(--paper);border:1px solid var(--border);line-height:1.5}
    .step-hint .sh.cur{background:var(--skin-accent-soft);border-color:var(--skin-accent);color:var(--skin-accent);font-weight:600}
    .step-hint .sh-arr{color:var(--text-3);opacity:.75}
    .case-opts{display:flex;flex-direction:column;gap:8px;margin:4px 0 10px}
    .case-opt{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;text-align:left;padding:11px 13px;border-radius:var(--radius-md);background:var(--surface);border:1.5px solid var(--border);cursor:pointer;font-family:inherit;transition:border-color .14s,background .14s,box-shadow .14s;line-height:1.4}
    .case-opt:hover{border-color:var(--skin-accent);background:var(--skin-accent-soft)}
    .case-opt.sel{border-color:var(--skin-accent);background:var(--skin-accent-soft);box-shadow:inset 0 0 0 1px var(--skin-accent)}
    .case-opt .co-main{flex:1;min-width:0}
    .case-opt .co-name{display:block;font-size:15px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .case-opt .co-meta{display:block;font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* REQ-056①：档案卡片「已测 MBTI 类型」标签（未测=灰字「未测试」） */
    .case-opt .co-type{display:inline-block;margin-top:3px;font-size:11px;line-height:1.5;color:var(--skin-accent);background:var(--skin-accent-soft);border:1px solid var(--skin-accent);padding:1px 7px;border-radius:var(--radius-pill);font-weight:700}
    .case-opt .co-type.none{color:var(--text-3);background:transparent;border-color:transparent;padding:1px 2px;font-weight:400}
    .case-opt .co-check{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .14s}
    .case-opt.sel .co-check{border-color:var(--skin-accent);background:var(--skin-accent);color:var(--skin-accent-ink)}

    /* ===== 通用卡片 / 标签 ===== */
    .tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--skin-accent-soft);color:var(--skin-accent)}
    .pay-hint{font-size:12px;color:var(--text-2);background:var(--skin-accent-soft);border-radius:var(--radius-sm);padding:6px 10px;margin-top:8px}
.tag.sel{background:var(--skin-accent);color:var(--skin-accent-ink)}
.interp-title{font-size:14px;font-weight:700;color:var(--skin-accent);margin-top:14px}
.interp-body{font-size:13px;color:var(--text-2);line-height:1.8;white-space:pre-wrap;background:var(--skin-accent-soft);border-radius:var(--radius-sm);padding:10px 12px;margin-top:6px}
    .row-gap{display:flex;gap:10px;flex-wrap:wrap}
    .back-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

    /* ===== 生肖流年 ===== */
    .zodiac-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .zodiac-cell{padding:12px 4px;text-align:center;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:600;color:var(--text-1);transition:.14s}
    .zodiac-cell .zodiac-medallion{display:block;margin:0 auto 2px}
    .zodiac-cell.sel{background:var(--skin-accent);color:var(--skin-accent-ink);border-color:var(--skin-accent)}
    .taisui-card{text-align:center;border:1.5px solid var(--cinnabar);border-radius:var(--radius-lg);padding:16px;background:rgba(178,58,58,.05)}
    .noble-card{text-align:center;border-radius:var(--radius-lg);padding:14px;background:var(--skin-accent-soft);color:var(--skin-accent);font-weight:600}
    .rel-card{border-radius:var(--radius-lg);padding:14px;font-weight:600}
    .rel-good{background:rgba(62,124,107,.14);color:var(--skin-accent)}
    .rel-risk{background:rgba(178,58,58,.12);color:var(--cinnabar)}
    .rel-neutral{background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
    .signal-list{display:flex;flex-direction:column;gap:8px}
    .signal-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text-2)}
    .conflict-tag{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
    .c-zhi{background:#B23A3A}.c-chong{background:#E08A2B}.c-xing{background:#5B4B8A}.c-hai{background:#3B7BB0}.c-po{background:#8A93A6}

    /* REQ-052：生肖流年档案下拉 */
    .zodiac-pick-hint{font-size:12.5px;color:var(--text-2);margin-top:10px;line-height:1.8}
    .zodiac-pick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    /* BUG-003：五行关系明细行 */
    .zrel{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:baseline}
    .zrel:last-child{border-bottom:none}
    .zrel .zl{flex:none;width:92px;color:var(--text-3)}
    .zrel .zv{flex:1;min-width:0;color:var(--text-1);font-weight:600;line-height:1.75;word-break:break-all}
    /* C6：五行关系 / 风险关系 通用解读小字（确定性，零 LLM） */
    .zrel-guide{font-size:12px;color:var(--text-3);line-height:1.85;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);text-align:left}
    /* 生肖流年：结果卡标题两侧年份切换箭头（← / →；仅出结果即 data 非空时随标题渲染） */
    .zodiac-year-arrow{width:36px;height:36px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border);background:var(--paper);color:var(--text-2);font-size:19px;font-weight:700;line-height:1;cursor:pointer;transition:.14s;font-family:inherit;padding:0}
    .zodiac-year-arrow:hover:not(:disabled){border-color:var(--skin-accent);color:var(--skin-accent);background:var(--skin-accent-soft)}
    .zodiac-year-arrow:disabled{opacity:.4;cursor:not-allowed}
    /* 五行关系合并卡：色块标题区（五行关系 + classification + C1 一句话解读） */
    .wx-hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px;letter-spacing:.12em;opacity:.85;font-weight:700}
    .wx-hd .wx-cls{font-size:16px;font-weight:800;letter-spacing:.02em;opacity:1}
    .wx-s{font-size:12.5px;font-weight:500;line-height:1.85;margin-top:7px;opacity:.95;word-break:break-word}
    .zrel-box{margin-top:12px}
    /* 贵人色块内 C2 贵人静态解读（nobleDetail 有内容才渲染） */
    .noble-sub{margin-top:10px;padding:8px 10px;text-align:left;font-size:12px;font-weight:500;line-height:1.85;color:var(--skin-accent);background:rgba(255,255,255,.5);border-radius:8px}

    /* ===== 临时起卦 ===== */
    .method-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
    .method-cell{padding:16px 10px;text-align:center;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:.14s}
    .method-cell .mn{font-weight:700;color:var(--text-1);font-size:15px}
    .method-cell .md{font-size:11px;color:var(--text-3);margin-top:3px}
    .method-cell.sel{background:var(--skin-accent);color:var(--skin-accent-ink);border-color:var(--skin-accent)}
    .method-cell.todo{opacity:.5;cursor:not-allowed}
    .yao-line{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-1);padding:4px 0}
    /* BUG-004: 爻线图形不依赖 ::before/::after 伪元素，改用 background linear-gradient 绘制：
       阳爻(.yao-bar 默认/.old-yang)= 全长实线；阴爻(.yin/.old-yin)= 左22px + 中10px空隙 + 右22px 双短线；老阳金色、老阴朱砂 */
    .yao-bar{height:6px;width:54px;border-radius:3px;background:var(--ink-300);flex:0 0 auto}
    .yao-bar.old-yang{background:var(--gold-500)}
    .yao-bar.yin{background:linear-gradient(to right,var(--ink-300) 0 22px,transparent 22px 32px,var(--ink-300) 32px 54px)}
    .yao-bar.old-yin{background:linear-gradient(to right,var(--cinnabar) 0 22px,transparent 22px 32px,var(--cinnabar) 32px 54px)}
    .palm-disk{width:200px;height:200px;border-radius:50%;margin:14px auto;position:relative;background:radial-gradient(circle,var(--skin-accent-soft),transparent 70%);border:2px solid var(--skin-accent)}
    .palm-disk .pd-point{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--skin-accent);color:var(--skin-accent-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transform:translate(-50%,-50%);left:50%;top:50%}
    .palm-disk .pd-point.hit{box-shadow:0 0 0 4px var(--gold-500)}

    /* ===== REQ-055：六爻分列布局（爻位|爻象|六亲|纳甲|世应|阴阳|六神） ===== */
    .ly-wrap{overflow-x:auto;margin-top:4px}
    .ly-grid{display:flex;flex-direction:column;min-width:600px}

      el('span', {style: {fontSize: 12, color: 'var(--text-2)', fontWeight: 600}}, '分享测试链接'),
      el('input', {readOnly: true, value: shareUrl, onFocus: e => e.target.select(), title: shareUrl,

      el('button', {type: 'button', className: 'btn btn-outline', style: {width: 'auto', flex: 'none', fontSize: 13}, onClick: copyShare}, '复制'))
    : el(React.Fragment, null,
        shareErr ? el('div', {className: 'error', style: {width: '100%', textAlign: 'left', margin: '0 0 4px'}}, shareErr) : null,
        el('span', {style: {fontSize: 12, color: 'var(--text-2)', fontWeight: 600}}, '分享测试链接'),
        el('button', {type: 'button', className: 'btn btn-outline', style: {width: 'auto', fontSize: 13}, onClick: shareResult}, shareLoading ? '生成中…' : '生成分享链接')),
    el('div', {style: {fontSize: 11, color: 'var(--text-3)', lineHeight: 1.6, width: '100%'}},
      '生成该档案专属链接：他人免登录填写后，档案当前 MBTI 结果将更新为最新填写内容，各次填写保留可回看。'));
  // —— 结果页主体 ——
  let body;
  if (view === 'grid') {
    body = el('div', {className: 'card'},
      el('div', {className: 'section-title'}, '选择你的人格类型'),
      el('div', {className: 'grid16'}, ALL_TYPES.map(t =>
        el('div', {key: t, className: 'g', onClick: () => pickType(t)}, t))),

        el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => setView('quiz')}, '返回答题')) : qErrored ? el('div', {className: 'back-row'},
        el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => {
          setView('quiz');
          load();
        }}, '返回重试题库')) : null);
  } else if (view === 'result' && result) {
    const t = result.type || 'INTJ';

          el('div', {className: 'error'}, caseErrored),
          el('div', {className: 'back-row', style: {justifyContent: 'center'}},

      } else if (!caseList.length) {
        gate = el('div', {className: 'card', style: {textAlign: 'center', padding: '22px 16px'}},
          el('div', {style: {fontSize: 15, fontWeight: 700, marginBottom: 8}}, '请先在国学预测中建档'),

          el('div', {className: 'back-row', style: {justifyContent: 'center'}},
            el('button', {className: 'btn btn-primary', style: {width: 'auto'}, onClick: () => onNavigate('onboarding', {returnTo: 'mbti'})}, '去建档'),
            el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => onNavigate('cases')}, '管理档案'),
            el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => setView('grid')}, '我已知道类型，直接输入')));
      } else {

        const selCase = caseId != null ? (caseList.find(c => Number(c.caseId) === Number(caseId)) || null) : null;
        const selNm = selCase ? (selCase.name || '档案 ' + selCase.caseId) : '';
        const selTval = selCase ? caseTypeOf(selCase) : ''; // 已测类型：非空才展示「查看已完成 MBTI 类型」按钮
        gate = el(React.Fragment, null,
          el('div', {className: 'card'},
            el('div', {className: 'section-title'}, '选择档案 · MBTI 判型'),
            el('div', {style: {fontSize: 11, color: 'var(--text-3)', lineHeight: 1.7, marginBottom: 6}}, '判型结果将写入所选档案的 mbti_type。勾选档案后不会自动进入答题或结果页，请从下方操作区选择「开始测试」或「查看已完成 MBTI 类型」（已测档案才显示）。'),
            el('div', {className: 'step-hint'},
              el('span', {className: 'sh cur'}, '① 选择档案'),
              el('span', {className: 'sh-arr'}, '→'),
              el('span', {className: 'sh'}, '② 开始测试 / 查看已完成类型')),
            el('div', {className: 'case-opts'},
              caseList.map(c => {
                const sel = caseId != null && Number(caseId) === Number(c.caseId);

                const nm = c.name || '档案 ' + c.caseId;
                const tval = caseTypeOf(c); // 已测类型 / ''=已确认未测 / null=探测中
                const typeNode = tval ? el('span', {className: 'co-type'}, '已测 ' + tval)
                  : (tval === null && typeLoading) ? el('span', {className: 'co-type none'}, '检测中…')
                  : el('span', {className: 'co-type none'}, '未测试');
                return el('button', {key: c.caseId, type: 'button', className: 'case-opt' + (sel ? ' sel' : ''), onClick: () => { setStarted(false); setCaseId(c.caseId); }},
                  el('span', {className: 'co-main'},
                    el('span', {className: 'co-name'}, nm),
                    typeNode,
                    el('span', {className: 'co-meta'}, meta)),
                  el('span', {className: 'co-check'}, sel ? '✓' : ''));
              }))),
          // —— REQ-056②④ 操作区：勾选档案（caseId 非空）后出现完整操作；「分享测试链接」
          // 仅在此操作区展示（不再顶部常驻），仍复用 shareResult/copyShare/shareUrl/shareErr ——
          el('div', {className: 'card', style: {marginTop: 10}},
            el('div', {className: 'section-title'}, '档案操作'),
            selCase ? el(React.Fragment, null,
              el('div', {style: {fontSize: 12, color: 'var(--text-2)', lineHeight: 1.6, marginBottom: 10}}, '已选档案：' + selNm),
              el('div', {style: {display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', width: '100%', paddingBottom: 10, marginBottom: 10, borderBottom: '1px dashed var(--border)'}}, shareZone))
              : el('div', {style: {fontSize: 12, color: 'var(--text-3)', lineHeight: 1.6, marginBottom: 10}}, '请先勾选上方一份档案：勾选后停留本操作区，可点「开始测试」答题；已测档案可再点「查看已完成 MBTI 类型」回看结果（不自动进入）。'),
            el('div', {className: 'back-row', style: {justifyContent: 'center', margin: 0}},
              el('button', {className: 'btn btn-primary', style: {width: 'auto'}, disabled: !selCase, title: selCase ? '' : '请先勾选档案', onClick: () => setStarted(true)}, UI_COPY.buttons.start_quiz),
              selTval ? el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: viewExisting}, '查看已完成 MBTI 类型') : null,
              el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => setView('grid')}, '我已知道类型，直接输入'),
              el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => onNavigate('onboarding', {returnTo: 'mbti'})}, UI_COPY.buttons.create_case),
              el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => onNavigate('cases')}, '管理档案'))));
      }
      body = gate;
    } else {
      const answered = Math.min(answers.length, total);
      const pct = total ? Math.round(answered / total * 100) : 0;
      body = el('div', {className: 'card'},
        el('div', {style: {display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 6, fontSize: 12, color: 'var(--text-3)', marginBottom: 2}},
          el('span', null, '第 ' + (idx + 1) + ' / ' + total + ' 题'),
          el('span', {style: {display: 'flex', gap: 10, alignItems: 'center'}},
            el('button', {style: {fontSize: 12, color: 'var(--skin-accent)', fontWeight: 600}, onClick: pickAnother}, '更换档案'),
            el('button', {style: {fontSize: 12, color: 'var(--skin-accent)', fontWeight: 600}, onClick: () => setView('grid')}, '我已知道类型，直接输入'))),
        el('div', {className: 'mbti-progress'}, el('i', {style: {width: pct + '%'}})),
        scoring ? el('div', {style: {textAlign: 'center', color: 'var(--text-2)', padding: '18px 0'}}, '判型中…') : el(React.Fragment, null,
          el('div', {style: {fontSize: 17, fontWeight: 700, color: 'var(--text-1)', lineHeight: 1.6, margin: '10px 0'}}, cur.text),
          el('div', {style: {display: 'flex', flexDirection: 'column', gap: 10}},
            (cur.options || []).map(o => el('button', {key: o.key, className: 'btn btn-outline', onClick: () => choose(o.key)}, o.key + '. ' + o.text))),
          el('div', {className: 'back-row'},
            idx > 0 ? el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => setIdx(idx - 1)}, '上一题') : null,
            el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => {
              setIdx(0);
              setAnswers([]);
              setScoreErr('');
            }}, '重新开始'))),
        scoreErr ? el('div', {className: 'card failed-box', style: {margin: '10px 0 0'}},
          el('div', {className: 'section-title'}, '判型失败'),
          el('div', {className: 'error'}, scoreErr),
          el('div', {className: 'back-row', style: {justifyContent: 'center'}},
            el('button', {className: 'btn btn-primary', style: {width: 'auto'}, onClick: () => submitScore(answers)}, '重试判型'),
            idx > 0 ? el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => setIdx(idx - 1)}, '返回上一题') : null,
            el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: reset}, '重新开始'))) : null);

  return el('div', {className: 'container'},
    el('div', {className: 'hub-title'}, el(Icon, {name: 'spark', size: 22}), ' MBTI 人格测试'),
    el('div', {style: {fontSize: 12, color: 'var(--text-3)', marginBottom: 4}}, '16 型人格测评 · 60 题 · 判型与文案由后端接口提供'),
    body);
}

/* ---------- REQ-047：免登录分享答题页（/mbti/share/{token} 直达 · 公开免登录） ---------- */
function MbtiSharePage({
  token,
  onNavigate
}) {
  const el = React.createElement;
  const [caseName, setCaseName] = useState('');
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState([]); // [{question_id, choice}]
  const [scoring, setScoring] = useState(false);
  const [result, setResult] = useState(null); // {type, scores}
  const [loading, setLoading] = useState(true);
  const [errored, setErrored] = useState('');
  const total = questions && questions.length ? questions.length : 0;
  // BUG-009 加固①：token 判空/去空白 —— 直接访问 /mbti/share 无 token、或 token 在路由/传参环节
  // 丢失时，立即按「分享链接无效」渲染（见下方 !tk 分支），绝不发起 /mbti/share/undefined 之类请求。
  const tk = token && String(token).trim() ? String(token).trim() : '';
  const base = tk ? '/mbti/share/' + encodeURIComponent(tk) : null;
  // —— 拉取分享题库（GET /api/mbti/share/{token}，免登录；BUG-011：noAuth 强制不带 Authorization）——
  useEffect(() => {
    let alive = true;
    if (!tk) {
      setLoading(false);
      setErrored('分享链接无效');
      return () => { alive = false; };
    }
    (async () => {
      setLoading(true);
      setErrored('');
      try {
        const res = await api(base, {noAuth: true});
        const d = res && res.data || res || {};
        const list = d.questions || [];
        if (!list.length) throw new Error('题库为空');
        if (alive) {
          setCaseName(d.case_name || '');
          setQuestions(list);
        }
      } catch (e) {
        // 404（code1002）/ 网络失败 → 统一按「链接失效」提示
        if (alive) setErrored('分享链接不存在或已失效');
      } finally {
        if (alive) setLoading(false);
      }
    })();
    return () => {
      alive = false;
    };
  }, [tk]);
  // —— 提交答案并判型（POST /api/mbti/share/{token}/score，免登录；BUG-011：noAuth 强制不带 Authorization）——
  const submitShare = async list => {
    if (!list || !total || list.length !== total) return;
    setScoring(true);
    try {
      const res = await api(base + '/score', {
        method: 'POST',
        noAuth: true,
        body: JSON.stringify({
          answers: list
        })
      });
      const d = res && res.data || res || {};
      if (!d || !d.type) throw new Error(d && d.message || '判型失败，请重试。');
      setResult({
        type: d.type,
        scores: d.scores || {}
      });
    } catch (e) {
      // 保留在最后一题，用户可重新点选项重试
      toast(e && e.message || '判型失败，请重试。');
    } finally {
      setScoring(false);
    }
  };
  // 点击选项：记录该题答案并自动下一题；最后一题则自动提交判型
  const choose = key => {
    if (scoring || !total) return;
    const q = questions[idx];
    if (!q) return;
    const next = answers.slice();
    next[idx] = {
      question_id: q.id,
      choice: key
    };
    setAnswers(next);
    if (idx + 1 < total) setIdx(idx + 1); else submitShare(next);
  };
  // —— 再测一次：清空答案与结果 ——
  const reset = () => {
    setIdx(0);
    setAnswers([]);
    setScoring(false);
    setResult(null);
    setErrored('');
  };
  let body;
  if (!tk) {
    // BUG-009 加固①（渲染兜底）：token 为空/缺失 → 不等 effect、不闪 loading，直接渲染「无法打开分享」
    body = el('div', {className: 'card failed-box'},
      el('div', {className: 'section-title'}, '无法打开分享'),
      el('div', {className: 'error'}, '分享链接无效（缺少链接参数）'),
      el('div', {className: 'back-row', style: {justifyContent: 'center'}},
        el('button', {className: 'btn btn-primary', style: {width: 'auto'}, onClick: () => onNavigate('landing')}, '回到首页')));
  } else if (result) {
    const t = result.type || 'INTJ';
    // —— 单维双向比例条（复用 MbtiPage 视觉）——
    const bar = d => {
      const s = result.scores ? result.scores[d.k] || {} : {};
      const lc = s[d.l] || 0;
      const rc = s[d.r] || 0;
      const sum = lc + rc || 1;
      const lp = Math.round(lc / sum * 100);
      const rp = 100 - lp;
      return el('div', {key: d.k, className: 'mbti-bar'},
        el('span', {className: 'bb-label', style: {width: 'auto', minWidth: 44, textAlign: 'left'}}, d.l + ' ' + lc),
        el('span', {className: 'bb-track'},
          el('span', {className: 'bb-fill', style: {left: 0, width: lp + '%', background: 'var(--skin-accent)'}}),
          el('span', {className: 'bb-fill', style: {right: 0, width: rp + '%', background: 'var(--skin-accent-soft)'}})),
        el('span', {className: 'bb-label', style: {width: 'auto', minWidth: 44, textAlign: 'right'}}, d.r + ' ' + rc));
    };
    const barsCard = result.scores ? el('div', {className: 'card'},
      el('div', {className: 'section-title'}, '四维倾向（各维度答题数）'),
      MBTI_DIMS.map(bar)) : null;
    // 简化展示：大字类型 + 「结果已记录」；如需完整五栏文案可在后续复用 GET /api/mbti/types/{type}
    body = el(React.Fragment, null,
      el('div', {className: 'card', style: {textAlign: 'center'}},
        el('div', {className: 'mbti-type-big'}, t),
        el('div', {className: 'mbti-alias'}, caseName ? '已完成「' + caseName + '」的测评 · 结果已记录' : '测评完成 · 结果已记录')),
      barsCard,
      el('div', {className: 'back-row', style: {justifyContent: 'center'}},
        el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: reset}, '再测一次'),
        el('button', {className: 'btn btn-outline', style: {width: 'auto'}, onClick: () => onNavigate('landing')}, '回到首页')));
  } else if (loading) {
    body = el('div', {className: 'card', style: {textAlign: 'center', color: 'var(--text-2)', padding: '28px 16px'}}, '分享题库加载中…');
  } else if (errored) {
    body = el('div', {className: 'card failed-box'},
      el('div', {className: 'section-title'}, '无法打开分享'),
      el('div', {className: 'error'}, errored),
      el('div', {className: 'back-row', style: {justifyContent: 'center'}},
        el('button', {className: 'btn btn-primary', style: {width: 'auto'}, onClick: () => onNavigate('landing')}, '回到首页')));
  } else if (!total) {
    body = el('div', {className: 'card failed-box'}, el('div', {className: 'section-title'}, '题库为空'));
