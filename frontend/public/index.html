// 前端默认值见 SETTINGS_DEFAULTS；未登录或接口失败一律用前端默认值（登录后由 App 拉取覆盖）。

const SETTINGS_DEFAULTS = {
  anim_enabled: true,
  default_mode: 'auto', // 'auto'=默认项目起卦/抽卡（现状）| 'manual'=默认手动快速填写 | 'both'=两入口并行不设默认
  banner_dropdown: false,
  share_mingli_ui: true,
  bg_enabled: true,
  card_images: true,
  agent_enabled: true
};
const SETTINGS_KEYS = Object.keys(SETTINGS_DEFAULTS);
const ML_SETTINGS = Object.assign({}, SETTINGS_DEFAULTS);
(function installMlAliases() {
  const map = {
    anim_enabled: 'animEnabled',
    default_mode: 'defaultMode',
    banner_dropdown: 'bannerDropdown',
    share_mingli_ui: 'shareMingliUi',
    bg_enabled: 'bgEnabled',
    card_images: 'cardImages',
    agent_enabled: 'agentEnabled'
  };
  Object.keys(map).forEach(function (k) {
    Object.defineProperty(ML_SETTINGS, map[k], {
      enumerable: false,
      configurable: true,
      get: function () { return ML_SETTINGS[k]; }

})();
// 服务端原始值 → 前端规范化设置对象（未知/缺失字段回退默认值；default_mode 白名单校验）
function normalizeMlSettings(raw) {
  const out = Object.assign({}, SETTINGS_DEFAULTS);
  if (raw && typeof raw === 'object') {
    SETTINGS_KEYS.forEach(function (k) {
      const v = raw[k];
      if (k === 'default_mode') {
        if (v === 'auto' || v === 'manual' || v === 'both') out[k] = v;
      } else if (typeof v === 'boolean') {
        out[k] = v;
      }
    });
  }
  return out;
}
function shallowEqMl(a, b) {
  for (let i = 0; i < SETTINGS_KEYS.length; i++) {
    if (a[SETTINGS_KEYS[i]] !== b[SETTINGS_KEYS[i]]) return false;
  }
  return true;
}
// ② 默认模式助手：manual=默认停在手动录入入口；auto=自动起卦/抽卡（现状）；
// both=两入口并行、不强行设默认 → 每次打开保留上次所选（返回 keepCurrent 原值）。
function mlAskNextDefault(keepCurrent) {

}
// BUG-011：MBTI 分享落地页（/mbti/share 或 /mbti/share/{token}）是公开免登录入口，
// 访客会话必须与分享者隔离：分享页期间全局 token/refreshToken 一律置空（绝不写回
// localStorage），使任何 api() 请求都不携带分享者 Authorization；离开分享页时若有
// 本地 token（同浏览器本人）再恢复正常会话。
function isMbtiSharePath(p) {
  p = String(p || '');
  return /^\/mbti\/share\/?$/.test(p) || /^\/mbti\/share\//.test(p);
}
function switchShareGuestSession(entering) {
  if (entering) {
    // 进入分享落地页：置空内存会话（访客态标记即「空 token」，不触碰 localStorage）
    token = '';
    refreshToken = '';
    return;
  }
  // 离开分享落地页：若内存仍为空且有本地 token（同浏览器本人），恢复正常会话；
  // 无本地 token 的访客维持未登录，受限操作由 BUG-002 拦截引导去登录页。
  if (token) return;
  let saved = null;
  try {
    saved = localStorage.getItem('mingli_token');
  } catch (e) {
    saved = null;
  }
  if (saved) {
    token = saved;
    try {
      refreshToken = localStorage.getItem('mingli_refresh_token') || '';
    } catch (e) {
      refreshToken = '';
    }
  }
}

function isCaseSharePath(p) {
  p = String(p || '');
  return /^\/case\/share\/?$/.test(p) || /^\/case\/share\//.test(p);
}
// 分享落地页页名（mbti-share / case-share）判定：App 内页切换/前进后退跨越分享页时统一切换访客会话
function isGuestSharePageName(p) {

}
// ===== REQ-092：新用户建档强制门禁（登录账号 0 档案 → 强制先新建档案） =====
// 触发条件（一律以 GET /cases 实时校验为准）：新注册 / 删光全部 / 无档案存量账号 = 0 档即强制；
// ≥1 档案 → 放行。强制期全部功能入口（含 landing、各 HUB、功能设置、王先生等不依赖档案的
// 功能也一并拦截）重定向到新建档案 onboarding；仅放行 onboarding/auth 与分享帮填访客页
// （/case/share、/mbti/share 未登录访客不受门禁影响）。
// 状态机：null=本会话未决（未登录 / 尚未校验），true=0 档强制中，false=≥1 档放行。
// 关键点重校验：登录/注册成功（AuthPage）、启动带 token（App 首挂载 effect）、删光档案
// （CasesPage）；建档成功 ≥1 档即置 false 解锁（OnboardingPage）。校验失败不误锁（按放行处理）。
// 未完成建档关闭页面/退出登录：下次启动/登录仍会因 0 档被重新强制回到新建档案，无需额外持久化。
let forceOnboarding = null;

// REQ-092 校验器：GET /cases 判档案数 → 更新 forceOnboarding；false→true 转换时补埋点一次
// （事件名沿用全局 snake_case 风格：force_onboarding）。未登录直接复位不校验。
async function checkCaseGate() {
  if (!token) {
    forceOnboarding = null;
    return;
  }
  let list = null;
  try {
    const res = await api('/cases', {
      method: 'GET'
    });
    list = res && res.data && res.data.cases || (res && res.cases) || [];
  } catch (e) {
    // 拉取失败 / 会话过期（api() 401 已清 token 并跳登录页）：不误锁 —— 仍登录按放行，否则复位
    forceOnboarding = token ? false : null;
    return;
  }
  const hasCase = Array.isArray(list) && list.length >= 1;
  if (hasCase) {
    forceOnboarding = false;
    return;
  }
  if (forceOnboarding !== true) {
    // 0 档 → 进入强制建档门禁（仅 false→true 转换打一次埋点，避免重复触发重复上报）
    forceOnboarding = true;
    track('force_onboarding', {
      cases: 0
    });
  }
}

// ---- 埋点（批量防抖，异步不阻塞，失败静默）----
let _trackQueue = [];
let _trackTimer = null;
function _sessionId() {
  let s = localStorage.getItem('mingli_session_id');
  if (!s) {
    s = window.crypto && crypto.randomUUID ? crypto.randomUUID() : 's' + Date.now();
    localStorage.setItem('mingli_session_id', s);
  }
  return s;
}
function _flushTrack() {
  if (!_trackQueue.length) return;
  const batch = _trackQueue.splice(0, _trackQueue.length);
  const payload = JSON.stringify({
    events: batch.map(e => ({
      event_name: e.n,
      props: e.p,
      session_id: _sessionId()
    }))
  });
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(API + '/events', new Blob([payload], {
        type: 'application/json'
      }));
    } else {
      fetch(API + '/events', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: payload,
        keepalive: true
      }).catch(() => {});
    }
  } catch (e) {/* 埋点失败静默 */}
}
function track(name, props) {
  _trackQueue.push({
    n: name,
    p: props || {}
  });
  if (_trackQueue.length >= 10) {
    clearTimeout(_trackTimer);
    _trackTimer = null;
    _flushTrack();
  } else if (!_trackTimer) {
    _trackTimer = setTimeout(() => {
      _trackTimer = null;
      _flushTrack();
    }, 2000);
  }
}

// 设备指纹（注册专用，提交到后端 device_fingerprint 字段，可空）：
//   canvas 渲染特征（文字+图形 → toDataURL → djb2 散列） + UA + 时区 → base64，总长 ≤ 128。
// 全程 try/catch：任一步失败即降级（缺失项留空 / 仅 UA+时区），最终兜底返回空串，不抛错、不阻塞注册。
function generateDeviceFingerprint() {
  // 1) Canvas 指纹：画背景/文字/图形后读 toDataURL 的 base64 段，整串 djb2 散列成 8 位十六进制
  //    （任何像素/抗锯齿/字体渲染差异都会传导到散列；canvas 不可用则此段留空）
  let canvasPart = '';
  try {
    const c = document.createElement('canvas');
    c.width = 280;
    c.height = 72;
    const g = c.getContext ? c.getContext('2d') : null;
    if (g) {
      g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--paper'); /* hardcode-allow: Canvas 2D API 不支持 var() */
      g.fillRect(0, 0, c.width, c.height);
      g.font = 'bold 18px "Songti SC",serif';
      g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink-500'); /* hardcode-allow: Canvas 2D API 不支持 var() */
      g.fillText('Mingli\u2605\u592a\u521d\u6307\u7eb9', 12, 12);
      g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--gold-500'); /* hardcode-allow: Canvas 2D API 不支持 var() */
      g.lineWidth = 2;
      g.strokeRect(120, 24, 60, 30);
      g.beginPath();
      g.arc(220, 39, 16, 0, Math.PI * 2);
      g.stroke();
      const dataUrl = c.toDataURL('image/png');
      const comma = dataUrl.indexOf(',');
      const b64 = comma >= 0 ? dataUrl.slice(comma + 1) : dataUrl;
      let h = 5381;
      for (let i = 0; i < b64.length; i++) h = (h * 33 ^ b64.charCodeAt(i)) >>> 0;
      canvasPart = h.toString(16);
    }
  } catch (e) {
    canvasPart = ''; // canvas 被禁用/异常 → 降级为仅 UA+时区
  }
  // 2) UA / 时区（各自独立 try/catch，失败留空）
  let ua = '';
  try {
    // 清除孤立代理项：避免个别异常 UA 字符令 encodeURIComponent 抛错，从而整个指纹降级为空
    ua = String(navigator.userAgent || '').replace(/[\uD800-\uDFFF]/g, '?');
  } catch (e) {
    ua = '';
  }
  let tz = '';
  try {
    tz = String(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
  } catch (e) {
    tz = '';
  }
