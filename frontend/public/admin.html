<html lang="zh-CN">
<head>

  <title>太初 · 后台管理</title>
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <style>
    :root{
      /* 国学皮肤配色（与 C 端一致） */
      --jade:#3E7C6B; --jade-deep:#2F5F52; --jade-soft:rgba(62,124,107,.12);
      --cinnabar:#B23A3A; --cinnabar-soft:rgba(178,58,58,.08);
      --paper:#F7F4EC; --card:#FFFFFF; --line:#E5E0D4;
      --ink-1:#1F1F26; --ink-2:#5C5C68; --ink-3:#8A8A94;
      --gold:#B8893E;
      --font-serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
      --font-sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Hiragino Sans GB",sans-serif;
      --radius-s:6px; --radius-m:10px; --radius-l:14px;
      --shadow:0 2px 10px rgba(26,33,56,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{font-family:var(--font-sans);color:var(--ink-1);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
    button{font-family:inherit;cursor:pointer;border:none;background:none}
    input,select,textarea{font-family:inherit}
    a{color:inherit}

    /* 顶栏（玉青） */
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      padding:10px 20px;background:var(--jade);color:#F7F4EC;box-shadow:0 2px 12px rgba(26,33,56,.16)}
    .brand{font-family:var(--font-serif);font-weight:700;font-size:19px;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
    .brand .dot{color:#F7F4EC;opacity:.75;font-size:12px}
    .brand .sub{font-family:var(--font-sans);font-size:12px;font-weight:400;opacity:.85}
    .top-right{display:flex;align-items:center;gap:10px}
    .role-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.35);padding:4px 12px;border-radius:999px;color:#F7F4EC}
    .role-chip b{font-weight:600}
    .logout-btn{font-size:13px;color:#F7F4EC;border:1px solid rgba(255,255,255,.55);border-radius:8px;
      padding:5px 14px;transition:.18s}
    .logout-btn:hover{background:var(--cinnabar);border-color:var(--cinnabar)}

    /* 主体左右布局：侧栏 + 内容 */
    .admin-body{display:flex;align-items:flex-start;min-height:calc(100vh - 54px)}
    .sidebar{flex:0 0 200px;background:var(--card);border-right:1px solid var(--line);min-height:calc(100vh - 54px);padding:18px 12px}
    .side-title{font-size:11px;color:var(--ink-3);letter-spacing:.1em;margin:0 8px 10px;text-transform:uppercase}
    .nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;margin-bottom:4px;
      border-radius:var(--radius-m);font-size:14px;color:var(--ink-2);transition:.16s}
    .nav-item:hover{background:var(--paper);color:var(--jade-deep)}
    .nav-item.active{background:var(--jade);color:#F7F4EC;font-weight:600}
    .nav-item .nav-icon{flex:none;font-size:15px}
    .admin-main{flex:1;min-width:0;padding:22px 26px 48px}
    .page-title{font-family:var(--font-serif);font-size:21px;font-weight:700;color:var(--jade-deep);margin-bottom:4px}
    .page-desc{font-size:12.5px;color:var(--ink-3);margin-bottom:16px}
    .view-enter{animation:viewEnter .3s ease both}
    @keyframes viewEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    /* 卡片 / 通用控件 */
    .card{background:var(--card);border:1px solid rgba(26,33,56,.05);border-radius:var(--radius-l);
      box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
    .card h3{margin:0 0 10px;font-size:15px;color:var(--jade-deep);font-weight:600}
    .section-title{font-size:13.5px;font-weight:600;color:var(--jade-deep);margin:14px 0 8px;display:flex;align-items:center;gap:6px}
    .section-title::before{content:"";width:3px;height:13px;background:var(--jade);border-radius:2px}
    .btn{padding:9px 18px;border-radius:var(--radius-m);font-size:13.5px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn-primary{background:var(--jade);color:#F7F4EC}
    .btn-primary:hover{background:var(--jade-deep)}
    .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink-1)}
    .btn-outline:hover{border-color:var(--jade);color:var(--jade-deep)}
    .btn-danger{background:transparent;border:1px solid var(--cinnabar);color:var(--cinnabar)}
    .btn-danger:hover{background:var(--cinnabar);color:#fff}
    .btn-mini{padding:5px 12px;font-size:12.5px;border-radius:var(--radius-s)}
    .input{width:100%;max-width:420px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-m);
      font-size:14px;background:var(--card);color:var(--ink-1)}
    .input:focus{outline:none;border-color:var(--jade)}
    .label{display:block;font-size:12.5px;color:var(--ink-2);margin:10px 0 4px}
    .error-box{background:#FFF0F0;border:1px solid rgba(178,58,58,.35);color:var(--cinnabar);padding:10px 14px;
      border-radius:var(--radius-m);font-size:13px;margin:0 0 14px}
    .ok-box{background:rgba(62,124,107,.1);border:1px solid rgba(62,124,107,.35);color:var(--jade-deep);
      padding:10px 14px;border-radius:var(--radius-m);font-size:13px;margin:0 0 14px}
    .hint{font-size:12px;color:var(--ink-3);line-height:1.7}
    .kv{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
    .kv:last-child{border-bottom:none}
    .kv .k{color:var(--ink-2);flex:none}
    .kv .v{color:var(--ink-1);font-weight:600;text-align:right;word-break:break-all;min-width:0}

    /* 表格 */
    .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-m)}
    table.admin-table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
    .admin-table th{background:#f1ece0;color:var(--ink-2);text-align:left;padding:9px 12px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line)}
    .admin-table td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-1);word-break:break-word}
    .admin-table tr:last-child td{border-bottom:none}
    .admin-table tbody tr.clickable{cursor:pointer}
    .admin-table tbody tr.clickable:hover{background:var(--jade-soft)}
    .row-count{font-size:12px;color:var(--ink-3);margin:0 0 8px}
    .empty-note{font-size:13px;color:var(--ink-3);background:var(--card);border:1px dashed var(--line);
      border-radius:var(--radius-m);padding:20px;text-align:center}
    .json-pre{background:#f4f0e6;border:1px solid var(--line);border-radius:var(--radius-m);padding:10px 12px;
      font-family:Consolas,Menlo,monospace;font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-all;
      max-height:340px;overflow:auto;margin-top:8px}

    /* 标签 / 进度小元素 */
    .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
    .tag.ok{background:var(--jade-soft);color:var(--jade-deep)}
    .tag.bad{background:var(--cinnabar-soft);color:var(--cinnabar)}
    .tag.gray{background:#EFEBE2;color:var(--ink-2)}
    .tag.gold{background:rgba(184,137,62,.16);color:#8a6427}
    .tag.clickable{cursor:pointer}
    .tag.clickable:hover{box-shadow:0 0 0 1px currentColor}

    /* 报表页 tab */
    .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
    .tab{padding:7px 16px;border:1px solid var(--line);background:var(--card);border-radius:999px;
      font-size:13px;color:var(--ink-2);transition:.15s}
    .tab:hover{border-color:var(--jade);color:var(--jade-deep)}
    .tab.active{background:var(--jade);border-color:var(--jade);color:#F7F4EC;font-weight:600}

    /* 登录页 */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .login-card{width:100%;max-width:380px}
    .login-brand{font-family:var(--font-serif);font-size:24px;font-weight:700;color:var(--jade-deep);text-align:center;margin-bottom:4px}
    .login-sub{font-size:13px;color:var(--ink-3);text-align:center;margin-bottom:20px}

    /* 用户 / 提示词 行内结构 */
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
    .toolbar .spacer{flex:1}
    .bubble-row{display:flex;margin:5px 0;justify-content:flex-end}
    .bubble-row.left{justify-content:flex-start}

    .crumb{font-size:13px;color:var(--ink-2);margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
    .crumb a{color:var(--jade);cursor:pointer;text-decoration:none}

    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .asset-title{font-size:13px;font-weight:600;color:var(--ink-1);display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
    .asset-key{font-size:11px;color:var(--ink-3);font-family:Consolas,Menlo,monospace;word-break:break-all;text-align:right}
    .asset-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

    .asset-form{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}

    .asset-form-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .asset-form-row .input{flex:1;min-width:150px}
    .asset-mask-row{display:flex;gap:14px;flex-wrap:wrap}
    .asset-mask-row > div{flex:1;min-width:130px}
