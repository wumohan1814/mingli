# 命理 · 部署编排（web 单体 + Caddy HTTPS 反代）
services:
  web:
    build: .
    restart: always
    environment:
      # SQLite 持久化到挂载卷
      MINGLI_DB_PATH: /app/data/mingli_analytics.db
      MINGLI_FEEDBACK_DB_PATH: /app/data/mingli_feedback.db
      MINGLI_OPS_DB_PATH: /app/data/mingli_ops.db
      # 排盘常驻服务（同容器内 127.0.0.1）
      MINGLI_PAIPAN_NODE_URL: http://127.0.0.1:9317
      # 以下从 .env 注入（敏感，不进仓库）
      MINGLI_LLM_API_KEY: ${MINGLI_LLM_API_KEY}
      MINGLI_JWT_SECRET: ${MINGLI_JWT_SECRET}
      MINGLI_AGENT_TOKEN: ${MINGLI_AGENT_TOKEN:-}
      # 合规文书运营主体（节147 续：缺失则 /legal/*.html 服务端渲染 500，fail closed）
      MINGLI_OPERATOR_NAME: ${MINGLI_OPERATOR_NAME}
      MINGLI_OPERATOR_CONTACT: ${MINGLI_OPERATOR_CONTACT}
      MINGLI_OPERATOR_EMAIL: ${MINGLI_OPERATOR_EMAIL}
      # 节146：jinshuju_access_token / _ALLOW_MOCK 已随付款充值链路整条拆除
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      # SQLite 文件持久化到宿主机 /opt/mingli/data
      - /opt/mingli/data:/app/data
    networks:
      mingli:
        ipv4_address: 172.28.0.10

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    # 用 hosts 映射 web，绕开 Docker 内部 DNS（127.0.0.11 → systemd-resolved 偶发 server misbehaving）
    extra_hosts:
      - "web:172.28.0.10"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # 节147：站点域名是可配置项 —— 真实域名只存在于未入库的 .env，仓库里不写
    environment:
      MINGLI_SITE_DOMAIN: ${MINGLI_SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 可选附加站点：默认挂仓库里的空文件（等于不启用）；要启用就在 .env 里
      # 设 MINGLI_CADDY_EXTRA=./ops/deploy/caddy-extra.caddy（该文件被 .gitignore 排除）
      - ${MINGLI_CADDY_EXTRA:-./ops/deploy/caddy-extra.empty}:/etc/caddy/extra.caddy:ro
      # 节113：静态资源由 Caddy 直服，只读挂载 frontend/public（勿挂整个仓库）
      - ./frontend/public:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - mingli

networks:
  mingli:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy_data:
  caddy_config:
