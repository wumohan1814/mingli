# 太初 · 部署编排（web 单体 + Caddy HTTPS 反代）
services:
  web:
    build: .
    restart: always
    environment:
      # SQLite 持久化到挂载卷
      TAICHU_DB_PATH: /app/data/taichu_analytics.db
      TAICHU_FEEDBACK_DB_PATH: /app/data/taichu_feedback.db
      TAICHU_OPS_DB_PATH: /app/data/taichu_ops.db
      # 排盘常驻服务（同容器内 127.0.0.1）
      TAICHU_PAIPAN_NODE_URL: http://127.0.0.1:9317
      # 以下从 .env 注入（敏感，不进仓库）
      TAICHU_LLM_API_KEY: ${TAICHU_LLM_API_KEY}
      TAICHU_JWT_SECRET: ${TAICHU_JWT_SECRET}
      TAICHU_AGENT_TOKEN: ${TAICHU_AGENT_TOKEN:-}
      TAICHU_JINSHUJU_ACCESS_TOKEN: ${TAICHU_JINSHUJU_ACCESS_TOKEN:-}
      TAICHU_JINSHUJU_ALLOW_MOCK: ${TAICHU_JINSHUJU_ALLOW_MOCK:-false}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      # SQLite 文件持久化到宿主机 /opt/taichu/data
      - /opt/taichu/data:/app/data
    networks:
      taichu:
        ipv4_address: 172.28.0.10

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    # 用 hosts 映射 web，绕开 Docker 内部 DNS（127.0.0.11 → systemd-resolved 偶发 server misbehaving）
    extra_hosts:
      - "web:172.28.0.10"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 节113：静态资源由 Caddy 直服，只读挂载 frontend/public（勿挂整个仓库）
      - ./frontend/public:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - taichu

networks:
  taichu:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy_data:
  caddy_config:
